name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # O robô "Atualizar vagas" grava as vagas com a chave automática do GitHub, e
  # gravação feita com essa chave não dispara o "push" acima. Sem esta linha, as
  # vagas do robô ficavam no repositório e só iam para o ar quando alguém
  # gravava do PC. Agora o site é publicado sempre que o robô termina bem.
  workflow_run:
    workflows: ["Atualizar vagas"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    # se o robô falhou, não há nada novo para publicar
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      # Só vai para o ar o que as páginas usam. Os programas do robô, os
      # arquivos do banco, as anotações e os dados internos do coletor
      # continuam no repositório, mas não ficam no endereço do site.
      - name: Separar os arquivos do site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github/' --exclude '_site/' --exclude 'banco/' \
            --exclude '*.py' --exclude '*.bat' --exclude '*.md' --exclude '*.yml' \
            --exclude 'pulso-worker.js' --exclude 'previa-alerta*.html' \
            --exclude 'datas.json' --exclude 'resumos.json' --exclude 'resumos_novos.json' \
            --exclude 'vagas_para_resumo.json' --exclude 'vagas_revisao.json' \
            --exclude 'alertas-enviados.json' --exclude 'vagas-curadoria.json' --exclude 'alignerr-mestres.json'
          echo "Arquivos que vão para o ar: $(find _site -type f | wc -l)"

      # O resumos.json fica fora do site, mas o Meu Controle precisa do resumo
      # das vagas que já saíram da lista para mostrar as candidaturas antigas.
      - name: Guardar os resumos das vagas que já saíram da lista
        run: python3 arquivo_resumos.py _site/resumos-arquivo.json

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
