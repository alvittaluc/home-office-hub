name: Atualizar vagas

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      teste_email:
        description: "Mandar um e-mail de TESTE só para o dono da conta Brevo (não envia para a lista)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rodar o coletor
        run: python3 coletor.py

      # Falha aqui não pode impedir a atualização das vagas, por isso o
      # continue-on-error. Sem o secret BREVO_API_KEY o script não faz nada.
      # Sem o ALERTA_CHAVE, todo mundo recebe só as vagas abertas a todos
      # (ver banco/alerta-areas.sql).
      - name: Avisar as vagas novas por e-mail
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERTA_CHAVE: ${{ secrets.ALERTA_CHAVE }}
        run: |
          if [ "${{ inputs.teste_email }}" = "true" ]; then
            python3 enviar_alerta.py --teste
          else
            python3 enviar_alerta.py
          fi

      - name: Salvar as vagas atualizadas
        run: |
          git config user.name "Robô de Vagas"
          git config user.email "actions@github.com"
          git add vagas.json vagas-especificas.json vagas_para_resumo.json datas.json feed.xml
          if [ -f resumos.json ]; then git add resumos.json; fi
          if [ -f alertas-enviados.json ]; then git add alertas-enviados.json; fi
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nas vagas hoje."
            exit 0
          fi
          BASE=$(git rev-parse HEAD)
          git commit -m "Atualização automática de vagas"
          # Se alguém publicou outra mudança enquanto o robô rodava, o envio é
          # recusado. Há dois casos:
          #  1. Mudança no site, sem mexer nas vagas: as vagas do robô entram por
          #     cima do que chegou.
          #  2. A rotina do PC publicou vagas. A coleta do PC é a mais completa (só
          #     ela lê micro1 e TELUS, e traz os resumos novos), então vale a do PC
          #     inteira. Do robô segue só o registro dos e-mails de alerta que ele
          #     já enviou. Misturar as duas coletas linha a linha poderia deixar o
          #     vagas.json quebrado.
          for tentativa in 1 2 3; do
            if git push; then exit 0; fi
            echo "Envio recusado; conferindo o que mudou ($tentativa de 3)."
            git fetch --depth=50 origin main
            if git diff --quiet "$BASE" origin/main -- vagas.json vagas-especificas.json; then
              git rebase origin/main || { git rebase --abort; exit 1; }
            else
              echo "O PC publicou vagas mais novas; fica valendo a coleta do PC."
              cp alertas-enviados.json /tmp/alertas-enviados.json 2>/dev/null || true
              git reset --hard origin/main
              if [ -f /tmp/alertas-enviados.json ]; then
                cp /tmp/alertas-enviados.json alertas-enviados.json
                git add alertas-enviados.json
              fi
              git diff --staged --quiet || git commit -m "Registro dos alertas de vagas enviados"
            fi
            BASE=$(git rev-parse origin/main)
            sleep 5
          done
          exit 1
