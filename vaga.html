<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhes da vaga — Home Office Hub</title>
<meta name="description" content="Detalhes da vaga: o que você vai fazer e os requisitos.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Detalhes da vaga — Home Office Hub">
<meta property="og:description" content="O que você vai fazer e os requisitos desta vaga.">
<meta property="og:url" content="https://alvittaluc.github.io/home-office-hub/vaga.html">
<meta property="og:image" content="https://alvittaluc.github.io/home-office-hub/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  .pagina { max-width:840px; margin:0 auto; padding:30px 20px 60px; }
  .voltar { display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12.5px; color:var(--ink-2); margin-bottom:24px; transition:color .15s; }
  .voltar:hover { color:var(--signal); }

  .cabeca { border-bottom:1px solid var(--line-soft); padding-bottom:24px; margin-bottom:28px; }
  .cabeca .cat { font-family:var(--mono); font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--signal); margin-bottom:12px; }
  .cabeca h1 { font-family:var(--display); font-weight:400; font-size:clamp(26px,4vw,38px); line-height:1.14; letter-spacing:-0.02em; color:var(--ink); margin-bottom:16px; }
  .co-linha { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .co-linha .logo-box { width:40px; height:40px; }
  .co-linha .nm { font-family:var(--body); font-weight:600; font-size:15px; color:var(--ink); }
  .co-linha .sb { font-family:var(--mono); font-size:11.5px; color:var(--ink-3); }
  .co-linha a.sobre { margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--ink-3); transition:color .15s; }
  .co-linha a.sobre:hover { color:var(--signal); }
  .metas { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
  .metas .tag { font-size:11.5px; padding:5px 11px; }

  .parte { margin-bottom:26px; }
  .parte h2 {
    font-family:var(--mono); font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-2); margin-bottom:12px; display:flex; align-items:center; gap:9px;
  }
  .parte h2::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--signal); flex-shrink:0; }
  .parte p { font-size:15.5px; color:var(--ink); line-height:1.72; }

  .barra { position:sticky; bottom:0; background:linear-gradient(transparent,var(--bg) 32%); padding:24px 0 10px; margin-top:34px; }
  .candidatar {
    display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
    font-family:var(--mono); font-weight:600; font-size:15px; color:#fff;
    background:var(--signal); border:none; border-radius:12px; padding:16px; transition:all .16s;
  }
  .candidatar:hover { gap:13px; filter:brightness(1.08); }
  .nota { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); text-align:center; margin-top:14px; }
  .ajuda { margin-top:26px; text-align:center; font-size:13px; color:var(--ink-3); }
  .ajuda a { color:var(--signal); }

  /* ── Meu Controle: a tarja de "você já aplicou" e o botão de marcar ── */
  .aplic {
    display:flex; align-items:center; gap:13px; flex-wrap:wrap;
    margin-top:22px; padding:14px 18px; border-radius:15px;
    background:var(--panel,#fff); border:1px solid var(--line-soft,#EAE4D9); font-size:13.5px;
  }
  /* display:flex anula o atributo hidden, então a regra precisa ser explícita.
     Sem ela a tarja aparecia vazia para quem não usa o Meu Controle. */
  .aplic[hidden] { display:none; }
  .aplic.sim { background:#E4F3F0; border-color:#C6E5DE; color:#1F7A6E; }
  .aplic b { color:inherit; font-weight:600; }
  .aplic .aplic-txt { flex:1; min-width:180px; line-height:1.5; }
  .aplic button, .aplic a.bt {
    font:inherit; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap;
    padding:9px 16px; border-radius:999px; border:1px solid var(--line,#DED7CA);
    background:#fff; color:var(--ink,#10203A); transition:all .16s;
  }
  .aplic button:hover, .aplic a.bt:hover { border-color:var(--signal,#1A4893); color:var(--signal,#1A4893); }
</style>
</head>
<body>

<div class="pagina">
  <a href="vagas.html" class="voltar">← voltar para todas as vagas</a>
  <div id="conteudo"><div class="vazio"><div class="big">◌</div><p>Carregando vaga…</p></div></div>
</div>

<script src="layout.js"></script>
<script src="controle-dados.js"></script>
<script>
montarLayout("vagas");

let EMPRESAS = {};

/* Mesma regra da lista: "nova" só quando a data veio da própria empresa.
   Sem data oficial o selo fala de quando a vaga entrou no hub, não de
   quando foi publicada, e por isso não pode se chamar de nova. */
function seloData(v) {
  const d = v.data_ref || v.data_post || v.data_vista;
  if (!d) return "";
  const data = new Date(d + "T12:00:00Z");
  if (isNaN(data)) return "";
  const dias = Math.floor((new Date() - data) / 86400000);
  if (dias < 0) return "";
  const oficial = v.data_oficial === true || (v.data_oficial === undefined && !!v.data_post);
  if (!oficial) {
    if (dias <= 30) return `<span class="tag">no hub há ${dias} dias</span>`;
    return '<span class="tag">no hub há mais de um mês</span>';
  }
  if (dias <= 2)  return '<span class="tag amb">nova</span>';
  if (dias <= 7)  return `<span class="tag amb">há ${dias} dias</span>`;
  if (dias <= 30) return `<span class="tag">há ${dias} dias</span>`;
  if (dias <= 60) return '<span class="tag">há +1 mês</span>';
  return '<span class="tag">há +2 meses</span>';
}

function erro(msg) {
  return `<div class="vazio"><div class="big">◌</div><p>${msg}</p>
    <p style="margin-top:18px;"><a href="vagas.html" style="color:var(--signal);">← ver todas as vagas</a></p></div>`;
}

(async function(){
  const id = new URLSearchParams(location.search).get("id");
  const cont = document.getElementById("conteudo");

  try {
    const base = await lerEmpresas();
    (base.empresas || []).forEach(e => EMPRESAS[e.id] = e);
  } catch (e) { console.error("empresas.json", e); }
  if (!id) { cont.innerHTML = erro("Vaga não especificada."); return; }

  let dados;
  try { dados = await lerVagas(); selo(dados); }
  catch (e) { cont.innerHTML = erro("Não foi possível carregar a vaga agora."); console.error(e); return; }

  const v = (dados.vagas || []).find(x => x.id === id);
  if (!v) { cont.innerHTML = erro("Esta vaga não está mais disponível.<br>Ela pode ter sido preenchida ou expirado."); return; }

  // Vaga vinda de fonte que não tem página de detalhe (o LinkedIn era assim).
  // Se alguém chegar aqui por link antigo, mandamos direto para o anúncio.
  if (!v.resumo && v.url && v.fonte !== "direto") {
    location.replace(v.url);
    return;
  }

  const e = EMPRESAS[v.empresa] || { nome:v.empresa, sigla:"?", cor:"#888", bg:"#222", desc:"" };
  const r = v.resumo || {};
  document.title = v.titulo + " — Home Office Hub";

  let partes = "";
  if (r.o_que_faz)  partes += `<div class="parte"><h2>O que você vai fazer</h2><p>${esc(r.o_que_faz)}</p></div>`;
  if (r.requisitos) partes += `<div class="parte"><h2>Requisitos</h2><p>${esc(r.requisitos)}</p></div>`;
  if (!partes) partes = `<div class="parte"><p style="color:var(--ink-3);font-size:14.5px;">Esta vaga ainda não tem resumo detalhado. Clique em candidatar para ver todos os detalhes na página oficial da empresa.</p></div>`;

  cont.innerHTML = `
    <div class="cabeca">
      <div class="cat">${esc(v.badge || "Vaga")}</div>
      <h1>${esc(v.titulo)}</h1>
      <div class="co-linha">
        <span class="logo-box" style="background:${e.bg};color:${e.cor};">${logoHtml(e,40)}</span>
        <div><div class="nm">${esc(e.nome)}</div><div class="sb">${esc(e.desc || "")}</div></div>
        ${e.agregador ? "" : `<a class="sobre" href="empresas.html#${e.id}">sobre a empresa ↗</a>`}
      </div>
      <div class="metas">
        <span class="tag">${esc(v.local || "Remoto · Brasil")}</span>
        ${r.contrato ? `<span class="tag">${esc(r.contrato)}</span>` : ""}
        ${r.remuneracao ? `<span class="tag sig">${esc(r.remuneracao)}</span>` : ""}
        ${seloData(v)}
      </div>
    </div>
    ${partes}
    <div class="aplic" id="jaApliquei" hidden></div>
    <div class="barra">
      <a href="${esc(v.url)}" target="_blank" rel="noopener" class="candidatar">Candidatar para esta vaga →</a>
      <div class="nota">Você vai para a página oficial da vaga, sem intermediário.</div>
    </div>
    <div class="ajuda">
      Antes de se candidatar, veja como montar o <a href="como-funciona.html#curriculo">currículo que passa nessas vagas</a>
      e <a href="como-funciona.html#pagamento">como o pagamento chega ao Brasil</a>.
    </div>`;

  /* ══════════════════════════════════════════════════════════
     "Já apliquei para essa vaga?"

     A resposta mora no Meu Controle, que guarda tudo dentro do
     navegador do próprio visitante. Aqui a gente só pergunta.
     Se a ferramenta não estiver junto, ou o navegador não deixar,
     a tarja simplesmente não aparece e a página segue igual.
     ══════════════════════════════════════════════════════════ */
  try {
    if (typeof Dados === "undefined") return;
    const tarja = document.getElementById("jaApliquei");
    if (!tarja) return;

    async function desenharTarja() {
      const achada = await Dados.procurarAplicacao({ vagaId: v.id, empresa: e.nome, titulo: v.titulo });
      tarja.hidden = false;
      if (achada) {
        tarja.className = "aplic sim";
        tarja.innerHTML = `<span class="aplic-txt">Você aplicou para esta vaga em
          <b>${esc(Dados.dataBonita(achada.data))}</b>.</span>
          <a class="bt" href="controle.html#aplicacoes">Ver no Meu Controle</a>`;
      } else {
        tarja.className = "aplic";
        tarja.innerHTML = `<span class="aplic-txt">Guarde esta candidatura no
          <b>Meu Controle</b> para não ficar em dúvida depois.</span>
          <button type="button" id="btMarcar">Marcar como aplicada</button>`;
        document.getElementById("btMarcar").addEventListener("click", async function () {
          this.disabled = true;
          try {
            await Dados.salvar("aplicacoes", {
              vagaId: v.id, empresa: e.nome, titulo: v.titulo, url: v.url,
              data: Dados.hoje(), estado: "aplicado", origem: "Home Office Hub",
              remuneracao: (v.resumo && v.resumo.remuneracao) || "",
              proximo: "", proximoEm: "", observacoes: "", email: "", curriculo: "",
            });
            await desenharTarja();
          } catch (err) { this.disabled = false; console.error(err); }
        });
      }
    }
    await Dados.abrir();
    await desenharTarja();
  } catch (err) {
    console.warn("Meu Controle indisponível nesta página", err);
  }
})();
</script>
</body>
</html>
