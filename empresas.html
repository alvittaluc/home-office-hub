<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Quem é quem no mercado de dados e inteligência artificial: Welocalize, RWS TrainAI, Toloka, OneForma, CrowdGen, TELUS e Outlier. O que fazem, como entrar e como pagam.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  .topo { max-width:var(--wrap); margin:0 auto; padding:52px 20px 30px; }
  .topo h1 { font-family:var(--display); font-weight:400; letter-spacing:-0.02em; font-size:clamp(28px,4.4vw,44px); line-height:1.06; margin-bottom:14px; max-width:18ch; }
  .topo p.lead { margin-bottom:26px; }

  .corpo { max-width:var(--wrap); margin:0 auto; padding:0 20px 60px; display:grid; grid-template-columns:210px 1fr; gap:40px; align-items:start; }
  @media (max-width:960px){ .corpo{ grid-template-columns:1fr; gap:0; } }

  .trilho { position:sticky; top:86px; padding-top:6px; }
  @media (max-width:960px){ .trilho{ display:none; } }
  .trilho h4 { font-family:var(--mono); font-size:10.5px; letter-spacing:0.11em; text-transform:uppercase; color:var(--ink-3); margin-bottom:12px; font-weight:500; }
  .trilho a {
    display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink-2);
    padding:8px 10px; border-radius:8px; transition:all .15s;
  }
  .trilho a:hover { background:var(--panel); color:var(--ink); }
  .trilho a.on { background:var(--panel-2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  .trilho a .pt { width:6px; height:6px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .trilho a.on .pt { background:var(--signal); }

  /* ficha da empresa */
  .ficha {
    border:1px solid var(--line-soft); border-radius:16px; background:var(--panel);
    margin-bottom:18px; overflow:hidden; scroll-margin-top:82px;
  }
  .ficha-topo {
    display:flex; align-items:flex-start; gap:16px; padding:24px;
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(160deg,var(--panel-2),transparent 70%);
  }
  .ficha-topo .logo-box { width:54px; height:54px; }
  .ficha-topo .id { flex:1; min-width:0; }
  .ficha-topo h2 { font-family:var(--display); font-weight:400; font-size:24px; line-height:1.2; letter-spacing:-0.015em; color:var(--ink); }
  .ficha-topo .sub { font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-top:3px; }
  .ficha-topo .st { display:flex; flex-direction:column; align-items:flex-end; gap:7px; flex-shrink:0; }
  @media (max-width:640px){
    .ficha-topo { flex-wrap:wrap; padding:20px; }
    .ficha-topo .st { flex-direction:row; align-items:center; width:100%; }
  }

  .ficha-corpo { padding:22px 24px 24px; }
  @media (max-width:640px){ .ficha-corpo{ padding:18px 20px 20px; } }
  .ficha-corpo > p.resumo { font-size:14.5px; color:var(--ink-2); line-height:1.65; margin-bottom:20px; max-width:74ch; }

  .dados {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
    background:var(--line-soft); border:1px solid var(--line-soft); border-radius:11px;
    overflow:hidden; margin-bottom:22px;
  }
  .dado { background:var(--bg-soft); padding:13px 14px; }
  .dado .k { font-family:var(--mono); font-size:9.5px; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:5px; }
  .dado .v { font-size:12.5px; color:var(--ink); line-height:1.45; }

  .blocos { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
  @media (max-width:720px){ .blocos{ grid-template-columns:1fr; } }
  .bloco { background:rgba(255,255,255,0.014); border:1px solid var(--line-soft); border-radius:11px; padding:16px 17px; }
  .bloco h4 {
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--signal); margin-bottom:9px; font-weight:500; display:flex; align-items:center; gap:8px;
  }
  .bloco h4::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--signal); }
  .bloco p { font-size:13.5px; color:var(--ink-2); line-height:1.6; }

  .aviso {
    display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:11px;
    background:var(--amber-suave); border:1px solid #F0DCC6; margin-bottom:20px;
  }
  .aviso .ic { color:var(--amber); font-size:14px; line-height:1.3; flex-shrink:0; }
  .aviso p { font-size:13.5px; color:var(--ink-2); line-height:1.6; }
  .aviso b { color:var(--amber); font-weight:600; }

  .ficha-acoes { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  .link-in {
    display:inline-flex; align-items:center; gap:6px; margin-left:4px;
    font-family:var(--body); font-size:13.5px; color:var(--ink-3);
    transition:color .16s;
  }
  .link-in svg { width:15px; height:15px; fill:currentColor; flex-shrink:0; }
  .link-in:hover { color:var(--signal); }
  @media (max-width:520px) { .link-in { margin-left:0; } }
  .areas-linha { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:18px; }

  /* ── letreiro das empresas ──
     Corre devagar e sem parar, com as bordas apagando. Para quando o mouse
     passa por cima ou o teclado entra. Cada empresa leva para a ficha dela,
     mais abaixo na página. Quem pediu menos movimento vê a lista parada. */
  .faixa { max-width:var(--wrap); margin:0 auto; padding:0 22px 40px; }
  .letreiro { overflow:hidden; min-height:48px;
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 10%, #000 90%, transparent 100%);
            mask-image:linear-gradient(to right, transparent 0, #000 10%, #000 90%, transparent 100%); }
  .letreiro-trilho { display:flex; width:max-content; animation:letreiro var(--duracao, 60s) linear infinite; }
  .letreiro:hover .letreiro-trilho, .letreiro:focus-within .letreiro-trilho { animation-play-state:paused; }
  @keyframes letreiro { to { transform:translateX(-50%); } }
  .letreiro-lista { display:flex; }
  .letreiro-emp { display:flex; align-items:center; gap:11px; padding:7px 28px; white-space:nowrap; border-left:1px solid var(--line-soft);
    color:var(--ink); font-size:15px; font-weight:500; letter-spacing:-0.005em; transition:color .15s; }
  .letreiro-emp:hover { color:var(--signal); }
  .letreiro-emp .marca { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex-shrink:0; overflow:hidden;
    font-size:11.5px; font-weight:600; }
  @media (max-width:700px){ .faixa { padding-bottom:26px; } .letreiro-emp { padding:7px 18px; font-size:14px; } }
  @media (prefers-reduced-motion:reduce){
    .letreiro { -webkit-mask-image:none; mask-image:none; }
    .letreiro-trilho { animation:none; width:auto; justify-content:center; }
    .letreiro-lista { flex-wrap:wrap; justify-content:center; row-gap:10px; }
    .letreiro-lista[aria-hidden="true"] { display:none; }
  }
</style>
</head>
<body>

<section class="topo">
  <div class="eyebrow">Quem está no mercado</div>
  <h1>As empresas que contratam brasileiros para treinar IA</h1>
  <p class="lead">O que cada empresa faz, que tipo de projeto oferece, como é o processo de entrada e como o pagamento chega até você.</p>
</section>

<!-- letreiro com todas as empresas; cada uma leva para a sua ficha -->
<section class="faixa" aria-label="Ir para a ficha de uma empresa">
  <div class="letreiro"><div class="letreiro-trilho" id="letreiroTrilho"></div></div>
</section>

<div class="corpo">
  <aside class="trilho">
    <h4>Empresas</h4>
    <div id="trilhoLista"></div>
  </aside>
  <div id="fichas"></div>
</div>

<script src="layout.js"></script>
<script>
/* ícone do LinkedIn, desenhado aqui para não depender de biblioteca externa */
const IC_LINKEDIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.76-1.95C20.3 8.75 21 11 21 14.1V21h-4v-6.1c0-1.45-.03-3.32-2.05-3.32-2.05 0-2.36 1.58-2.36 3.21V21H9z"/></svg>';

montarLayout("empresas");

(async function(){
  let base = { empresas: [] };
  try { base = await lerEmpresas(); } catch(e) { console.error("empresas.json", e); }

  const lista = base.empresas || [];

  /* ── letreiro ──
     A lista vai duas vezes no trilho, para a volta ficar sem emenda; a
     segunda cópia fica escondida de leitores de tela e do teclado. */
  const trilhoLetreiro = document.getElementById("letreiroTrilho");
  if (trilhoLetreiro && lista.length) {
    const cor = c => /^#[0-9a-f]{3,8}$/i.test(c || "") ? c : "";
    const item = (e, copia) => `<a class="letreiro-emp" href="#${encodeURIComponent(e.id)}"${copia ? ' tabindex="-1"' : ""}>
        <span class="marca" style="background:${cor(e.bg)};color:${cor(e.cor)};">${logoHtml(e, 34)}</span>${esc(e.nome)}</a>`;
    trilhoLetreiro.innerHTML = `<div class="letreiro-lista">${lista.map(e => item(e, false)).join("")}</div>
      <div class="letreiro-lista" aria-hidden="true">${lista.map(e => item(e, true)).join("")}</div>`;
    trilhoLetreiro.style.setProperty("--duracao", Math.max(32, lista.length * 5) + "s");
  } else if (trilhoLetreiro) {
    trilhoLetreiro.closest(".faixa").hidden = true;
  }

  // trilho lateral
  document.getElementById("trilhoLista").innerHTML = lista.map(e =>
    `<a href="#${e.id}" data-alvo="${e.id}"><span class="pt"></span>${esc(e.nome)}</a>`).join("");

  // fichas
  document.getElementById("fichas").innerHTML = lista.map(e => {
    return `<article class="ficha" id="${e.id}">
      <div class="ficha-topo">
        <span class="logo-box" style="background:${e.bg};">${logoHtml(e,54)}</span>
        <div class="id">
          <h2>${esc(e.nome)}</h2>
          <div class="sub">${esc(e.tipo)} · ${esc(e.sede)}</div>
        </div>
      </div>
      <div class="ficha-corpo">
        <p class="resumo">${esc(e.resumo)}</p>

        <div class="areas-linha">
          ${(e.areas||[]).map(a => `<span class="tag blu">${esc(a)}</span>`).join("")}
        </div>

        <div class="dados">
          <div class="dado"><div class="k">Fundação</div><div class="v">${esc(e.fundada)}</div></div>
          <div class="dado"><div class="k">Sede</div><div class="v">${esc(e.sede)}</div></div>
          <div class="dado"><div class="k">Porte</div><div class="v">${esc(e.porte)}</div></div>
          <div class="dado"><div class="k">Clientes conhecidos</div><div class="v">${esc(e.clientes)}</div></div>
        </div>

        <div class="blocos">
          <div class="bloco"><h4>O que você faz</h4><p>${esc(e.o_que_voce_faz)}</p></div>
          <div class="bloco"><h4>Como entrar</h4><p>${esc(e.como_entrar)}</p></div>
          <div class="bloco"><h4>Como paga</h4><p>${esc(e.pagamento)}</p></div>
          <div class="bloco"><h4>Boa para quem</h4><p>${esc(e.bom_para || "")}</p></div>
        </div>

        ${e.atencao ? `<div class="aviso"><span class="ic">▲</span><p><b>Atenção.</b> ${esc(e.atencao)}</p></div>` : ""}

        <div class="ficha-acoes">
          <a href="vagas.html?empresa=${e.id}" class="btn primary">Ver vagas desta empresa <span class="arr">→</span></a>
          <a href="${esc(e.site)}" target="_blank" rel="noopener" class="btn ghost">Site oficial ↗</a>
          ${e.linkedin ? `<a href="${esc(e.linkedin)}" target="_blank" rel="noopener" class="link-in" aria-label="${esc(e.nome)} no LinkedIn">${IC_LINKEDIN}LinkedIn ↗</a>` : ""}
        </div>
      </div>
    </article>`;
  }).join("");

  // trilho acompanha a rolagem
  const links = [...document.querySelectorAll("#trilhoLista a")];
  const obs = new IntersectionObserver(ent => {
    ent.forEach(e => { if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.dataset.alvo === e.target.id)); });
  }, { rootMargin: "-30% 0px -60% 0px" });
  document.querySelectorAll(".ficha").forEach(f => obs.observe(f));

  // se veio com âncora na URL, rola até lá depois de montar
  if (location.hash) {
    const alvo = document.getElementById(location.hash.slice(1));
    if (alvo) setTimeout(() => alvo.scrollIntoView({ behavior:"smooth", block:"start" }), 120);
  }
})();
</script>
</body>
</html>
