<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentorias — Home Office Hub</title>
<meta name="description" content="Entre numa vaga com a ajuda de quem já trabalha nela. Mentorias gratuitas, com mentores aprovados pelo Hub.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
/* ══════════════════════════════════════════════════════════════
   MENTORIAS — a lista.
   Quem já trabalha numa vaga abre um grupo e acompanha quem quer
   entrar nela. As regras de quem pode o quê ficam
   no banco (banco/mentorias.sql); esta página só mostra.
   ══════════════════════════════════════════════════════════════ */
.mt-main { max-width:var(--wrap,1180px); margin:0 auto; padding:48px 20px 96px; min-height:60vh; }
.mt-hero { max-width:700px; margin-bottom:30px; }
.mt-hero h1 { font-family:var(--display,'Hedvig Letters Serif',Georgia,serif); font-weight:400;
  font-size:clamp(30px,4.2vw,48px); line-height:1.08; letter-spacing:-0.015em; color:var(--ink,#10203A); margin:0 0 14px; }
.mt-lead { font-size:17px; line-height:1.62; color:var(--ink-2,#54606F); margin:0; }
.mt-regras { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:0 0 34px; max-width:860px; }
.mt-regra { background:var(--panel,#fff); border:1px solid var(--line-soft,#EAE4D9); border-radius:16px; padding:16px 18px; font-size:14px; line-height:1.5; color:var(--ink-2,#54606F); }
.mt-regra b { display:block; color:var(--ink,#10203A); font-weight:600; font-size:14.5px; margin-bottom:3px; }
.mt-tit { display:flex; align-items:baseline; gap:10px; margin:30px 0 12px; }
.mt-tit h2 { font-size:17px; font-weight:600; letter-spacing:-0.01em; color:var(--ink,#10203A); margin:0; }
.mt-tit span { font-size:13px; color:var(--ink-3,#8A94A1); }
.mt-grade { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.mt-card { display:flex; flex-direction:column; gap:12px; background:var(--panel,#fff); border:1px solid var(--line-soft,#EAE4D9);
  border-radius:18px; padding:20px 22px; text-decoration:none; transition:border-color .18s, transform .18s, box-shadow .18s; min-width:0; }
.mt-card:hover { border-color:var(--line,#DED7CA); transform:translateY(-2px); box-shadow:0 14px 30px -22px rgba(16,32,58,.25); }
.mt-quem { display:flex; align-items:center; gap:12px; min-width:0; }
.mt-quem .nm { font-weight:600; font-size:15px; color:var(--ink,#10203A); }
.mt-quem .sb { font-size:12.5px; color:var(--ink-3,#8A94A1); }
.mt-vaga { font-size:16.5px; font-weight:600; line-height:1.3; letter-spacing:-0.01em; color:var(--ink,#10203A); }
.mt-vaga small { display:block; font-size:13px; font-weight:400; color:var(--ink-2,#54606F); margin-top:2px; }
.mt-txt { font-size:14px; line-height:1.55; color:var(--ink-2,#54606F); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.mt-pe { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:12.5px; color:var(--ink-3,#8A94A1); margin-top:auto; }
.mt-pe .nota { color:var(--ink,#10203A); font-weight:600; }
.mt-vazio { border:1px dashed var(--line,#DED7CA); border-radius:18px; padding:30px 24px; text-align:center; color:var(--ink-2,#54606F); font-size:14.5px; line-height:1.6; }
.mt-espera { text-align:center; padding:70px 20px; color:var(--ink-3,#8A94A1); font-size:14px; }

.mt-serMentor { margin-top:44px; background:var(--escuro,#0F1D33); color:var(--ink-claro,#F2EFE9); border-radius:22px; padding:28px 28px 26px; }
.mt-serMentor h2 { font-family:var(--display,'Hedvig Letters Serif',Georgia,serif); font-weight:400; font-size:26px; line-height:1.15; margin:0 0 8px; }
.mt-serMentor p { font-size:15px; line-height:1.6; color:var(--ink-claro-2,#A9B6C6); margin:0 0 16px; max-width:640px; }
.mt-form { background:var(--panel,#fff); border:1px solid var(--line-soft,#EAE4D9); border-radius:18px; padding:24px 26px 26px; margin-top:16px; max-width:720px; }
.mt-form h3 { font-size:17px; font-weight:600; color:var(--ink,#10203A); margin:0 0 4px; }
.mt-form > p { font-size:14px; line-height:1.55; color:var(--ink-2,#54606F); margin:0; }
.mt-form .regra { font-size:13px; line-height:1.55; color:var(--ink-2,#54606F); background:var(--bg-soft,#F1ECE3); border-radius:12px; padding:12px 14px; margin-top:18px; }
.mt-acoes { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:18px; }
.mt-abas { display:flex; gap:4px; box-shadow:inset 0 -1px 0 var(--line,#DED7CA); margin:-14px 0 30px; overflow-x:auto; overflow-y:hidden; }
.mt-abas button { font:inherit; font-size:14.5px; font-weight:500; color:var(--ink-2,#54606F); background:none; border:0;
  border-bottom:2px solid transparent; padding:11px 14px; cursor:pointer; white-space:nowrap; }
.mt-abas button:hover { color:var(--ink,#10203A); }
.mt-abas button[aria-selected="true"] { color:var(--ink,#10203A); font-weight:600; border-bottom-color:var(--signal,#1A4893); }
.mt-quantas { font-size:12.5px; font-weight:400; color:var(--ink-3,#8A94A1); margin-left:3px; }
.mt-conta { display:inline-block; min-width:20px; padding:1px 6px; margin-left:4px; border-radius:99px; font-size:12px; font-weight:600;
  text-align:center; color:#fff; background:var(--signal,#1A4893); }
.mt-den { background:var(--panel,#fff); border:1px solid var(--line-soft,#EAE4D9); border-radius:18px; padding:18px 22px 20px; margin-bottom:12px; max-width:860px; }
.mt-den-cab { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; font-size:15px; color:var(--ink,#10203A); }
.mt-den-cab b { font-weight:600; }
.mt-den-nota { font-size:13.5px; color:var(--ink-3,#8A94A1); margin:12px 0 0; }
.mt-den textarea { min-height:70px; }
.mt-den-av { margin-top:12px; font-size:13.5px; color:var(--ink-3,#8A94A1); }
.mt-den-av p { font-size:14.5px; line-height:1.55; color:var(--ink,#10203A); margin:6px 0 0; overflow-wrap:anywhere; }
.mt-anexo-nota { font-size:12.5px; color:var(--ink-3,#8A94A1); margin-left:10px; }
.mt-demo {font-size:12.5px; background:#FBF0E4; color:#A85D24; border-radius:10px; padding:8px 12px; margin-bottom:18px; }

@media (max-width:860px){ .mt-regras { grid-template-columns:1fr; } .mt-grade { grid-template-columns:1fr; } .mt-main { padding-top:34px; } }
</style>
</head>
<body>

<main class="mt-main">
  <div class="mt-espera" id="espera">Abrindo…</div>
  <div id="tela" hidden></div>
</main>

<script src="layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<script src="mentorias-dados.js?v=6"></script>
<script>
try { montarLayout("mentorias"); } catch (e) { console.warn(e); }

(async function () {
  "use strict";
  const U = MD.ui, e = U.e;
  const espera = document.getElementById("espera"), tela = document.getElementById("tela");

  const topo = `
    <div class="mt-hero">
      <div class="eyebrow">Mentorias</div>
      <h1>Entre numa vaga com a ajuda de quem já trabalha nela</h1>
      <p class="mt-lead">Quem já faz o trabalho abre um grupo e acompanha quem quer entrar: currículo, teste de entrada
        e as dúvidas das primeiras semanas. Participar é gratuito.</p>
    </div>
    <div class="mt-regras">
      <div class="mt-regra"><b>Mentores verificados</b>Todo mentor comprova que trabalha na vaga antes de o grupo ir ao ar.</div>
      <div class="mt-regra"><b>Grupos fechados</b>Só o mentor e as pessoas que ele aceitou leem e escrevem no mural.</div>
    </div>`;

  if (!MD.disponivel) { espera.textContent = "Não deu para falar com o servidor de contas. Confira a internet e recarregue a página."; return; }
  let eu = null;
  try { eu = await MD.eu(); } catch (err) { console.warn(err); }
  if (!eu) {
    espera.hidden = true; tela.hidden = false;
    tela.innerHTML = topo + Acesso.htmlAviso("As mentorias são para quem tem conta", "Entre na sua conta para ver as mentorias abertas e participar.");
    return;
  }

  U.porCss();
  let perfil = null, lista = [], minhas = { como_mentor: [], como_membro: [] }, denuncias = [];

  function cartao(m, extra) {
    const nota = m.nota ? `<span>${U.estrelas(m.nota)} <span class="nota">${String(m.nota).replace(".", ",")}</span> (${m.avaliacoes})</span>` : `<span>ainda sem avaliação</span>`;
    return `<a class="mt-card" href="mentoria.html?id=${encodeURIComponent(m.id)}${m.pedidos ? "#participantes" : ""}">
      <div class="mt-quem">${U.foto(m.mentor, 44)}<div><div class="nm">${e(m.mentor.nome)}</div><div class="sb">mentor</div></div>
        ${extra ? `<span style="margin-left:auto">${extra}</span>` : ""}</div>
      <div class="mt-vaga">${e(m.vaga_titulo)}<small>${e(m.empresa)}</small></div>
      <div class="mt-txt">${e(m.como_ajuda)}</div>
      <div class="mt-pe">${nota}<span>${m.membros} ${m.membros === 1 ? "participante" : "participantes"}</span>
        ${m.status === "aprovada" ? `<span>${e(U.ultimaResposta(m))}</span>` : ""}</div>
    </a>`;
  }

  const NOME_STATUS = { pendente: "em análise", aprovada: "no ar", recusada: "recusada", encerrada: "encerrada",
                        pedido: "pedido enviado", aprovado: "participando", recusado: "não aceito" };
  const etq = s => `<span class="md-etq ${e(s)}">${e(NOME_STATUS[s] || s)}</span>`;

  /* Mentoria encerrada ou recusada não some: vai sozinha para a aba
     "Arquivadas", para a lista principal ficar só com o que está em andamento. */
  const arquivada = m => m.status === "encerrada" || m.status === "recusada";
  const arquivadas = () => minhas.como_mentor.concat(minhas.como_membro).filter(arquivada);

  function htmlArquivadas() {
    const cartoes = minhas.como_mentor.filter(arquivada).map(m => cartao(m, etq(m.status)))
      .concat(minhas.como_membro.filter(arquivada).map(m => cartao(m, etq(m.status))));
    return `<div class="mt-hero" style="margin-bottom:22px">
        <h1>Arquivadas</h1>
        <p class="mt-lead">Mentorias encerradas e pedidos que não foram aprovados. Nada é apagado: abra qualquer uma para reler o mural.</p>
      </div>
      <div class="mt-grade">${cartoes.join("")}</div>`;
  }

  function desenhar() {
    const meus = minhas.como_mentor.filter(m => !arquivada(m)).map(m => cartao(m, etq(m.status) +
        (m.pedidos ? ` <span class="md-etq pedido">${m.pedidos} ${m.pedidos === 1 ? "pedido" : "pedidos"}</span>` : "")))
      .concat(minhas.como_membro.filter(m => !arquivada(m)).map(m => cartao(m, etq(m.meu_status))));
    const idsMeus = new Set(minhas.como_mentor.concat(minhas.como_membro).map(m => m.id));
    const outras = lista.filter(m => !idsMeus.has(m.id));

    tela.innerHTML = `
      ${MD.demo ? `<div class="mt-demo">Modo de demonstração (${e(MD.demo)}): dados de exemplo, nada é gravado no banco.</div>` : ""}
      ${htmlAbas()}
      ${aba === "denuncias" ? htmlDenuncias() : aba === "arquivadas" ? htmlArquivadas() : `
      ${topo}
      ${meus.length ? `<div class="mt-tit"><h2>Minhas mentorias</h2><span>${meus.length}</span></div>
        <div class="mt-grade">${meus.join("")}</div>` : ""}
      <div class="mt-tit"><h2>${meus.length ? "Outras mentorias" : "Mentorias abertas"}</h2><span>${outras.length}</span></div>
      ${outras.length ? `<div class="mt-grade">${outras.map(m => cartao(m)).join("")}</div>`
        : `<div class="mt-vazio">${lista.length ? "Você já participa de todas as mentorias abertas."
            : "Nenhuma mentoria aberta por enquanto.<br>Se você já trabalha em alguma vaga, pode abrir a primeira."}</div>`}

      <section class="mt-serMentor" id="serMentor">
        <h2>Trabalha em alguma vaga? Abra a sua mentoria</h2>
        <p>Você apresenta a vaga e acompanha quem quer entrar nela. Se a empresa tiver programa de indicação, pode usar o seu link.
          Todo pedido passa por análise antes de ir ao ar.</p>
        <button class="md-bt claro" type="button" id="btAbrirForm">Quero ser mentor</button>
      </section>
      <div id="formMentor" hidden></div>`}`;

    const bt = tela.querySelector("#btAbrirForm");
    if (bt) bt.addEventListener("click", abrirForm);
  }

  /* ── Abas ──
     Quem não tem mentoria arquivada nem denúncia não vê aba nenhuma: a página
     é só a lista. As abas "Arquivadas" e "Suas denúncias" só aparecem para
     quem tem alguma coisa nelas. */
  let aba = "mentorias";
  const temAba = nome => nome === "denuncias" ? denuncias.length > 0 : nome === "arquivadas" ? arquivadas().length > 0 : nome === "mentorias";
  function htmlAbas() {
    if (!temAba("denuncias") && !temAba("arquivadas")) return "";
    const novas = denuncias.filter(d => esperaVoce(d) || faltaNota(d)).length;
    return `<nav class="mt-abas" role="tablist" aria-label="Partes da página">
      <button type="button" role="tab" data-aba="mentorias" aria-selected="${aba === "mentorias"}">Mentorias</button>
      ${temAba("arquivadas") ? `<button type="button" role="tab" data-aba="arquivadas" aria-selected="${aba === "arquivadas"}">Arquivadas
        <span class="mt-quantas">${arquivadas().length}</span></button>` : ""}
      ${temAba("denuncias") ? `<button type="button" role="tab" data-aba="denuncias" aria-selected="${aba === "denuncias"}">Suas denúncias
        ${novas ? `<span class="mt-conta" title="Há novidade da equipe do Hub">${novas}</span>` : ""}</button>` : ""}
    </nav>`;
  }
  function abrirAba(nome) {
    aba = temAba(nome) ? nome : "mentorias";
    try { history.replaceState(null, "", aba === "mentorias" ? location.pathname + location.search : "#" + aba); } catch (err) {}
    desenhar();
    window.scrollTo(0, 0);
  }
  tela.addEventListener("click", ev => {
    const b = ev.target.closest("[data-aba]"); if (b) abrirAba(b.dataset.aba);
  });

  /* ── As denúncias que a pessoa fez e a conversa com a equipe ──
     Só aparece para quem já denunciou alguma coisa. Só ela e a equipe leem. */
  const esperaVoce = d => !d.resolvida && d.mensagens.length && d.mensagens[d.mensagens.length - 1].da_equipe;
  const faltaNota = d => d.resolvida && !d.nota;
  const rascunhos = {};

  /* Abre a janela das estrelas. Depois que a equipe resolve, a pessoa diz se
     o atendimento resolveu o problema; a nota só a equipe e ela veem. */
  async function avaliarAtendimento(id) {
    const d = denuncias.find(x => x.id === id); if (!d) return;
    const r = await U.pedirNota({
      titulo: "Como foi o atendimento?",
      texto: "A equipe do Hub marcou a sua denúncia como resolvida. O problema foi resolvido? Dê uma nota de 1 a 5.",
      pergunta: "Quer contar o que funcionou ou o que faltou? (opcional)",
      nota: d.nota || 0, comentario: d.nota_comentario || "" });
    if (!r) return;
    try {
      await MD.avaliarDenuncia(id, r.nota, r.comentario);
      denuncias = (await MD.minhasDenuncias()) || [];
      desenhar();
    } catch (err) {
      const m = tela.querySelector("#denMsg"); if (m) { m.textContent = err.message; m.className = "md-msg erro"; m.hidden = false; }
    }
  }
  tela.addEventListener("click", ev => {
    const b = ev.target.closest("[data-avaliar-den]"); if (b) avaliarAtendimento(b.dataset.avaliarDen);
  });

  function htmlDenuncias() {
    if (!denuncias.length) return "";
    return `<div class="mt-hero" style="margin-bottom:22px">
        <h1>Suas denúncias</h1>
        <p class="mt-lead">As denúncias que você fez e as respostas da equipe do Hub. Só você e a equipe têm acesso.</p>
      </div>
      ${denuncias.map(d => `<div class="mt-den">
        <div class="mt-den-cab"><b>${d.tipo === "post" ? "Mensagem no mural" : "Mentoria inteira"}${d.mentoria ? " · " + e(d.mentoria.vaga_titulo) : ""}</b>
          ${d.resolvida ? `<span class="md-etq aprovada">resolvida</span>` : esperaVoce(d) ? `<span class="md-etq pedido">a equipe respondeu</span>` : `<span class="md-etq pendente">em análise</span>`}</div>
        ${U.conversa(d, "Você")}
        ${d.resolvida ? `<p class="mt-den-nota">A equipe marcou esta denúncia como resolvida. A conversa foi fechada.</p>
            ${d.nota ? `<div class="mt-den-av">${U.estrelas(d.nota)} <span>a nota que você deu ao atendimento</span>
                <button class="md-link" type="button" data-avaliar-den="${e(d.id)}">mudar</button>
                ${d.nota_comentario ? `<p>${e(d.nota_comentario)}</p>` : ""}</div>`
              : `<div class="mt-acoes" style="margin-top:12px"><button class="md-bt pequeno" type="button" data-avaliar-den="${e(d.id)}">Avaliar o atendimento</button>
                  <span class="mt-den-nota" style="margin:0">Resolveu o seu problema? Leva dez segundos.</span></div>`}`
          : d.mensagens.length ? `<label class="md-campo"><textarea maxlength="2000" data-resposta="${e(d.id)}" placeholder="Responder à equipe do Hub">${e(rascunhos[d.id] || "")}</textarea></label>
              <div class="mt-acoes" style="margin-top:10px"><button class="md-bt pequeno" type="button" data-responder="${e(d.id)}">Enviar</button></div>`
            : `<p class="mt-den-nota">A equipe do Hub vai ler e, se precisar de mais detalhes, responde por aqui.</p>`}
      </div>`).join("")}
      <div class="md-msg" id="denMsg" role="status" hidden></div>`;
  }
  tela.addEventListener("input", ev => {
    const c = ev.target.closest("[data-resposta]"); if (c) rascunhos[c.dataset.resposta] = c.value;
  });
  tela.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-responder]"); if (!b) return;
    const id = b.dataset.responder, campo = tela.querySelector('[data-resposta="' + id + '"]');
    const texto = campo.value.trim();
    if (!texto) { campo.focus(); return; }
    b.disabled = true;
    try {
      await MD.responderDenuncia(id, texto, false);
      delete rascunhos[id];
      denuncias = (await MD.minhasDenuncias()) || [];
      desenhar();
    } catch (err) {
      const m = tela.querySelector("#denMsg"); m.textContent = err.message; m.className = "md-msg erro"; m.hidden = false; b.disabled = false;
    }
  });

  function abrirForm() {
    const alvo = tela.querySelector("#formMentor");
    alvo.hidden = false;
    if (!perfil) {
      alvo.innerHTML = `<div class="mt-form"><h3>Primeiro, o seu perfil</h3>
        <p>Antes de pedir para ser mentor, diga como você quer aparecer: nome, uma apresentação curta e, se quiser, uma foto.</p>
        <div class="mt-acoes"><a class="md-bt" href="perfil.html?voltar=${encodeURIComponent("mentorias.html#serMentor")}">Preencher meu perfil</a></div></div>`;
      alvo.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    alvo.innerHTML = `
      <form class="mt-form" novalidate>
        <h3>Pedido para ser mentor</h3>
        <p>Você aparece como <b>${e(perfil.nome)}</b>. <a class="md-link" href="perfil.html?voltar=mentorias.html">mudar perfil</a></p>
        <label class="md-campo"><span>Empresa</span><input id="fEmpresa" type="text" maxlength="80" placeholder="Welocalize"></label>
        <label class="md-campo"><span>Vaga</span>
          <small>O título como aparece no anúncio.</small>
          <input id="fVaga" type="text" maxlength="160" placeholder="Search Quality Rater, português (Brasil)"></label>
        <label class="md-campo"><span>Link da vaga</span>
          <small>A página onde as pessoas se candidatam. Se você tiver link de indicação, pode usar o seu. Precisa começar com https://</small>
          <input id="fLink" type="url" maxlength="600" placeholder="https://"></label>
        <label class="md-campo"><span>Sua apresentação</span>
          <small>Há quanto tempo trabalha nessa vaga, como conseguiu entrar, o que faz no dia a dia.</small>
          <textarea id="fApres" maxlength="3000"></textarea></label>
        <label class="md-campo"><span>Como você vai ajudar</span>
          <small>O que você oferece (currículo, preparo para o teste, tirar dúvidas) e com que frequência responde no mural.</small>
          <textarea id="fAjuda" maxlength="3000"></textarea></label>
        <label class="md-campo"><span>Como você comprova que trabalha lá</span>
          <small>Só a administração do Hub vê o que você escrever e anexar aqui. Anexe prints ou fotos (painel de trabalho,
            comprovante de pagamento, contrato) e, se quiser, explique o que cada um mostra. Podemos pedir mais detalhes pelo e-mail da sua conta.</small>
          <textarea id="fProva" maxlength="3000" placeholder="Opcional se você anexar imagens"></textarea></label>
        <label class="md-anexar"><input id="fArq" type="file" accept="image/*" multiple>+ Anexar prints ou fotos</label>
        <span class="mt-anexo-nota" id="fArqNota">até 6 imagens</span>
        <div class="md-provas" id="fProvas"></div>
        <div class="regra"><b>Ao enviar, você concorda com as regras:</b> a mentoria é gratuita e você não cobra nada dos participantes;
          você responde a quem entrar; você não se apresenta como recrutador da empresa e, se usar link de indicação, segue as regras do programa dela.
          O Hub pode encerrar a mentoria se isso não for cumprido.</div>
        <div class="mt-acoes"><button class="md-bt" type="submit">Enviar para análise</button>
          <button class="md-link" type="button" id="btFechar">cancelar</button></div>
        <div class="md-msg" id="fMsg" role="status" hidden></div>
      </form>`;
    alvo.scrollIntoView({ behavior: "smooth", block: "start" });
    const $ = s => alvo.querySelector(s);
    const dizer = (t, tipo) => { const m = $("#fMsg"); m.textContent = t; m.className = "md-msg " + tipo; m.hidden = false; };
    $("#btFechar").addEventListener("click", () => { alvo.hidden = true; alvo.innerHTML = ""; });

    /* prints de comprovação: reduzidos aqui no navegador, enviados depois do pedido */
    const MAX_PROVAS = 6;
    let provas = [];
    function desenharProvas() {
      $("#fProvas").innerHTML = provas.map((p, i) => `<div class="md-prova"><img data-ampliar src="${p}" alt="Comprovante ${i + 1}">
        <button type="button" data-tirar="${i}" aria-label="Tirar esta imagem">×</button></div>`).join("");
      $("#fArqNota").textContent = provas.length ? `${provas.length} de ${MAX_PROVAS} imagens` : `até ${MAX_PROVAS} imagens`;
    }
    $("#fArq").addEventListener("change", async ev => {
      const arquivos = Array.from(ev.target.files || []);
      ev.target.value = "";
      $("#fMsg").hidden = true;
      for (const a of arquivos) {
        if (provas.length >= MAX_PROVAS) { dizer(`O limite é de ${MAX_PROVAS} imagens.`, "erro"); break; }
        try { provas.push(await U.reduzirProva(a)); } catch (err) { dizer(err.message, "erro"); }
        desenharProvas();
      }
    });
    $("#fProvas").addEventListener("click", ev => {
      const b = ev.target.closest("[data-tirar]"); if (!b) return;
      provas.splice(+b.dataset.tirar, 1); desenharProvas();
    });
    alvo.querySelector("form").addEventListener("submit", async ev => {
      ev.preventDefault();
      const m = { empresa: $("#fEmpresa").value.trim(), vaga_titulo: $("#fVaga").value.trim(), link: $("#fLink").value.trim(),
                  apresentacao: $("#fApres").value.trim(), como_ajuda: $("#fAjuda").value.trim(), comprovacao: $("#fProva").value.trim() };
      if (m.empresa.length < 2 || m.vaga_titulo.length < 2) { dizer("Preencha a empresa e a vaga.", "erro"); return; }
      if (!/^https:\/\/\S+\.\S+/i.test(m.link)) { dizer("O link da vaga precisa começar com https://", "erro"); return; }
      if (m.apresentacao.length < 40) { dizer("Escreva um pouco mais na apresentação, pelo menos duas frases.", "erro"); return; }
      if (m.como_ajuda.length < 40) { dizer("Explique melhor como você vai ajudar, pelo menos duas frases.", "erro"); return; }
      if (m.comprovacao.length < 10 && !provas.length) { dizer("Anexe um print ou explique como você comprova que trabalha nessa vaga.", "erro"); return; }
      if (m.comprovacao.length < 10) {
        m.comprovacao = (m.comprovacao ? m.comprovacao + "\n" : "") + (provas.length === 1 ? "Comprovante em anexo (1 imagem)." : `Comprovantes em anexo (${provas.length} imagens).`);
      }
      const bt = alvo.querySelector("button[type=submit]");
      bt.disabled = true; bt.textContent = "Enviando…";
      let id = null;
      try {
        id = await MD.criar(m);
        for (let i = 0; i < provas.length; i++) {
          bt.textContent = `Enviando imagem ${i + 1} de ${provas.length}…`;
          await MD.anexarProva(id, provas[i]);
        }
        location.href = "mentoria.html?id=" + encodeURIComponent(id);
      } catch (err) {
        if (id) {   // o pedido entrou; só alguma imagem ficou para trás
          alvo.querySelector("form").innerHTML = `<h3>Pedido enviado, mas faltou imagem</h3>
            <p>O seu pedido foi para análise, só que nem todas as imagens subiram (${e(err.message)}).
              Abra o pedido para anexar de novo.</p>
            <div class="mt-acoes"><a class="md-bt" href="mentoria.html?id=${encodeURIComponent(id)}">Abrir o meu pedido</a></div>`;
          return;
        }
        dizer(err.message, "erro"); bt.disabled = false; bt.textContent = "Enviar para análise";
      }
    });
  }

  try {
    const r = await Promise.all([MD.meuPerfil(), MD.listar(), MD.minhas()]);
    perfil = r[0]; lista = r[1] || []; minhas = r[2] || minhas;
  } catch (err) { espera.textContent = err.message; return; }
  // as denúncias são um extra: se a leitura falhar, a página abre sem elas
  try { denuncias = (await MD.minhasDenuncias()) || []; } catch (err) { console.warn(err); }
  espera.hidden = true; tela.hidden = false;
  if (["denuncias", "arquivadas"].indexOf(location.hash.slice(1)) >= 0 && temAba(location.hash.slice(1))) aba = location.hash.slice(1);
  desenhar();
  if (location.hash === "#serMentor") abrirForm();
})();
</script>

</body>
</html>
