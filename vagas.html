<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vagas abertas — Home Office Hub</title>
<meta name="description" content="Todas as vagas remotas internacionais de IA, anotação de dados, avaliação e tradução abertas para quem mora no Brasil.">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Vagas abertas — Home Office Hub">
<meta property="og:description" content="Vagas remotas internacionais de IA, dados e tradução, abertas para quem mora no Brasil.">
<meta property="og:url" content="https://alvittaluc.github.io/home-office-hub/vagas.html">
<meta property="og:image" content="https://alvittaluc.github.io/home-office-hub/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  /* ═══════════════ TOPO ═══════════════ */
  .topo { max-width:var(--wrap); margin:0 auto; padding:48px 22px 24px; }
  .topo h1 {
    font-family:var(--display); font-weight:400; letter-spacing:-0.02em;
    font-size:clamp(28px,4.4vw,44px); line-height:1.06; margin-bottom:13px; max-width:20ch;
  }
  .topo p.lead { margin-bottom:26px; max-width:60ch; }

  /* números em linha, sem virar quatro cartões */
  .numeros {
    display:flex; flex-wrap:wrap; gap:34px;
    padding:20px 0 0; border-top:1px solid var(--line-soft);
  }
  .num { display:flex; flex-direction:column; gap:3px; }
  .num .n {
    font-weight:600; font-size:25px; letter-spacing:-0.02em; line-height:1.1; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .num .n .u { color:var(--signal); font-size:17px; }
  .num.amb .n { color:var(--amber); }
  .num .l { font-size:11px; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-3); }

  /* ═══════════════ BARRA DE FILTROS ═══════════════ */
  .corpo { max-width:var(--wrap); margin:0 auto; padding:0 22px 70px; }

  .barra {
    position:sticky; top:84px; z-index:60;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px; margin:14px 0 4px;
    background:rgba(255,255,255,0.86); backdrop-filter:blur(16px) saturate(1.25);
    border:1px solid var(--line-soft); border-radius:15px; box-shadow:var(--sombra);
  }
  @media (max-width:900px){ .barra{ top:74px; } }

  .barra .direita { margin-left:auto; display:flex; align-items:center; gap:12px; }
  .contagem { font-size:13px; color:var(--ink-3); white-space:nowrap; }
  .contagem b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  @media (max-width:760px){ .barra .direita{ margin-left:0; width:100%; justify-content:space-between; } }

  /* ── cada filtro suspenso ── */
  .fdrop { position:relative; }
  .fbtn {
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    font-family:var(--body); font-size:13.5px; color:var(--ink-2);
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:9px 13px; transition:border-color .15s, color .15s, background .15s;
  }
  .fbtn:hover { border-color:var(--signal-dim); color:var(--ink); }
  .fbtn:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }
  .fbtn .chev {
    width:8px; height:8px; border-right:1.5px solid var(--ink-3); border-bottom:1.5px solid var(--ink-3);
    transform:rotate(45deg) translate(-2px,-2px); transition:transform .2s; flex-shrink:0;
  }
  .fdrop.aberto .fbtn { border-color:var(--signal); color:var(--ink); background:var(--signal-suave); }
  .fdrop.aberto .fbtn .chev { transform:rotate(-135deg) translate(-3px,-3px); border-color:var(--signal); }
  .fbtn .cnt {
    font-size:11px; font-weight:600; color:#fff; background:var(--signal);
    border-radius:20px; padding:1px 7px; font-variant-numeric:tabular-nums;
  }

  .fmenu {
    position:absolute; left:0; top:calc(100% + 8px); z-index:70; display:none;
    min-width:252px; max-height:340px; overflow-y:auto; padding:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--sombra-alta); scrollbar-width:thin;
  }
  .fmenu::-webkit-scrollbar { width:6px; }
  .fmenu::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
  .fdrop.aberto .fmenu { display:block; }
  @media (max-width:760px){ .fmenu{ left:auto; right:0; min-width:min(300px,86vw); } }

  .opcao {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    font-family:var(--body); font-size:13.5px; color:var(--ink-2);
    background:transparent; border:0; border-radius:9px; padding:8px 9px; transition:background .15s, color .15s;
  }
  .opcao:hover { background:var(--panel-2); color:var(--ink); }
  .opcao .caixa {
    width:16px; height:16px; border-radius:5px; border:1.5px solid var(--line); flex-shrink:0;
    display:grid; place-items:center; font-size:10px; color:transparent; transition:all .15s;
  }
  .opcao .pip {
    width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;
    display:grid; place-items:center; transition:border-color .15s;
  }
  .opcao .pip::after { content:''; width:7px; height:7px; border-radius:50%; background:transparent; transition:background .15s; }
  .opcao.on { color:var(--ink); }
  .opcao.on .caixa { background:var(--signal); border-color:var(--signal); color:#fff; }
  .opcao.on .pip { border-color:var(--signal); }
  .opcao.on .pip::after { background:var(--signal); }
  .opcao .marca {
    width:22px; height:22px; border-radius:6px; flex-shrink:0; overflow:hidden;
    display:grid; place-items:center; font-weight:700; font-size:9px;
  }
  .opcao .marca img { width:14px; height:14px; object-fit:contain; border-radius:3px; }
  .opcao .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .opcao .qt { margin-left:auto; font-size:11.5px; color:var(--ink-3); flex-shrink:0; font-variant-numeric:tabular-nums; }
  .opcao.on .qt { color:var(--signal); }
  .opcao.vazia:not(.on) { opacity:.4; }

  .ordenar {
    font-family:var(--body); font-size:13px; color:var(--ink-2); cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:9px 32px 9px 13px; outline:none; appearance:none; transition:border-color .15s;
    background-image:linear-gradient(45deg,transparent 50%,#8A94A1 50%),linear-gradient(135deg,#8A94A1 50%,transparent 50%);
    background-position:calc(100% - 16px) 52%, calc(100% - 11px) 52%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  .ordenar:hover, .ordenar:focus { border-color:var(--signal-dim); }

  /* etiquetas do que está filtrado */
  .ativos { display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 4px; }
  .ativo {
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    font-size:12px; color:var(--signal);
    background:rgba(26,72,147,0.05); border:1px solid rgba(26,72,147,0.16);
    border-radius:20px; padding:5px 11px; transition:background .15s;
  }
  .ativo:hover { background:rgba(26,72,147,0.10); }
  .ativo .x { font-size:14px; line-height:1; opacity:.7; }
  .ativo.limpar { color:var(--ink-3); background:transparent; border-color:var(--line-soft); }
  .ativo.limpar:hover { color:var(--ink); background:var(--panel-2); }

  /* ═══════════════ LISTA HORIZONTAL ═══════════════ */
  .grupo-titulo {
    display:flex; align-items:baseline; gap:11px; margin:26px 0 12px;
  }
  .grupo-titulo h2 { font-family:var(--body); font-weight:600; font-size:15px; color:var(--ink); letter-spacing:-0.01em; }
  .grupo-titulo span { font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }

  .lista { display:flex; flex-direction:column; gap:9px; }

  .vaga {
    position:relative; display:grid; align-items:center; gap:18px;
    grid-template-columns:44px minmax(0,1.55fr) 118px 138px 108px 104px;
    background:var(--panel); border:1px solid var(--line-soft); border-radius:14px;
    padding:15px 18px; overflow:hidden;
    transition:border-color .18s, box-shadow .18s, transform .18s, background .18s;
  }
  .vaga:hover {
    border-color:var(--line); background:var(--panel-2); transform:translateY(-2px);
    box-shadow:0 14px 30px -22px rgba(16,32,58,.20);
  }
  .vaga.nova { border-color:#EBD2B4; background:linear-gradient(90deg,#FEFAF5,var(--panel) 42%); }
  .vaga.nova:hover { border-color:#E0C09A; }

  .v-marca {
    width:44px; height:44px; border-radius:11px; flex-shrink:0; overflow:hidden;
    border:1px solid var(--line); display:grid; place-items:center;
    font-weight:700; font-size:12px;
  }
  .v-marca img { width:26px; height:26px; object-fit:contain; border-radius:5px; }

  .v-nome { min-width:0; display:flex; flex-direction:column; gap:3px; }
  .v-tit {
    font-weight:600; font-size:15px; line-height:1.32; color:var(--ink); letter-spacing:-0.01em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .v-emp { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); min-width:0; }
  .v-emp .e { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .v-emp .selo-novo {
    font-size:9.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
    color:var(--amber); background:var(--amber-suave); border:1px solid #EBD2B4;
    border-radius:20px; padding:2px 8px; flex-shrink:0;
  }

  /* Meu Controle: marca discreta nas vagas em que a pessoa já aplicou.
     Só aparece para quem usa a ferramenta; para todo mundo mais, nada muda. */
  .v-emp .selo-aplicada {
    font-size:9.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
    color:#1F7A6E; background:#E4F3F0; border:1px solid #C6E5DE;
    border-radius:20px; padding:2px 8px; flex-shrink:0;
  }

  /* colunas de dados, com rótulo em cima */
  .v-col { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .v-col .r {
    display:flex; align-items:center; gap:5px;
    font-size:10.5px; letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-3);
  }
  .v-col .r svg { width:11px; height:11px; flex-shrink:0; opacity:.75; }
  .v-col .v {
    font-size:13.5px; color:var(--ink); font-weight:500;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .v-acao {
    justify-self:end; display:inline-flex; align-items:center; gap:7px;
    font-size:12.5px; color:var(--ink-3); white-space:nowrap; transition:color .18s;
  }
  .v-acao .arr { transition:transform .18s; }
  .vaga:hover .v-acao { color:var(--signal); }
  .vaga:hover .v-acao .arr { transform:translateX(3px); }

  /* telas médias: some a coluna de área */
  @media (max-width:1080px){
    .vaga { grid-template-columns:44px minmax(0,1.5fr) 112px 118px 96px; }
    .vaga .col-area { display:none; }
  }
  /* celular: vira bloco, com os dados em etiquetas */
  @media (max-width:720px){
    .vaga { grid-template-columns:40px 1fr; gap:12px 13px; padding:15px 16px; align-items:start; }
    .v-marca { width:40px; height:40px; }
    .v-marca img { width:23px; height:23px; }
    .v-col { grid-column:2; flex-direction:row; align-items:center; gap:7px; }
    .v-col .r { font-size:10px; }
    .v-col .r span { display:none; }
    .v-col .v { font-size:13px; font-weight:400; color:var(--ink-2); }
    .v-acao { grid-column:2; justify-self:start; color:var(--signal); }
    .vaga .col-area { display:flex; }
  }

  .vazio { text-align:center; padding:64px 20px; color:var(--ink-3); font-size:14.5px; }
  .vazio .big { font-size:30px; margin-bottom:12px; color:var(--line); }
</style>
</head>
<body>

<section class="topo">
  <div class="eyebrow">Lista completa</div>
  <h1>Vagas abertas para quem mora no Brasil</h1>
  <p class="lead">Só entra o que aceita residentes do Brasil e português brasileiro. Cada vaga leva direto para a página oficial da empresa, sem intermediário.</p>
  <div class="numeros" id="numeros"></div>
</section>

<div class="corpo">

  <div class="barra">
    <div class="fdrop" id="dropEmpresa">
      <button class="fbtn" type="button" aria-expanded="false">Empresa <span class="cnt" hidden>0</span> <span class="chev"></span></button>
      <div class="fmenu" id="menuEmpresas"></div>
    </div>
    <div class="fdrop" id="dropArea">
      <button class="fbtn" type="button" aria-expanded="false">Área <span class="cnt" hidden>0</span> <span class="chev"></span></button>
      <div class="fmenu" id="menuAreas"></div>
    </div>
    <div class="fdrop" id="dropPeriodo">
      <button class="fbtn" type="button" aria-expanded="false"><span class="rot">Publicação</span> <span class="chev"></span></button>
      <div class="fmenu" id="menuPeriodo"></div>
    </div>

    <div class="direita">
      <span class="contagem" id="contagem">carregando…</span>
      <select class="ordenar" id="ordem" aria-label="Ordenar vagas">
        <option value="recentes">Mais recentes</option>
        <option value="antigas">Mais antigas</option>
        <option value="empresa">Empresa (A a Z)</option>
        <option value="titulo">Título (A a Z)</option>
      </select>
    </div>
  </div>

  <div class="ativos" id="ativos"></div>
  <div id="resultado"></div>
</div>

<script src="layout.js"></script>
<script src="controle-dados.js"></script>
<script>
montarLayout("vagas");

const CAT_ORDEM = ["ai","transl","qa","sme","write"];
const CAT_NOME  = { ai:"IA & Dados", transl:"Tradução", qa:"QA & Validação", sme:"Especialistas", write:"Escrita" };
const PERIODOS  = [
  { id:"all", nome:"Qualquer data" },
  { id:"7",   nome:"Novas, últimos 7 dias" },
  { id:"30",  nome:"Últimos 30 dias" },
];

/* ícones das colunas, desenhados aqui para não depender de biblioteca */
const IC = {
  local:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  area :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20h-20"/></svg>',
  data :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
};

let EMPRESAS = {}, TODAS = [];
let fPeriodo = "all", fCats = new Set(), fEmps = new Set(), ordem = "recentes";

/* ── dados ── */
async function iniciar() {
  try {
    const base = await lerEmpresas();
    (base.empresas || []).forEach(e => EMPRESAS[e.id] = e);
  } catch (e) { console.error("empresas.json", e); }
  try {
    const dados = await lerVagas();
    TODAS = dados.vagas || [];
    lerUrl();
    aplicar();
  } catch (e) {
    document.getElementById("resultado").innerHTML =
      '<div class="vazio"><div class="big">◌</div><p>Não foi possível carregar as vagas agora.<br>Verifique se o arquivo vagas.json está na mesma pasta.</p></div>';
    document.getElementById("contagem").textContent = "erro ao carregar";
    console.error(e);
  }
}

function lerUrl() {
  const p = new URLSearchParams(location.search);
  if (p.get("cat")) fCats.add(p.get("cat"));
  if (p.get("empresa")) fEmps.add(p.get("empresa"));
  if (p.get("periodo")) fPeriodo = p.get("periodo");
}

/* ── datas ── */
function dias(v) {
  const d = v.data_ref || v.data_post || v.data_vista;
  if (!d) return null;
  const data = new Date(d + "T12:00:00Z");
  if (isNaN(data)) return null;
  const n = Math.floor((new Date() - data) / 86400000);
  return n < 0 ? null : n;
}
function textoData(v) {
  const n = dias(v);
  if (n === null) return "sem data";
  if (n === 0) return "hoje";
  if (n === 1) return "ontem";
  if (n <= 30) return `há ${n} dias`;
  if (n <= 60) return "há 1 mês";
  return "há 2 meses";
}
/* "nova" só vale quando a data veio da própria empresa. Quando o hub só sabe
   quando VIU a vaga, chamar de nova seria falar da nossa coleta, não da vaga. */
const temDataOficial = v => v.data_oficial === true || (v.data_oficial === undefined && !!v.data_post);
const ehNova = v => { const n = dias(v); return n !== null && n <= 7 && temDataOficial(v); };

/* ── filtros ── */
function passa(v, ignorar) {
  if (ignorar !== "periodo" && fPeriodo !== "all") {
    const n = dias(v);
    if (n === null || n > Number(fPeriodo)) return false;
  }
  if (ignorar !== "cat" && fCats.size && !fCats.has(v.categoria)) return false;
  if (ignorar !== "emp" && fEmps.size && !fEmps.has(v.empresa)) return false;
  return true;
}
const filtradas = () => TODAS.filter(v => passa(v));
const alterna = (conjunto, valor) => conjunto.has(valor) ? conjunto.delete(valor) : conjunto.add(valor);

function montarMenus() {
  /* publicação, uma escolha só */
  document.getElementById("menuPeriodo").innerHTML = PERIODOS.map(p => {
    const q = TODAS.filter(v => {
      if (p.id === "all") return passa(v, "periodo");
      const n = dias(v);
      return n !== null && n <= Number(p.id) && passa(v, "periodo");
    }).length;
    return `<button class="opcao${fPeriodo === p.id ? " on" : ""}${q === 0 ? " vazia" : ""}" type="button" data-periodo="${p.id}">
      <span class="pip"></span><span class="nm">${p.nome}</span><span class="qt">${q}</span></button>`;
  }).join("");

  /* áreas, várias ao mesmo tempo */
  document.getElementById("menuAreas").innerHTML = CAT_ORDEM
    .filter(c => TODAS.some(v => v.categoria === c))
    .map(c => {
      const q = TODAS.filter(v => v.categoria === c && passa(v, "cat")).length;
      return `<button class="opcao${fCats.has(c) ? " on" : ""}${q === 0 ? " vazia" : ""}" type="button" data-cat="${c}">
        <span class="caixa">✓</span><span class="nm">${CAT_NOME[c] || c}</span><span class="qt">${q}</span></button>`;
    }).join("");

  /* empresas, as com mais vagas primeiro */
  const ids = Object.keys(EMPRESAS)
    .filter(id => TODAS.some(v => v.empresa === id))
    .sort((a,b) => TODAS.filter(v => v.empresa === b).length - TODAS.filter(v => v.empresa === a).length);
  document.getElementById("menuEmpresas").innerHTML = ids.map(id => {
    const e = EMPRESAS[id];
    const q = TODAS.filter(v => v.empresa === id && passa(v, "emp")).length;
    return `<button class="opcao${fEmps.has(id) ? " on" : ""}${q === 0 ? " vazia" : ""}" type="button" data-emp="${id}">
      <span class="caixa">✓</span>
      <span class="marca" style="background:${e.bg};color:${e.cor};">${logoHtml(e,22)}</span>
      <span class="nm">${esc(e.nome)}</span><span class="qt">${q}</span></button>`;
  }).join("");

  document.querySelectorAll("[data-periodo]").forEach(b => b.onclick = () => { fPeriodo = b.dataset.periodo; fechar(); aplicar(); });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { alterna(fCats, b.dataset.cat); aplicar(); });
  document.querySelectorAll("[data-emp]").forEach(b => b.onclick = () => { alterna(fEmps, b.dataset.emp); aplicar(); });

  /* contador dentro de cada botão */
  marcarBotao("dropEmpresa", fEmps.size);
  marcarBotao("dropArea", fCats.size);
  const p = PERIODOS.find(x => x.id === fPeriodo);
  document.querySelector("#dropPeriodo .rot").textContent = fPeriodo === "all" ? "Publicação" : (p ? p.nome : "Publicação");
}
function marcarBotao(idDrop, n) {
  const c = document.querySelector("#" + idDrop + " .cnt");
  c.textContent = n; c.hidden = n === 0;
}

/* ── abrir e fechar os menus ── */
const fechar = () => document.querySelectorAll(".fdrop").forEach(d => {
  d.classList.remove("aberto");
  d.querySelector(".fbtn").setAttribute("aria-expanded", "false");
});
document.querySelectorAll(".fdrop .fbtn").forEach(b => {
  b.addEventListener("click", ev => {
    ev.stopPropagation();
    const pai = b.closest(".fdrop");
    const estava = pai.classList.contains("aberto");
    fechar();
    if (!estava) { pai.classList.add("aberto"); b.setAttribute("aria-expanded", "true"); }
  });
});
document.addEventListener("click", ev => { if (!ev.target.closest(".fdrop")) fechar(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") fechar(); });

/* ── etiquetas do que está ativo ── */
function montarAtivos() {
  const itens = [];
  if (fPeriodo !== "all") {
    const p = PERIODOS.find(x => x.id === fPeriodo);
    itens.push({ rotulo: p ? p.nome : fPeriodo, tipo: "periodo" });
  }
  fCats.forEach(c => itens.push({ rotulo: CAT_NOME[c] || c, tipo: "cat", valor: c }));
  fEmps.forEach(id => itens.push({ rotulo: (EMPRESAS[id] || {}).nome || id, tipo: "emp", valor: id }));

  const alvo = document.getElementById("ativos");
  alvo.innerHTML = itens.map(i =>
    `<button class="ativo" type="button" data-tipo="${i.tipo}" data-valor="${i.valor || ""}">${esc(i.rotulo)}<span class="x">×</span></button>`
  ).join("") + (itens.length > 1 ? '<button class="ativo limpar" type="button" data-tipo="tudo">limpar tudo</button>' : "");

  alvo.querySelectorAll(".ativo").forEach(b => b.onclick = () => {
    const { tipo, valor } = b.dataset;
    if (tipo === "tudo") { fPeriodo = "all"; fCats.clear(); fEmps.clear(); }
    if (tipo === "periodo") fPeriodo = "all";
    if (tipo === "cat") fCats.delete(valor);
    if (tipo === "emp") fEmps.delete(valor);
    aplicar();
  });
}

/* ── ordenação ── */
function ordenar(lista) {
  const copia = [...lista];
  const nomeEmp = v => ((EMPRESAS[v.empresa] || {}).nome || v.empresa || "").toLowerCase();
  const idade = v => { const n = dias(v); return n === null ? Infinity : n; };
  if (ordem === "recentes") copia.sort((a,b) => idade(a) - idade(b));
  if (ordem === "antigas")  copia.sort((a,b) => idade(b) - idade(a));
  if (ordem === "empresa")  copia.sort((a,b) => nomeEmp(a).localeCompare(nomeEmp(b)) || (a.titulo||"").localeCompare(b.titulo||""));
  if (ordem === "titulo")   copia.sort((a,b) => (a.titulo||"").localeCompare(b.titulo||"", "pt-BR"));
  return copia;
}

/* ── uma linha de vaga ── */
function linha(v) {
  const e = EMPRESAS[v.empresa] || { nome:v.empresa, sigla:"?", cor:"#8A94A1", bg:"#EAE4D9" };
  const nova = ehNova(v);
  const destino = `href="vaga.html?id=${encodeURIComponent(v.id || "")}"`;
  const rotulo = 'ver detalhes <span class="arr">→</span>';
  const real = v.empresa_real ? ` · ${esc(v.empresa_real)}` : "";

  return `<a class="vaga${nova ? " nova" : ""}" ${destino} data-vid="${esc(v.id || "")}">
    <span class="v-marca" style="background:${e.bg};color:${e.cor};">${logoHtml(e,44)}</span>

    <span class="v-nome">
      <span class="v-tit">${esc(v.titulo)}</span>
      <span class="v-emp">
        <span class="e">${esc(e.nome)}${real}</span>
        ${nova ? '<span class="selo-novo">nova</span>' : ""}
      </span>
    </span>

    <span class="v-col">
      <span class="r">${IC.local}<span>Local</span></span>
      <span class="v">${esc(v.local)}</span>
    </span>

    <span class="v-col col-area">
      <span class="r">${IC.area}<span>Área</span></span>
      <span class="v">${esc(v.badge)}</span>
    </span>

    <span class="v-col">
      <span class="r">${IC.data}<span>${temDataOficial(v) ? "Publicada" : "No hub desde"}</span></span>
      <span class="v">${textoData(v)}</span>
    </span>

    <span class="v-acao">${rotulo}</span>
  </a>`;
}

function montarNumeros() {
  const novas = TODAS.filter(ehNova).length;
  const emps = new Set(TODAS.map(v => v.empresa)).size;
  document.getElementById("numeros").innerHTML = `
    <div class="num"><div class="n">${TODAS.length}</div><div class="l">vagas abertas</div></div>
    <div class="num"><div class="n">${emps}</div><div class="l">empresas</div></div>
    <div class="num${novas ? " amb" : ""}"><div class="n">${novas}</div><div class="l">novas nesta semana</div></div>
    <div class="num"><div class="n">100<span class="u">%</span></div><div class="l">remoto · brasil</div></div>`;
}

function aplicar() {
  montarNumeros();
  montarMenus();
  montarAtivos();

  const resultado = ordenar(filtradas());
  document.getElementById("contagem").innerHTML =
    `<b>${resultado.length}</b> ${resultado.length === 1 ? "vaga" : "vagas"}`;

  const alvo = document.getElementById("resultado");
  if (!resultado.length) {
    alvo.innerHTML = `<div class="vazio"><div class="big">◌</div>
      <p>Nenhuma vaga com esses filtros.<br>Tente tirar um deles ou ampliar o período.</p></div>`;
    return;
  }

  /* as novas ficam em cima, separadas, quando a ordem é por data */
  const porData = ordem === "recentes";
  const novas = porData ? resultado.filter(ehNova) : [];
  const resto = porData ? resultado.filter(v => !ehNova(v)) : resultado;

  let html = "";
  if (novas.length) {
    html += `<div class="grupo-titulo"><h2>Publicadas nesta semana</h2><span>${novas.length}</span></div>
             <div class="lista">${novas.map(linha).join("")}</div>`;
  }
  if (resto.length) {
    html += novas.length
      ? `<div class="grupo-titulo"><h2>Demais vagas abertas</h2><span>${resto.length}</span></div>`
      : "";
    html += `<div class="lista">${resto.map(linha).join("")}</div>`;
  }
  alvo.innerHTML = html;
  marcarAplicadas();
}

/* ══════════════════════════════════════════════════════════
   MARCA DAS VAGAS JÁ APLICADAS

   Lê a lista do Meu Controle, que fica dentro do navegador do
   próprio visitante. Se a ferramenta não estiver junto, ou o
   navegador não deixar guardar nada, esta função não faz nada
   e a lista de vagas continua exatamente igual.
   ══════════════════════════════════════════════════════════ */
async function marcarAplicadas() {
  try {
    if (typeof Dados === "undefined") return;
    const aplicacoes = await Dados.listar("aplicacoes");
    if (!aplicacoes.length) return;

    const ids = new Set(aplicacoes.filter(a => a.vagaId).map(a => a.vagaId));
    const chaves = new Set(aplicacoes.map(a => Dados.normalizar(a.empresa) + "|" + Dados.normalizar(a.titulo)));

    document.querySelectorAll(".vaga[data-vid]").forEach(el => {
      const v = TODAS.find(x => x.id === el.dataset.vid);
      if (!v) return;
      const e = EMPRESAS[v.empresa] || { nome: v.empresa };
      const bate = ids.has(v.id) || chaves.has(Dados.normalizar(e.nome) + "|" + Dados.normalizar(v.titulo));
      if (!bate) return;
      const onde = el.querySelector(".v-emp");
      if (!onde || onde.querySelector(".selo-aplicada")) return;
      const selo = document.createElement("span");
      selo.className = "selo-aplicada";
      selo.textContent = "já apliquei";
      onde.appendChild(selo);
    });
  } catch (e) {
    console.warn("Meu Controle indisponível na lista de vagas", e);
  }
}

document.getElementById("ordem").onchange = ev => { ordem = ev.target.value; aplicar(); };

iniciar();
</script>
