<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vagas abertas — Home Office Hub</title>
<meta name="description" content="Todas as vagas remotas internacionais de IA, anotação de dados, avaliação e tradução abertas para quem mora no Brasil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  /* ─────────────── TOPO ─────────────── */
  .topo { max-width:var(--wrap); margin:0 auto; padding:48px 20px 26px; }
  .topo h1 {
    font-family:var(--display); font-weight:400; letter-spacing:-0.02em;
    font-size:clamp(28px,4.4vw,44px); line-height:1.06; margin-bottom:13px; max-width:20ch;
  }
  .topo p.lead { margin-bottom:26px; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:11px; }
  .stat {
    background:linear-gradient(155deg,var(--panel-2),var(--panel));
    border:1px solid var(--line-soft); border-radius:13px; padding:16px 17px;
    position:relative; overflow:hidden;
  }
  .stat::after {
    content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--signal); opacity:.5;
  }
  .stat.amb::after { background:var(--amber); }
  .stat .n { font-family:var(--mono); font-weight:600; font-size:26px; letter-spacing:-0.02em; line-height:1.1; }
  .stat .n .u { color:var(--signal); font-size:19px; }
  .stat.amb .n { color:var(--amber); }
  .stat .l {
    font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-3); margin-top:6px;
  }

  /* ─────────────── CORPO ─────────────── */
  .corpo {
    max-width:var(--wrap); margin:0 auto; padding:8px 20px 70px;
    display:grid; grid-template-columns:262px 1fr; gap:26px; align-items:start;
  }
  @media (max-width:940px){ .corpo{ grid-template-columns:1fr; gap:0; } }

  /* ── painel de filtros ── */
  .painel-filtros {
    position:sticky; top:78px;
    background:var(--panel); border:1px solid var(--line-soft); border-radius:15px; overflow:hidden;
  }
  @media (max-width:940px){
    .painel-filtros { position:static; margin-bottom:18px; display:none; }
    .painel-filtros.aberto { display:block; }
  }
  .pf-topo {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; border-bottom:1px solid var(--line-soft); background:var(--panel-2);
  }
  .pf-topo h2 {
    font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink-2); font-weight:500;
  }
  .limpar {
    font-family:var(--mono); font-size:10.5px; color:var(--ink-3); background:none; border:0;
    cursor:pointer; padding:3px 0; transition:color .15s;
  }
  .limpar:hover { color:var(--signal); }
  .limpar:disabled { opacity:.35; cursor:default; }

  .grupo { padding:15px 16px; border-bottom:1px solid var(--line-soft); }
  .grupo:last-child { border-bottom:0; }
  .grupo > h3 {
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.13em; text-transform:uppercase;
    color:var(--ink-3); font-weight:500; margin-bottom:11px;
  }

  /* período, em botões segmentados */
  .segmentos { display:flex; flex-direction:column; gap:4px; }
  .seg-btn {
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; cursor:pointer;
    font-family:var(--body); font-size:13px; color:var(--ink-2);
    background:transparent; border:1px solid transparent; border-radius:9px; padding:8px 10px;
    transition:all .15s;
  }
  .seg-btn:hover { background:var(--panel-2); color:var(--ink); }
  .seg-btn .pip {
    width:14px; height:14px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;
    display:grid; place-items:center; transition:border-color .15s;
  }
  .seg-btn .pip::after { content:''; width:6px; height:6px; border-radius:50%; background:transparent; transition:background .15s; }
  .seg-btn.on { background:var(--panel-2); border-color:var(--line); color:var(--ink); }
  .seg-btn.on .pip { border-color:var(--signal); }
  .seg-btn.on .pip::after { background:var(--signal); }
  .seg-btn .qt { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }
  .seg-btn.on .qt { color:var(--signal); }

  /* caixas de seleção de área e empresa */
  .opcao {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    font-family:var(--body); font-size:13px; color:var(--ink-2);
    background:transparent; border:0; border-radius:9px; padding:7px 9px; transition:all .15s;
  }
  .opcao:hover { background:var(--panel-2); color:var(--ink); }
  .opcao .caixa {
    width:15px; height:15px; border-radius:5px; border:1.5px solid var(--line); flex-shrink:0;
    display:grid; place-items:center; font-size:10px; color:transparent; transition:all .15s;
  }
  .opcao.on { color:var(--ink); }
  .opcao.on .caixa { background:var(--signal); border-color:var(--signal); color:#fff; }
  .opcao .marca { width:22px; height:22px; border-radius:6px; flex-shrink:0; overflow:hidden;
    display:grid; place-items:center; font-family:var(--mono); font-weight:600; font-size:9px; }
  .opcao .marca img { width:14px; height:14px; object-fit:contain; border-radius:3px; }
  .opcao .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .opcao .qt { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-3); flex-shrink:0; }
  .opcao.on .qt { color:var(--signal); }

  /* opção que não traria nenhum resultado com os filtros atuais */
  .seg-btn.vazia:not(.on), .opcao.vazia:not(.on) { opacity:.4; }

  .lista-rolagem { max-height:296px; overflow-y:auto; margin:0 -5px; padding:0 5px; scrollbar-width:thin; }
  .lista-rolagem::-webkit-scrollbar { width:5px; }
  .lista-rolagem::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }

  /* botão de filtros, só no celular */
  .abrir-filtros {
    display:none; align-items:center; gap:9px; width:100%; justify-content:center;
    font-family:var(--mono); font-size:13px; color:var(--ink); cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px;
    margin-bottom:14px;
  }
  .abrir-filtros .conta {
    font-family:var(--mono); font-size:10.5px; background:var(--signal); color:#fff;
    border-radius:20px; padding:1px 7px; font-weight:600;
  }
  @media (max-width:940px){ .abrir-filtros{ display:flex; } }

  /* ─────────────── RESULTADOS ─────────────── */
  .barra {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding-bottom:14px; margin-bottom:16px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap;
  }
  .barra .contagem { font-family:var(--mono); font-size:12.5px; color:var(--ink-3); }
  .barra .contagem b { color:var(--ink); font-weight:600; }
  .ordenar { display:flex; align-items:center; gap:9px; }
  .ordenar span { font-family:var(--mono); font-size:11px; color:var(--ink-3); }
  .ordenar select {
    font-family:var(--mono); font-size:12px; color:var(--ink); cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:9px;
    padding:7px 30px 7px 11px; outline:none; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,#8A94A1 50%),linear-gradient(135deg,#8A94A1 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
    transition:border-color .15s;
  }
  .ordenar select:focus { border-color:var(--signal-dim); }

  /* etiquetas do que está filtrado */
  .ativos { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px; }
  .ativo {
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    font-family:var(--mono); font-size:11px; color:var(--signal);
    background:rgba(26,72,147,0.05); border:1px solid rgba(26,72,147,0.16);
    border-radius:20px; padding:5px 11px; transition:all .15s;
  }
  .ativo:hover { background:rgba(26,72,147,0.08); }
  .ativo .x { font-size:13px; line-height:1; opacity:.7; }

  /* grade de vagas */
  .grade { display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:13px; }
  .vaga {
    position:relative; display:flex; flex-direction:column; gap:12px; overflow:hidden;
    background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:16px;
    transition:border-color .18s, transform .18s, background .18s, box-shadow .18s;
  }
  .vaga::before {
    content:''; position:absolute; inset:0; border-radius:14px; pointer-events:none;
    background:radial-gradient(140% 90% at 0% 0%, rgba(26,72,147,0.05), transparent 55%);
    opacity:0; transition:opacity .18s;
  }
  .vaga:hover {
    border-color:var(--line); background:var(--panel-2); transform:translateY(-3px);
    box-shadow:0 16px 34px -22px rgba(16,32,58,.14);
  }
  .vaga:hover::before { opacity:1; }
  .vaga.nova { border-color:#EBD2B4; }

  .v-topo { display:flex; align-items:center; gap:9px; }
  .v-topo .marca {
    width:28px; height:28px; border-radius:8px; flex-shrink:0; overflow:hidden; border:1px solid var(--line);
    display:grid; place-items:center; font-family:var(--mono); font-weight:700; font-size:9.5px;
  }
  .v-topo .marca img { width:17px; height:17px; object-fit:contain; border-radius:4px; }
  .v-topo .emp { font-family:var(--mono); font-size:11.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .v-topo .selo-novo {
    margin-left:auto; flex-shrink:0; font-family:var(--mono); font-size:9.5px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; color:var(--amber);
    background:var(--amber-suave); border:1px solid #EBD2B4;
    border-radius:20px; padding:3px 9px;
  }
  .v-tit {
    font-family:var(--body); font-weight:600; font-size:15px; line-height:1.35; color:var(--ink); letter-spacing:-0.01em;
  }
  .v-real { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-top:-7px; }
  .v-tags { display:flex; flex-wrap:wrap; gap:6px; }
  .v-pe {
    margin-top:auto; padding-top:11px; border-top:1px solid var(--line-soft);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .v-data { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }
  .v-mais {
    font-family:var(--mono); font-size:11px; color:var(--ink-3);
    display:inline-flex; align-items:center; gap:6px; transition:color .18s;
  }
  .v-mais .arr { transition:transform .18s; }
  .vaga:hover .v-mais { color:var(--signal); }
  .vaga:hover .v-mais .arr { transform:translateX(3px); }
</style>
</head>
<body>

<section class="topo">
  <div class="eyebrow">Lista completa</div>
  <h1>Vagas abertas para quem mora no Brasil</h1>
  <p class="lead">Só entra o que aceita residentes do Brasil e português brasileiro. Cada vaga leva direto para a página oficial da empresa, sem intermediário.</p>
  <div class="stats" id="stats"></div>
</section>

<div class="corpo">
  <aside>
    <button class="abrir-filtros" id="abrirFiltros" aria-expanded="false">
      Filtros <span class="conta" id="contaFiltros" hidden>0</span>
    </button>
    <div class="painel-filtros" id="painelFiltros">
      <div class="pf-topo">
        <h2>Filtros</h2>
        <button class="limpar" id="limpar" disabled>limpar tudo</button>
      </div>
      <div class="grupo">
        <h3>Publicação</h3>
        <div class="segmentos" id="grupoPeriodo"></div>
      </div>
      <div class="grupo">
        <h3>Área</h3>
        <div id="grupoAreas"></div>
      </div>
      <div class="grupo">
        <h3>Empresa</h3>
        <div class="lista-rolagem" id="grupoEmpresas"></div>
      </div>
    </div>
  </aside>

  <div>
    <div class="barra">
      <div class="contagem" id="contagem">carregando…</div>
      <div class="ordenar">
        <span>ordenar</span>
        <select id="ordem" aria-label="Ordenar vagas">
          <option value="recentes">Mais recentes</option>
          <option value="antigas">Mais antigas</option>
          <option value="empresa">Empresa (A a Z)</option>
          <option value="titulo">Título (A a Z)</option>
        </select>
      </div>
    </div>
    <div class="ativos" id="ativos"></div>
    <div id="lista"></div>
  </div>
</div>

<script src="layout.js"></script>
<script>
montarLayout("vagas");

const CAT_ORDEM = ["ai","transl","qa","sme","write"];
const CAT_NOME  = { ai:"IA & Dados", transl:"Tradução", qa:"QA & Validação", sme:"Especialistas", write:"Escrita" };
const PERIODOS  = [
  { id:"all", nome:"Qualquer data" },
  { id:"7",   nome:"Novas, últimos 7 dias" },
  { id:"30",  nome:"Últimos 30 dias" },
];

let EMPRESAS = {}, TODAS = [];
let fPeriodo = "all", fCats = new Set(), fEmps = new Set(), ordem = "recentes";

/* ── dados ── */
async function iniciar() {
  try {
    const base = await lerEmpresas();
    (base.empresas || []).forEach(e => EMPRESAS[e.id] = e);
  } catch (e) { console.error("empresas.json", e); }
  EMPRESAS.linkedin = EMPRESAS.linkedin || {
    id:"linkedin", nome:"Via LinkedIn", sigla:"IN", cor:"#38BDF8", bg:"#0e2436",
    dom:"linkedin.com", desc:"Captadas dos alertas do LinkedIn", agregador:true
  };

  try {
    const dados = await lerVagas();
    TODAS = dados.vagas || [];
    lerUrl();
    montarFiltros();
    aplicar();
  } catch (e) {
    document.getElementById("lista").innerHTML =
      '<div class="vazio"><div class="big">◌</div><p>Não foi possível carregar as vagas agora.<br>Verifique se o arquivo vagas.json está na mesma pasta.</p></div>';
    document.getElementById("contagem").textContent = "erro ao carregar";
    console.error(e);
  }
}

function lerUrl() {
  const p = new URLSearchParams(location.search);
  if (p.get("cat")) fCats.add(p.get("cat"));
  if (p.get("empresa")) fEmps.add(p.get("empresa"));
  if (p.get("periodo")) fPeriodo = p.get("periodo");
}

/* ── datas ── */
function dias(v) {
  const d = v.data_ref || v.data_post || v.data_vista;
  if (!d) return null;
  const data = new Date(d + "T12:00:00Z");
  if (isNaN(data)) return null;
  const n = Math.floor((new Date() - data) / 86400000);
  return n < 0 ? null : n;
}
function textoData(v) {
  const n = dias(v);
  if (n === null) return "";
  if (n === 0) return "hoje";
  if (n === 1) return "ontem";
  if (n <= 30) return `há ${n} dias`;
  if (n <= 60) return "há mais de 1 mês";
  return "há mais de 2 meses";
}
const ehNova = v => { const n = dias(v); return n !== null && n <= 7; };

/* ── filtros ── */
function passa(v, ignorar) {
  if (ignorar !== "periodo" && fPeriodo !== "all") {
    const n = dias(v);
    if (n === null || n > Number(fPeriodo)) return false;
  }
  if (ignorar !== "cat" && fCats.size && !fCats.has(v.categoria)) return false;
  if (ignorar !== "emp" && fEmps.size && !fEmps.has(v.empresa)) return false;
  return true;
}
const filtradas = () => TODAS.filter(v => passa(v));

function montarFiltros() {
  // período, com a contagem que cada opção traria
  document.getElementById("grupoPeriodo").innerHTML = PERIODOS.map(p => {
    const q = TODAS.filter(v => {
      if (p.id === "all") return passa(v, "periodo");
      const n = dias(v);
      return n !== null && n <= Number(p.id) && passa(v, "periodo");
    }).length;
    return `<button class="seg-btn${fPeriodo === p.id ? " on" : ""}${q === 0 ? " vazia" : ""}" data-periodo="${p.id}">
      <span class="pip"></span>${p.nome}<span class="qt">${q}</span></button>`;
  }).join("");

  // áreas
  document.getElementById("grupoAreas").innerHTML = CAT_ORDEM
    .filter(c => TODAS.some(v => v.categoria === c))
    .map(c => {
      const q = TODAS.filter(v => v.categoria === c && passa(v, "cat")).length;
      return `<button class="opcao${fCats.has(c) ? " on" : ""}${q === 0 ? " vazia" : ""}" data-cat="${c}">
        <span class="caixa">✓</span><span class="nm">${CAT_NOME[c] || c}</span><span class="qt">${q}</span></button>`;
    }).join("");

  // empresas, as com mais vagas primeiro
  const ids = Object.keys(EMPRESAS)
    .filter(id => TODAS.some(v => v.empresa === id))
    .sort((a,b) => TODAS.filter(v => v.empresa === b).length - TODAS.filter(v => v.empresa === a).length);
  document.getElementById("grupoEmpresas").innerHTML = ids.map(id => {
    const e = EMPRESAS[id];
    const q = TODAS.filter(v => v.empresa === id && passa(v, "emp")).length;
    return `<button class="opcao${fEmps.has(id) ? " on" : ""}${q === 0 ? " vazia" : ""}" data-emp="${id}">
      <span class="caixa">✓</span>
      <span class="marca" style="background:${e.bg};">${logoHtml(e,22)}</span>
      <span class="nm">${esc(e.nome)}</span><span class="qt">${q}</span></button>`;
  }).join("");

  document.querySelectorAll("[data-periodo]").forEach(b => b.onclick = () => { fPeriodo = b.dataset.periodo; aplicar(); });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { alterna(fCats, b.dataset.cat); aplicar(); });
  document.querySelectorAll("[data-emp]").forEach(b => b.onclick = () => { alterna(fEmps, b.dataset.emp); aplicar(); });
}
const alterna = (conjunto, valor) => conjunto.has(valor) ? conjunto.delete(valor) : conjunto.add(valor);

/* ── etiquetas do que está ativo ── */
function montarAtivos() {
  const itens = [];
  if (fPeriodo !== "all") {
    const p = PERIODOS.find(x => x.id === fPeriodo);
    itens.push({ rotulo: p ? p.nome : fPeriodo, tipo: "periodo" });
  }
  fCats.forEach(c => itens.push({ rotulo: CAT_NOME[c] || c, tipo: "cat", valor: c }));
  fEmps.forEach(id => itens.push({ rotulo: (EMPRESAS[id] || {}).nome || id, tipo: "emp", valor: id }));

  document.getElementById("ativos").innerHTML = itens.map(i =>
    `<button class="ativo" data-tipo="${i.tipo}" data-valor="${i.valor || ""}">${esc(i.rotulo)}<span class="x">×</span></button>`).join("");

  document.querySelectorAll(".ativo").forEach(b => b.onclick = () => {
    const { tipo, valor } = b.dataset;
    if (tipo === "periodo") fPeriodo = "all";
    if (tipo === "cat") fCats.delete(valor);
    if (tipo === "emp") fEmps.delete(valor);
    aplicar();
  });

  const n = itens.length;
  document.getElementById("limpar").disabled = n === 0;
  const conta = document.getElementById("contaFiltros");
  conta.textContent = n; conta.hidden = n === 0;
}

/* ── ordenação ── */
function ordenar(lista) {
  const copia = [...lista];
  const nomeEmp = v => ((EMPRESAS[v.empresa] || {}).nome || v.empresa || "").toLowerCase();
  const idade = v => { const n = dias(v); return n === null ? Infinity : n; };
  if (ordem === "recentes") copia.sort((a,b) => idade(a) - idade(b));
  if (ordem === "antigas")  copia.sort((a,b) => idade(b) - idade(a));
  if (ordem === "empresa")  copia.sort((a,b) => nomeEmp(a).localeCompare(nomeEmp(b)) || (a.titulo||"").localeCompare(b.titulo||""));
  if (ordem === "titulo")   copia.sort((a,b) => (a.titulo||"").localeCompare(b.titulo||"", "pt-BR"));
  return copia;
}

/* ── desenho ── */
function cartao(v) {
  const e = EMPRESAS[v.empresa] || { nome:v.empresa, sigla:"?", cor:"#888", bg:"#222" };
  const nova = ehNova(v);
  const real = v.empresa_real ? `<div class="v-real">↳ ${esc(v.empresa_real)}</div>` : "";
  const doLinkedin = v.empresa === "linkedin" || v.fonte === "linkedin";
  const destino = doLinkedin
    ? `href="${esc(v.url)}" target="_blank" rel="noopener"`
    : `href="vaga.html?id=${encodeURIComponent(v.id || "")}"`;
  const rotulo = doLinkedin ? `abrir no LinkedIn <span class="arr">↗</span>` : `ver detalhes <span class="arr">→</span>`;

  return `<a class="vaga${nova ? " nova" : ""}" ${destino}>
    <div class="v-topo">
      <span class="marca" style="background:${e.bg};color:${e.cor};">${logoHtml(e,28)}</span>
      <span class="emp">${esc(e.nome)}</span>
      ${nova ? '<span class="selo-novo">nova</span>' : ""}
    </div>
    <div class="v-tit">${esc(v.titulo)}</div>${real}
    <div class="v-tags">
      <span class="tag blu">${esc(v.badge)}</span>
      <span class="tag">${esc(v.local)}</span>
    </div>
    <div class="v-pe">
      <span class="v-data">${textoData(v)}</span>
      <span class="v-mais">${rotulo}</span>
    </div>
  </a>`;
}

function montarStats() {
  const novas = TODAS.filter(ehNova).length;
  const emps = new Set(TODAS.map(v => v.empresa)).size;
  // o cartão só fica âmbar quando há novidade, senão parece alerta de erro
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${TODAS.length}</div><div class="l">vagas abertas</div></div>
    <div class="stat"><div class="n">${emps}</div><div class="l">empresas</div></div>
    <div class="stat${novas ? " amb" : ""}"><div class="n">${novas}</div><div class="l">novas nesta semana</div></div>
    <div class="stat"><div class="n">100<span class="u">%</span></div><div class="l">remoto · brasil</div></div>`;
}

function aplicar() {
  montarStats();
  montarFiltros();
  montarAtivos();

  const resultado = ordenar(filtradas());
  document.getElementById("contagem").innerHTML =
    `<b>${resultado.length}</b> ${resultado.length === 1 ? "vaga encontrada" : "vagas encontradas"}`;

  const lista = document.getElementById("lista");
  lista.innerHTML = resultado.length
    ? `<div class="grade">${resultado.map(cartao).join("")}</div>`
    : `<div class="vazio"><div class="big">◌</div>
         <p>Nenhuma vaga com esses filtros.<br>Tente tirar um deles ou ampliar o período.</p></div>`;
}

/* ── eventos gerais ── */
document.getElementById("limpar").onclick = () => {
  fPeriodo = "all"; fCats.clear(); fEmps.clear(); aplicar();
};
document.getElementById("ordem").onchange = e => { ordem = e.target.value; aplicar(); };
document.getElementById("abrirFiltros").onclick = e => {
  const p = document.getElementById("painelFiltros");
  const aberto = p.classList.toggle("aberto");
  e.currentTarget.setAttribute("aria-expanded", aberto ? "true" : "false");
};

iniciar();
</script>
</body>
</html>
