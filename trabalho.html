<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Controle — Home Office Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">

<!-- ══════════════════════════════════════════════════════════════
     Esta página existia sozinha. O Meu Controle virou uma página só,
     com a coluna da esquerda, e o trabalho agora mora dentro do
     controle.html. Este arquivo continua aqui para nenhum link
     antigo, favorito ou aba aberta quebrar: ele leva a pessoa para
     o lugar certo e sai da frente.
     ══════════════════════════════════════════════════════════════ -->

<script>
(function () {
  var id = new URLSearchParams(location.search).get("id");
  var destino = id ? "controle.html#trabalho/" + encodeURIComponent(id) : "controle.html#trabalhos";
  location.replace(destino);   // replace, e não href: o botão voltar não fica preso aqui
})();
</script>
<style>
  body { font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; background:#F7F4EF; color:#54606F;
    margin:0; min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px; }
  a { color:#1A4893; }
</style>
</head>
<body>
  <p>Levando você para o Meu Controle…<br>
     <a href="controle.html#trabalhos">Clique aqui se não for sozinho.</a></p>
</body>
</html>
