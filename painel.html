/* ── a candidatura aberta: as mesmas duas abas que o aluno vê no Meu Controle, só para ler ── */
/* o caminho da candidatura: a ordem e as etapas que o aluno ajustou, e por onde ela passou de verdade */
function trilhoCand(x) {
  const ap = x.ap;
  const meio = Array.isArray(ap.ordem) && ap.ordem.length ? ap.ordem.filter(k => MEIO.includes(k)) : MEIO;
  const cam = ["aplicado"].concat(meio, ["aprovado"]);
  const est = ap.estado || "aplicado";
  const passos = ap.passos && typeof ap.passos === "object" ? ap.passos : null;
  let feitos;
  if (passos) feitos = cam.map(k => k === "aplicado" || !!passos[k] || k === est);
  else {
    // candidatura de antes das etapas novas: conta como feito tudo até a etapa marcada
    const ate = est === "recusado" ? (etapaDaRecusa(ap) || "aplicado") : (cam.includes(est) ? est : "aplicado");
    const i = cam.indexOf(ate);
    feitos = cam.map((k, j) => j <= i && (k !== "entrevista" || ate === "entrevista"));
  }
  const atual = cam.includes(est) ? est : null;
  return `<ol class="cv-trilho" style="--n:${cam.length}">${cam.map((id, i) => {
    const pulada = !feitos[i] && feitos.slice(i + 1).some(Boolean);
    const cls = id === atual ? " atual" : feitos[i] ? " feita" : pulada ? " pulada" : "";
    const quando = i === 0 ? x.data : passos && ehData(passos[id]) ? passos[id] : "";
    return `<li class="cv-passo${cls}"><span class="cv-b"><i></i><span>${NOME_PASSO[id]}</span>${pulada ? `<small class="cv-nao">não teve</small>` : quando ? `<small>${curta(quando)}</small>` : ""}</span></li>`;
  }).join("")}</ol>`;
}
const DESFECHO = { rec: ["Recusado", "p-rec"], sem: ["Sem resposta", "p-sem"], des: ["Desisti", "p-des"] };
function pagamento(x) {
  const id = x.ap.vagaId, v = id && VAGAS_HUB && VAGAS_HUB[id];
  return (v && v.resumo && v.resumo.remuneracao) || x.ap.remuneracao || "";
}
function abaVagaCand(a, x) {
  const g = x.auto ? "and" : ST[x.status].grupo, d = DESFECHO[g];
  const pg = pagamento(x);
  return `<p class="pn-sub">Enviada em ${br(x.data) || "data não informada"} · vista em ${esc(x.ap.origem || "lugar não informado")}</p>
    <div class="cv-etapas"><div class="cv-etapas-tit">Em que etapa está</div>${trilhoCand(x)}
      ${d ? `<div class="cv-desfechos"><span>Desfecho:</span><span class="pill ${d[1]}">${d[0]}</span></div>` : ""}
      ${g === "rec" || g === "sem" ? `<div class="cv-rel"><b>O que aconteceu</b>
        ${g === "rec" ? `<div class="cv-tags"><span>${esc(ONDE[x.status].replace(/^./, l => l.toUpperCase()))}</span><span>${esc(x.motivo && x.motivo !== "Não sei" ? motivoTxt(x) : "Não sabe o motivo")}</span></div>` : ""}
        <p>${esc(x.relato) || '<span class="pn-sub">O aluno ainda não escreveu.</span>'}</p></div>` : ""}
    </div>
    ${pg ? `<div class="cv-fato"><small>Pagamento</small><b>${esc(pg)}</b></div>` : ""}
    ${x.prox ? `<div class="cv-parte"><h3>Próximo passo</h3><p>${esc(x.prox)}${ehData(x.proxEm) ? " · " + br(x.proxEm) : ""}</p></div>` : ""}
    <div class="cv-parte"><h3>Observações do aluno</h3><p>${esc(x.obs) || '<span class="pn-sub">sem observações</span>'}</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${x.ap.vagaId ? `<a class="pn-bt" href="vaga.html?id=${encodeURIComponent(x.ap.vagaId)}" target="_blank" rel="noopener">Ver a vaga no Hub ↗</a>` : ""}
      ${/^https?:\/\//i.test(x.ap.url || "") ? `<a class="pn-bt" href="${esc(x.ap.url)}" target="_blank" rel="noopener noreferrer">Ir para o anúncio oficial ↗</a>` : ""}</div>`;
}
function abaEditarCand(a, x) {
  const campo = (rot, v, larga) => `<div class="ce-campo${larga ? " larga" : ""}"><span>${rot}</span><div>${v || '<i class="pn-sub">não preencheu</i>'}</div></div>`;
  const url = x.ap.url || "";
  return `<div class="ce-grade">
    ${campo("Empresa", esc(x.empresa))}${campo("Enviada em", esc(br(x.data)))}
    ${campo("Título da vaga", esc(x.vaga), true)}
    ${campo("Link do anúncio", /^https?:\/\//i.test(url) ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>` : esc(url), true)}
    ${campo("Onde você viu", esc(x.ap.origem || ""))}${campo("Valor anunciado", esc(x.ap.remuneracao || ""))}
    ${campo("E-mail que você usou", esc(x.email), true)}
    ${campo("Currículo enviado", (x.apelido || x.cv) ? `${esc(x.apelido)} ${x.cv ? `<button class="pdf" data-pdf="${esc(x.cv.caminho)}" data-nome="${esc(x.cv.nome || "curriculo.pdf")}"><i>PDF</i>${esc(x.cv.nome || "Abrir")}</button>` : ""}` : "", true)}
    ${campo("Próximo passo", esc(x.prox))}${campo("Quando", esc(br(x.proxEm)))}
    ${campo("Observações", esc(x.obs), true)}
  </div>`;
}
let fecharGaveta = null;
function abrirCand(idAluno, i, aba) {
  const a = ALUNOS.find(x => x.id === idAluno), x = a && a.cand[i];
  if (!x) return;
  aba = aba || "vaga";
  if (fecharGaveta) document.removeEventListener("keydown", fecharGaveta);
  const g = document.getElementById("gaveta");
  const dias = diasDesde(x.data);
  g.innerHTML = `<div class="pn-veu" data-fechar></div><aside class="pn-gaveta" role="dialog" aria-modal="true" aria-label="Candidatura">
    <button class="pn-bt pn-fecha" data-fechar>Fechar ✕</button>
    <div class="rot">Candidatura de ${esc(a.nome)}</div>
    <h2>${esc(x.vaga)}</h2><div class="pn-sub" style="margin-top:-8px">${esc(x.empresa)}</div>
    ${x.status === "Sem resposta" && dias < 999 ? `<div class="pn-auto"><b>${dias} dias sem resposta</b> · ${x.auto
      ? `o aluno mandou o currículo em ${curta(x.data)} e não mexeu mais. Só a equipe vê isto: no Meu Controle dele continua Currículo enviado.`
      : `desde o envio do currículo, em ${curta(x.data)}.`}</div>` : ""}
    <div class="cv-abas" role="tablist">${[["vaga", "A vaga"], ["editar", "Editar"]].map(([k2, n]) =>
      `<button role="tab" data-abag="${k2}" aria-selected="${aba === k2}">${n}</button>`).join("")}</div>
    <p class="pn-ajuda" style="margin:-4px 0 0">As duas abas que o aluno vê no Meu Controle, com o que ele preencheu. Aqui é só para ler: quem muda é o aluno.</p>
    ${aba === "vaga" ? abaVagaCand(a, x) : abaEditarCand(a, x)}
  </aside>`;
  const fechar = () => { g.innerHTML = ""; document.removeEventListener("keydown", fecharGaveta); fecharGaveta = null; };
  fecharGaveta = ev => { if (ev.key === "Escape" && !document.querySelector("dialog.lt-casca, .lt")) fechar(); };
  document.addEventListener("keydown", fecharGaveta);
  g.querySelectorAll("[data-fechar]").forEach(b => b.onclick = fechar);
  g.querySelectorAll("[data-abag]").forEach(b => b.onclick = () => abrirCand(idAluno, i, b.dataset.abag));
  ligarPdf(g);
  if (!VAGAS_HUB && x.ap.vagaId) carregarVagasHub().then(() => { if (g.querySelector(".pn-gaveta") && aba === "vaga" && pagamento(x)) abrirCand(idAluno, i, aba); });
}
async function carregarVagasHub() {
  if (VAGAS_HUB) return;
  VAGAS_HUB = {};
  for (const arq of ["vagas.json", "vagas-especificas.json"]) {
    try { const d = await fetch(arq, { cache: "no-cache" }).then(r => r.json()); (d.vagas || []).forEach(v => { VAGAS_HUB[v.id] = v; }); } catch (e) { /* sem o pagamento */ }
  }
}

/* o PDF do currículo vem do armazenamento (banco/curriculos.sql), que só entrega à equipe e ao próprio aluno */
function ligarPdf(raiz) {
  raiz.querySelectorAll("[data-pdf]").forEach(b => b.addEventListener("click", ev => {
    ev.stopPropagation();
    if (typeof Leitor === "undefined") return;
    Leitor.abrir({ nome: b.dataset.nome || "curriculo.pdf", tipo: "application/pdf", tamanho: 0, buscar: async () => {
      const r = await cli.storage.from("curriculos").download(b.dataset.pdf);
      if (r.error) throw new Error(/not found/i.test(r.error.message || "") ? "Este PDF não está mais guardado." : "Não deu para abrir o PDF agora.");
      return r.data;
    } });
  }));
}

function avisar(texto, erro) {
  const m = document.createElement("div");
  m.className = "pn-msg" + (erro ? " erro" : ""); m.setAttribute("role", "status"); m.textContent = texto;
  document.body.appendChild(m); setTimeout(() => m.remove(), erro ? 6000 : 3000);
}

function render() {
  abas();
  const alvo = document.getElementById("conteudo"), eq = document.getElementById("equipe");
  eq.hidden = S.aba !== "equipe";
  if (S.aba === "equipe") { alvo.innerHTML = ""; return; }
  alvo.innerHTML = S.aba === "geral" ? geral() : S.aba === "alunos" ? alunos() : S.aba === "empresas" ? empresasTela() : vagasTela();
  ligarPdf(alvo);
  const mn = alvo.querySelector("#maisNumeros"); if (mn) mn.addEventListener("toggle", () => { if (mn.open) numerosSite(); });
  alvo.querySelectorAll("[data-aluno]").forEach(b => b.onclick = () => {
    S.aba = "alunos"; S.sel = b.dataset.aluno; S.editando = false; S.novoContato = false; S.mudandoPlano = false; render();
    const det = document.querySelector(".pn-det");
    if (window.innerWidth < 980 && det) det.scrollIntoView(); else window.scrollTo(0, 0);
  });
  alvo.querySelectorAll("[data-ir-alunos]").forEach(b => b.onclick = () => { S.filtro = "atencao"; irAba("alunos"); });
  alvo.querySelectorAll("[data-ir]").forEach(b => b.onclick = () => irAba(b.dataset.ir));
  alvo.querySelectorAll("[data-emp]").forEach(b => b.onclick = () => { S.aba = "empresas"; S.selEmp = b.dataset.emp; S.f = FILTROS(); S.trabMostrar = 6; render(); });
  alvo.querySelectorAll("[data-vaga]").forEach(b => b.onclick = () => { S.aba = "vagas"; S.selVaga = b.dataset.vaga; S.f = FILTROS(); render(); });
  alvo.querySelectorAll("[data-top]").forEach(b => b.onclick = () => { S.top = +b.dataset.top; render(); });
  /* busca e filtros: redesenha a cada letra e devolve o cursor para o campo */
  const aoDigitar = (sel, guarda) => { const el = alvo.querySelector(sel); if (el) el.oninput = () => { guarda(el.value); const pos = el.selectionStart; render(); const n = document.querySelector(sel); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }; };
  aoDigitar("[data-f=busca]", v => { S.f.busca = v; S.f.mostrar = 20; });
  aoDigitar("#empBusca", v => S.empBusca = v);
  aoDigitar("#vagaBusca", v => S.vagaBusca = v);
  aoDigitar("#busca", v => { S.busca = v; S.mostrar = 20; });
  alvo.querySelectorAll("select[data-f]").forEach(s2 => s2.onchange = () => { S.f[s2.dataset.f] = s2.value; S.f.mostrar = 20; render(); });
  alvo.querySelectorAll("[data-tile]").forEach(b => b.onclick = () => { S.f.etapa = S.f.etapa === b.dataset.tile ? "" : b.dataset.tile; S.f.mostrar = 20; render(); });
  alvo.querySelectorAll("[data-limpar]").forEach(b => b.onclick = () => { S.f = Object.assign(FILTROS(), { ordem: S.f.ordem }); render(); });
  alvo.querySelectorAll("[data-mais-f]").forEach(b => b.onclick = () => { S.f.mostrar += 20; render(); });
  alvo.querySelectorAll("[data-trab-mais]").forEach(b => b.onclick = () => { S.trabMostrar = Infinity; render(); });
  const eo = alvo.querySelector("#empOrdem"); if (eo) eo.onchange = () => { S.empOrdem = eo.value; render(); };
  alvo.querySelectorAll("[data-cand]").forEach(tr => tr.onclick = () => { const [id, i] = tr.dataset.cand.split("|"); abrirCand(id, +i); });
  alvo.querySelectorAll("[data-filtro]").forEach(b => b.onclick = () => { S.filtro = b.dataset.filtro; S.mostrar = 20; render(); });
  alvo.querySelectorAll("[data-filtro-plano]").forEach(b => b.onclick = () => { S.planoF = b.dataset.filtroPlano; S.mostrar = 20; render(); });
  alvo.querySelectorAll("[data-espera]").forEach(b => b.onclick = () => abrirEspera());
  alvo.querySelectorAll("[data-mudar-plano]").forEach(b => b.onclick = () => { S.mudandoPlano = true; render(); });
  alvo.querySelectorAll("[data-cancelar-plano]").forEach(b => b.onclick = () => { S.mudandoPlano = false; render(); });
  const fpl = alvo.querySelector("#formPlano");
  if (fpl) {
    const a = ALUNOS.find(x => x.id === S.sel), bt = fpl.querySelector(".forte");
    fpl.querySelectorAll("input[name=plano]").forEach(r => r.onchange = () => { bt.disabled = r.value === a.plano; });
    fpl.onsubmit = async ev => {
      ev.preventDefault();
      const novo = (fpl.querySelector("input[name=plano]:checked") || {}).value;
      if (novo === undefined || novo === a.plano) return;
      bt.disabled = true;
      const r = await cli.rpc("admin_plano_definir", { p_aluno: a.id, p_plano: novo });
      if (r.error) { console.warn(r.error); bt.disabled = false; avisar("Não deu para salvar o plano. Confira a internet e tente de novo.", true); return; }
      a.plano = novo; a.planoPor = EU_NOME || "você"; a.planoEm = hojeIso();
      S.mudandoPlano = false; render();
      avisar(novo ? `${a.nome.split(" ")[0]} agora está no ${nomePlano(novo)}.` : `${a.nome.split(" ")[0]} ficou sem plano.`);
    };
  }
  alvo.querySelectorAll("[data-abaal]").forEach(b => b.onclick = () => { S.abaAl = b.dataset.abaal; S.editando = false; S.mudandoPlano = false; render(); });
  const ordem = alvo.querySelector("#ordem"); if (ordem) ordem.onchange = () => { S.ordem = ordem.value; render(); };
  const mais = alvo.querySelector("#mais"); if (mais) mais.onclick = () => { S.mostrar += 20; render(); };
  alvo.querySelectorAll("[data-editar]").forEach(b => b.onclick = () => { S.editando = true; render(); });
  alvo.querySelectorAll("[data-cancelar]").forEach(b => b.onclick = () => { S.editando = false; render(); });
  alvo.querySelectorAll("[data-novo-contato]").forEach(b => b.onclick = () => { S.abaAl = "acomp"; S.novoContato = true; render(); const t = document.querySelector("#formContato textarea"); if (t) t.focus(); });
  alvo.querySelectorAll("[data-cancelar-contato]").forEach(b => b.onclick = () => { S.novoContato = false; render(); });
  alvo.querySelectorAll(".pn-chip.tipo").forEach(sp => { const inp = sp.previousElementSibling; sp.setAttribute("aria-pressed", inp.checked); sp.onclick = () => { inp.checked = true; alvo.querySelectorAll(".pn-chip.tipo").forEach(s2 => s2.setAttribute("aria-pressed", s2.previousElementSibling.checked)); }; });
  const fp = alvo.querySelector("#formPerfil");
  if (fp) fp.onsubmit = async ev => {
    ev.preventDefault();
    const a = ALUNOS.find(x => x.id === S.sel), perfil = {};
    CAMPOS.forEach(([k2]) => perfil[k2] = fp.elements[k2].value.trim()); perfil.obs = fp.elements.obs.value.trim();
    const bt = fp.querySelector(".forte"); bt.disabled = true;
    const r = await cli.rpc("admin_perfil_salvar", { p_aluno: a.id, p_cidade: perfil.cidade, p_ingles: perfil.ingles, p_foco: perfil.foco, p_horas: perfil.horas, p_telefone: perfil.telefone, p_obs: perfil.obs });
    if (r.error) { console.warn(r.error); bt.disabled = false; avisar("Não deu para salvar o perfil. Confira a internet e tente de novo.", true); return; }
    Object.assign(a, perfil); S.editando = false; render(); avisar("Perfil salvo.");
  };
  const fc = alvo.querySelector("#formContato");
  if (fc) fc.onsubmit = async ev => {
    ev.preventDefault();
    const texto = fc.elements.texto.value.trim(); if (!texto) return;
    const a = ALUNOS.find(x => x.id === S.sel), tipo = fc.querySelector("input[name=tipo]:checked").value;
    const bt = fc.querySelector(".forte"); bt.disabled = true;
    const r = await cli.rpc("admin_contato_registrar", { p_aluno: a.id, p_tipo: tipo, p_texto: texto });
    if (r.error) { console.warn(r.error); bt.disabled = false; avisar("Não deu para salvar o contato. Confira a internet e tente de novo.", true); return; }
    a.contatos.unshift({ data: hojeIso(), tipo, texto, por: EU_NOME || "você" });
    calcular(a); S.novoContato = false; render(); avisar("Contato registrado.");
  };
}

document.getElementById("csv").onclick = () => {
  const linhas = [["Aluno", "E-mail da conta", "Plano", "Empresa", "Vaga", "Etapa", "Motivo", "Enviada em", "Currículo"]].concat(todas().map(x =>
    [x.aluno.nome, x.aluno.email, PLANOS[x.aluno.plano] || "", x.empresa, x.vaga, ST[x.status].rot || x.status, ST[x.status].grupo === "rec" ? motivoTxt(x) : "", br(x.data), x.apelido || (x.cv && x.cv.nome) || ""]));
  const csv = "﻿" + linhas.map(l => l.map(v => `"${String(v || "").replace(/"/g, '""')}"`).join(";")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "candidaturas-" + hojeIso() + ".csv"; a.click();
};

/* logos das empresas, os mesmos da página Empresas */
async function carregarEmpresas() {
  try { EMPRESAS_HUB = ((await fetch("empresas.json").then(r => r.json())).empresas || []).filter(e => e && e.id && e.nome); } catch (e) { EMPRESAS_HUB = []; }
}
/* as fotos chegam depois do resto; quando chegam, as iniciais viram foto */
async function carregarFotos() {
  if (!ALUNOS.some(a => a.temFoto && !a.foto)) return;
  const r = await cli.rpc("admin_painel_fotos");
  if (r.error || !r.data) { console.warn(r.error); return; }
  let mudou = false;
  ALUNOS.forEach(a => { const f = r.data[a.id]; if (typeof f === "string" && /^data:image\/(png|jpeg|webp);base64,/.test(f)) { a.foto = f; mudou = true; } });
  if (mudou && S.aba !== "equipe" && !document.querySelector("#formPerfil, #formContato")) render();
}

async function carregar() {
  const r = await cli.rpc("admin_painel");
  if (r.error) return r.error;
  montar(r.data || {});
  carregarFotos();
  const quando = GERADO ? new Date(GERADO).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";
  document.getElementById("pnData").textContent = quando ? "Lido em " + quando : "";
  return null;
}
document.getElementById("atualizar").onclick = async ev => {
  const b = ev.currentTarget; b.disabled = true; TOT = null;
  const erro = await carregar(); b.disabled = false;
  if (erro) { avisar("Não deu para atualizar agora. Confira a internet e tente de novo.", true); return; }
  render(); avisar("Painel atualizado.");
};

/* ══════════════════════════════════════════════════════════
   EQUIPE: quem entra neste painel
   Todos da equipe veem a lista; só o dono do site inclui ou tira
   alguém. A regra está no banco (banco/mentorias-2.sql).
   ══════════════════════════════════════════════════════════ */
async function equipe(aviso) {
  const alvo = document.getElementById("equipe");
  if (typeof MD === "undefined") return;
  let d;
  try { d = await MD.equipe(); } catch (e) { alvo.innerHTML = `<p class="pn-vazio">Não deu para buscar a equipe agora.</p>`; return; }
  MD.ui.porCss();
  const pessoas = d.pessoas || [];
  const eu = pessoas.find(p => p.eu); if (eu) EU_NOME = eu.nome || String(eu.email || "").split("@")[0];
  alvo.innerHTML = `<section class="p-cx"><h2>Equipe</h2>
    <p class="sub">Quem está nesta lista abre este painel. Ninguém mais consegue: o servidor recusa.
      ${d.sou_dono ? "" : "Só o dono do site inclui ou tira pessoas."}</p>
    ${pessoas.map(p => `<div class="p-pessoa"><div><b>${esc(p.nome || p.email)}</b>${p.eu ? " (você)" : ""}
        <span>${p.nome ? esc(p.email) + " · " : ""}${p.dono ? "dono do site" : "equipe"}</span></div>
      ${d.sou_dono && !p.dono && !p.eu ? `<button class="md-link" type="button" data-tirar="${esc(p.id)}">tirar da equipe</button>` : ""}</div>`).join("")}
    ${d.sou_dono ? `<form class="p-bts" id="eqForm" novalidate>
        <input type="email" id="eqEmail" maxlength="200" placeholder="E-mail da conta da pessoa no Hub" autocomplete="off">
        <button class="md-bt pequeno" type="submit">Incluir na equipe</button></form>
      <div class="p-dica">A pessoa precisa já ter criado a conta no site, com este mesmo e-mail.</div>` : ""}
    <div class="md-msg${aviso ? " " + aviso[1] : ""}" id="eqMsg" role="status"${aviso ? "" : " hidden"}>${aviso ? esc(aviso[0]) : ""}</div>
  </section>`;

  const dizerEq = (t, tipo) => { const m = alvo.querySelector("#eqMsg"); m.textContent = t; m.className = "md-msg " + tipo; m.hidden = false; };
  const form = alvo.querySelector("#eqForm");
  if (form) form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const campo = alvo.querySelector("#eqEmail"), em = campo.value.trim();
    if (!/^\S+@\S+\.\S+$/.test(em)) { campo.focus(); dizerEq("Escreva o e-mail da conta da pessoa.", "erro"); return; }
    const bt = form.querySelector("button"); bt.disabled = true;
    try { await MD.equipeAdicionar(em); equipe([em + " agora faz parte da equipe.", "ok"]); }
    catch (e) { dizerEq(e.message, "erro"); bt.disabled = false; }
  });
  alvo.onclick = async ev => {
    const b = ev.target.closest("[data-tirar]"); if (!b) return;
    if (!(await MD.ui.confirmar({ titulo: "Tirar esta pessoa da equipe?",
      texto: "Ela deixa de abrir o painel. A conta dela no Hub continua normal.", botao: "Tirar da equipe" }))) return;
    b.disabled = true;
    try { await MD.equipeRemover(b.dataset.tirar); equipe(["Pessoa tirada da equipe.", "ok"]); }
    catch (e) { dizerEq(e.message, "erro"); b.disabled = false; }
  };
}

(async function () {
  const espera = document.getElementById("espera");
  if (typeof supabase === "undefined" || !supabase.createClient) {
    espera.textContent = "Não deu para falar com o servidor de contas. Confira a internet e recarregue a página.";
    return;
  }
  cli = supabase.createClient(ENDERECO, CHAVE_PUBLICA, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });
  let sessao = null;
  try { sessao = (await cli.auth.getSession()).data.session; } catch (e) { console.warn(e); }
  if (!sessao) {
    espera.outerHTML = Acesso.htmlAviso("O painel é só para a equipe do Hub", "Entre na sua conta para continuar.");
    return;
  }
  // a primeira leitura também serve de porteiro: o banco recusa quem não é da equipe
  const [erro] = await Promise.all([carregar(), carregarEmpresas()]);
  if (erro) {
    console.warn(erro);
    espera.textContent = erro.code === "42501" || /administra/i.test(erro.message || "")
      ? "Esta página é só para a equipe do Hub." : "Não deu para abrir o painel agora. Confira a internet e recarregue a página.";
    return;
  }
  espera.hidden = true;
  document.getElementById("cabeca").hidden = false;
  const h = location.hash.slice(1);
  S.aba = ABAS.some(x => x[0] === h) ? h : "geral";
  render();
  equipe();
})();
})();
</script>
