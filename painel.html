<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da equipe — Home Office Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
/* ══════════════════════════════════════════════════════════════
   PAINEL DA EQUIPE — acompanhamento dos alunos.
   Quem decide quem pode ver é o banco (banco/painel-equipe.sql);
   esta página só desenha o que ele entrega.
   ══════════════════════════════════════════════════════════════ */
.pn-main { max-width:1280px; margin:0 auto; padding:40px 20px 90px; min-height:60vh; }
.pn-espera { text-align:center; padding:80px 20px; color:var(--ink-3); font-size:14px; }
.pn-topo { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.pn-topo h1 { font-family:var(--display); font-weight:400; font-size:clamp(28px,3.6vw,40px); line-height:1.1; letter-spacing:-0.015em; color:var(--ink); }
.pn-topo p { font-size:14px; color:var(--ink-3); margin-top:4px; }
.pn-topo-bts { display:flex; gap:8px; flex-wrap:wrap; }
.pn-abas { display:flex; gap:4px; box-shadow:inset 0 -1px 0 var(--line); margin:20px 0 24px; overflow-x:auto; overflow-y:hidden; }
.pn-abas button { font:inherit; font-size:14.5px; font-weight:500; color:var(--ink-2); background:none; border:0; border-bottom:2px solid transparent; padding:11px 14px; cursor:pointer; white-space:nowrap; }
.pn-abas button[aria-selected="true"] { color:var(--ink); font-weight:600; border-bottom-color:var(--signal); }
.pn-cnt { display:inline-block; min-width:20px; padding:1px 6px; margin-left:5px; border-radius:99px; font-size:12px; font-weight:600; text-align:center; color:#fff; background:#A85D24; }
.pn-cnt.cinza { background:var(--bg-soft); color:var(--ink-3); }
.pn-bt { display:inline-flex; align-items:center; gap:7px; font:inherit; font-size:13.5px; font-weight:500; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:8px 15px; cursor:pointer; white-space:nowrap; text-decoration:none; }
.pn-bt:hover { border-color:var(--ink-3); }
.pn-bt.forte { background:var(--signal); border-color:var(--signal); color:#fff; }
.pn-bt.ambar { border-color:#A85D24; color:#A85D24; }
.pn-bt:disabled { opacity:.55; cursor:default; }
.pn-lnk { font:inherit; font-size:13.5px; font-weight:500; color:var(--signal); background:none; border:0; cursor:pointer; padding:0; }
.pn-nums { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
@media (max-width:1000px){ .pn-nums { grid-template-columns:repeat(2,1fr); } }
.pn-num { background:var(--panel); border:1px solid var(--line-soft); border-radius:18px; padding:16px 18px 14px; }
.pn-num .r { font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.pn-num .v { font-family:var(--display); font-size:36px; line-height:1.1; color:var(--ink); margin:6px 0 4px; }
.pn-num .d { font-size:12.5px; color:var(--ink-2); line-height:1.4; }
.pn-cx { background:var(--panel); border:1px solid var(--line-soft); border-radius:18px; padding:20px 22px; min-width:0; }
.pn-cx h2, .pn-h3 { font-size:16px; font-weight:600; color:var(--ink); letter-spacing:-0.01em; }
.pn-cx .sub, .pn-sub { font-size:13px; color:var(--ink-3); line-height:1.5; }
.pn-cab { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.pn-g2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
@media (max-width:900px){ .pn-g2 { grid-template-columns:1fr; } }
table.pn-t { width:100%; border-collapse:collapse; font-size:13.5px; }
.pn-t th { text-align:left; font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); padding:0 12px 8px 0; border-bottom:1px solid var(--line-soft); white-space:nowrap; }
.pn-t td { padding:10px 12px 10px 0; border-bottom:1px solid var(--line-soft); color:var(--ink-2); vertical-align:middle; }
.pn-t tr:last-child td { border-bottom:0; }
.pn-t tr.clica { cursor:pointer; } .pn-t tr.clica:hover td { background:var(--signal-suave); }
.pn-t .forte { color:var(--ink); font-weight:500; }
.pn-av { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%; font-size:11.5px; font-weight:600; color:#fff; margin-right:9px; vertical-align:middle; flex-shrink:0; }
.pill { display:inline-block; font-size:12px; font-weight:500; border-radius:99px; padding:3px 10px; white-space:nowrap; border:1px solid; }
.p-env { background:#F1ECE3; color:#54606F; border-color:#DED7CA; } .p-teste { background:#EAF1F8; color:#1A4893; border-color:#D3E2F1; }
.p-entr { background:#FBF0E4; color:#A85D24; border-color:#F0DCC6; } .p-aprov { background:#E4F3F0; color:#1F7A6E; border-color:#C6E5DE; }
.p-rec { background:#FBE9EB; color:#8E2233; border-color:#F1CDD2; } .p-sem { background:#F7F4EF; color:#66717F; border-color:#EAE4D9; }
.p-des { background:#F3EFF6; color:#6E4590; border-color:#E2D6EC; }
.p-prova { background:#EEF0FA; color:#3D4A9C; border-color:#D9DDF2; }
.p-banco { background:#F1EEF7; color:#5B4B9E; border-color:#DFD8EE; }
.p-falta { background:#FBF0E4; color:#7A4318; border-color:#F0DCC6; } .p-ja { background:#EAF1F8; color:#1A4893; border-color:#D3E2F1; }
.tag { display:inline-block; font-size:12px; color:#8E2233; background:#FBE9EB; border-radius:6px; padding:2px 7px;
  max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; }
/* tabela larga não sai da caixa: rola para o lado só se precisar; a vaga nunca fica espremida */
.pn-rolagem { overflow-x:auto; }
.pn-t td.vg { min-width:150px; }
.pn-rolagem .pn-quem .nm { max-width:150px; }
.pn-rolagem .tag { max-width:130px; }
.pdf { display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12.5px; color:var(--signal); font-weight:500; border:1px solid #D3E2F1; background:var(--signal-suave); border-radius:8px; padding:3px 8px; white-space:nowrap; cursor:pointer; }
.pdf i { font-style:normal; font-size:10px; font-weight:700; color:#fff; background:#8E2233; border-radius:3px; padding:1px 3px; }
.pn-barras { display:grid; gap:11px; }
.pn-barra { display:grid; grid-template-columns:190px 1fr 80px; align-items:center; gap:12px; font-size:13.5px; color:var(--ink-2); }
@media (max-width:560px){ .pn-barra { grid-template-columns:120px 1fr 64px; } }
.pn-barra .tr { height:10px; border-radius:99px; background:var(--bg-soft); overflow:hidden; }
.pn-barra .tr i { display:block; height:100%; border-radius:99px; }
.pn-barra .q { text-align:right; color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums; }
.pn-insight { margin-top:14px; padding-top:12px; border-top:1px solid var(--line-soft); font-size:13.5px; color:var(--ink-2); line-height:1.5; }
.pn-itens { list-style:none; display:flex; flex-direction:column; gap:2px; }
.pn-item { display:flex; align-items:center; gap:11px; width:100%; text-align:left; font:inherit; background:none; border:0; border-radius:12px; padding:9px 10px; cursor:pointer; color:var(--ink); }
.pn-item:hover { background:var(--bg-soft); }
.pn-item[aria-current="true"] { background:var(--signal-suave); }
.pn-item .t { flex:1; min-width:0; } .pn-item b { display:block; font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pn-item small { display:block; font-size:12px; color:var(--ink-3); }
.pn-rank { font-family:var(--display); font-size:22px; width:28px; text-align:center; color:var(--signal); flex-shrink:0; }
.pn-duas { display:grid; grid-template-columns:340px minmax(0,1fr); gap:18px; align-items:start; }
@media (max-width:980px){ .pn-duas { grid-template-columns:1fr; } .pn-lista { position:static !important; max-height:420px !important; } }
.pn-lista { background:var(--panel); border:1px solid var(--line-soft); border-radius:18px; padding:14px; position:sticky; top:96px; max-height:calc(100vh - 120px); overflow:auto; }
.pn-busca { width:100%; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:12px; padding:9px 12px; background:var(--bg); }
.pn-chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px; }
.pn-chip { font:inherit; font-size:12.5px; padding:5px 11px; border-radius:99px; border:1px solid var(--line); color:var(--ink-2); background:var(--panel); cursor:pointer; }
.pn-chip[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
.pn-ordem { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-3); margin-bottom:8px; }
.pn-ordem select { font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:9px; background:var(--panel); flex:1; }
.pn-det { display:flex; flex-direction:column; gap:16px; min-width:0; }
.pn-cabal { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.pn-cabal .nm { font-family:var(--display); font-size:28px; color:var(--ink); line-height:1.15; overflow-wrap:anywhere; }
.pn-alerta { background:#FBF0E4; border:1px solid #F0DCC6; border-radius:16px; padding:14px 18px; color:#7A4318; font-size:13.5px; line-height:1.55; }
.pn-alerta b { color:#5E3312; } .pn-alerta ul { margin:6px 0 0 18px; }
.pn-abas2 { display:flex; gap:4px; box-shadow:inset 0 -1px 0 var(--line); overflow-x:auto; }
.pn-abas2 button { font:inherit; font-size:14px; font-weight:500; color:var(--ink-2); background:none; border:0; border-bottom:2px solid transparent; padding:9px 12px; cursor:pointer; white-space:nowrap; }
.pn-abas2 button[aria-selected="true"] { color:var(--ink); font-weight:600; border-bottom-color:var(--signal); }
.pn-ajuda { font-size:13px; color:var(--ink-3); margin-top:-6px; }
.pn-tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
@media (max-width:560px){ .pn-tiles { grid-template-columns:repeat(2,1fr); } }
.pn-tl { background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:12px 14px; }
.pn-tl .r { font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); }
.pn-tl .v { font-family:var(--display); font-size:30px; color:var(--ink); margin-top:4px; }
.pn-campos { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px 20px; }
.pn-campos dt, .pn-campos label { font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:4px; }
.pn-campos dd { font-size:14.5px; color:var(--ink); }
.pn-in { width:100%; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:11px; padding:9px 12px; background:var(--panel); color:var(--ink); }
textarea.pn-in { min-height:80px; resize:vertical; line-height:1.5; }
.pn-acoes { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
.pn-tempo { list-style:none; }
.pn-tempo li { display:grid; grid-template-columns:62px 1fr; gap:12px; padding:11px 0; border-top:1px solid var(--line-soft); font-size:13.5px; color:var(--ink-2); line-height:1.5; overflow-wrap:anywhere; }
.pn-tempo b { display:block; color:var(--ink); font-size:13px; }
.pn-cartoes { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
.pn-mini { background:var(--panel); border:1px solid var(--line-soft); border-radius:14px; padding:12px 14px; font-size:13px; color:var(--ink-2); line-height:1.45; }
.pn-mini b { display:block; font-size:14px; color:var(--ink); margin:6px 0 2px; }
.pn-vazio { padding:20px; text-align:center; color:var(--ink-3); font-size:14px; border:1px dashed var(--line); border-radius:14px; }
/* gaveta da candidatura */
.pn-veu { position:fixed; inset:0; background:rgba(16,32,58,.34); z-index:200; }
.pn-gaveta { position:fixed; top:0; right:0; bottom:0; width:min(660px,100%); background:var(--panel); z-index:201; box-shadow:-30px 0 80px -30px rgba(16,32,58,.5);
  padding:26px 28px; overflow:auto; display:flex; flex-direction:column; gap:14px; }
@media (max-width:560px){ .pn-gaveta { padding:22px 18px; } }
.pn-gaveta .rot { font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); padding-right:110px; }
.pn-gaveta h2 { font-family:var(--display); font-weight:400; font-size:26px; line-height:1.15; color:var(--ink); overflow-wrap:anywhere; }
/* a candidatura como o aluno vê: abas "A vaga" e "Editar", iguais às do Meu Controle */
.cv-abas { display:inline-flex; gap:2px; padding:4px; border-radius:14px; background:var(--bg-soft); align-self:flex-start; }
.cv-abas button { font:inherit; font-size:14px; font-weight:600; color:var(--ink-2); background:none; border:0; border-radius:10px; padding:8px 18px; cursor:pointer; }
.cv-abas button[aria-selected="true"] { background:var(--panel); color:var(--ink); box-shadow:0 1px 3px rgba(16,32,58,.12); }
.cv-etapas { border:1px solid var(--line-soft); border-radius:14px; padding:14px 16px 12px; background:var(--panel); }
.cv-etapas-tit { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin-bottom:12px; }
.cv-trilho { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(var(--n,5), 1fr); }
.cv-passo { position:relative; }
.cv-passo::before { content:""; position:absolute; top:11px; left:-50%; right:50%; height:2px; background:var(--line); }
.cv-passo:first-child::before { display:none; }
.cv-passo.feita::before, .cv-passo.atual::before { background:var(--signal); }
.cv-passo.pulada::before, .cv-passo.pulada + .cv-passo.feita::before, .cv-passo.pulada + .cv-passo.atual::before { background:repeating-linear-gradient(90deg, var(--signal) 0 6px, transparent 6px 11px); }
.cv-b { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:500; color:var(--ink-2); text-align:center; line-height:1.25; padding:0 3px; }
.cv-b i { width:24px; height:24px; border-radius:50%; background:var(--panel); border:2px solid var(--line); display:grid; place-items:center; }
.cv-b small { font-size:11px; font-weight:400; color:var(--ink-3); margin-top:-3px; }
.cv-passo.feita .cv-b i { background:var(--signal); border-color:var(--signal); }
.cv-passo.feita .cv-b i::after { content:""; width:9px; height:5px; border:2px solid #fff; border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px); }
.cv-passo.atual .cv-b i { border-color:var(--signal); box-shadow:0 0 0 5px rgba(26,72,147,.14); }
.cv-passo.atual .cv-b i::after { content:""; width:10px; height:10px; border-radius:50%; background:var(--signal); }
.cv-passo.atual .cv-b { color:var(--ink); font-weight:600; }
.cv-passo.pulada .cv-b i { border-style:dashed; border-color:#B9B1A3; background:var(--bg-soft); }
.cv-passo.pulada .cv-b > span { color:var(--ink-3); }
.cv-b .cv-nao { color:#A85D24; font-weight:500; }
.cv-desfechos { display:flex; align-items:center; gap:8px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-3); }
.cv-rel { margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--panel-2); border:1px solid var(--line-soft); font-size:14px; line-height:1.55; color:var(--ink); overflow-wrap:anywhere; }
.cv-rel b { font-size:13.5px; } .cv-rel p { margin:6px 0 0; white-space:pre-wrap; }
.cv-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
.cv-tags span { font-size:12px; color:#8E2233; background:#FBE9EB; border-radius:6px; padding:2px 8px; }
.cv-fato { background:#E4F3F0; border:1px solid #C6E5DE; border-radius:12px; padding:9px 12px; }
.cv-fato small { display:block; font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:#1F7A6E; margin-bottom:2px; }
.cv-fato b { font-size:13.5px; color:#1F7A6E; }
.cv-parte h3 { display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); margin:0 0 6px; }
.cv-parte h3::before { content:""; width:5px; height:5px; border-radius:50%; background:var(--signal); }
.cv-parte p { font-size:14.5px; line-height:1.6; color:var(--ink); margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
.ce-grade { display:grid; grid-template-columns:1fr 1fr; gap:14px 14px; }
@media (max-width:560px){ .ce-grade { grid-template-columns:1fr; } }
.ce-campo.larga { grid-column:1 / -1; }
.ce-campo > span { display:block; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:6px; }
.ce-campo > div { min-height:42px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:9px 13px; border:1px solid var(--line-soft); border-radius:12px;
  background:var(--panel-2); font-size:14px; color:var(--ink); line-height:1.45; word-break:break-word; white-space:pre-wrap; }
.ce-campo a { color:var(--signal); word-break:break-all; }
/* nome do aluno nas tabelas: avatar e nome lado a lado, sem quebrar; nome comprido termina em reticências */
.pn-quem { display:flex; align-items:center; gap:9px; min-width:0; }
.pn-auto { background:#FBF0E4; border:1px solid #F0DCC6; border-radius:12px; padding:10px 14px; font-size:13.5px; line-height:1.5; color:#7A4318; }
.pn-auto b { color:#5E3312; }
.pn-quem .pn-av { margin-right:0; }
.pn-quem .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:210px; }
.pn-fecha { position:absolute; top:20px; right:22px; }
/* tabelas que crescem com muitos alunos */
.pn-t th.n, .pn-t td.n { text-align:right; font-variant-numeric:tabular-nums; }
.pn-t td.n { color:var(--ink); font-weight:500; }
.pn-t .rk { font-family:var(--display); font-size:19px; color:var(--signal); width:34px; text-align:center; padding-right:8px; }
.pn-t .rk.cinza { color:var(--ink-3); }
.pn-t td small { display:block; font-size:12px; color:var(--ink-3); font-weight:400; }
/* logo da empresa (o mesmo do resto do site) e foto do aluno */
.pn-logo { display:inline-grid; place-items:center; flex-shrink:0; overflow:hidden; border-radius:9px; font-weight:600; vertical-align:middle; }
.pn-logo:has(img) { background:#fff !important; box-shadow:inset 0 0 0 1px var(--line-soft); }
.pn-logo img { display:block; }
.pn-av.foto { background:var(--bg-soft) !important; }
.pn-av.foto img { width:100%; height:100%; object-fit:cover; display:block; }
/* planos Black e Pro: selo, anel na foto e o quadro do plano na aba Perfil */
.selo { display:inline-flex; align-items:center; gap:6px; font-family:'Geist',system-ui,sans-serif; font-size:12.5px; font-weight:600; line-height:1; letter-spacing:0; border-radius:99px; padding:6px 11px 6px 9px; white-space:nowrap; vertical-align:middle; }
.selo svg { width:13px; height:13px; flex-shrink:0; }
.selo.black { background:linear-gradient(135deg,#15171C 0%,#2B2E36 100%); color:#F2E3BF; box-shadow:inset 0 0 0 1px #3B3E47; }
.selo.black svg { color:#D9B86C; }
.selo.pro { background:var(--signal); color:#fff; } .selo.pro svg { color:#BBD3F2; }
.selo.mini { font-size:11px; padding:4px 8px 4px 7px; gap:4px; } .selo.mini svg { width:11px; height:11px; }
.pl { display:inline-flex; align-items:center; gap:4px; font-weight:600; }
.pl svg { width:11px; height:11px; }
.pl.black { color:#1B1D23; } .pl.black svg { color:#B8923D; } .pl.pro { color:var(--signal); }
.pn-av { position:relative; }
.pn-av.black { box-shadow:0 0 0 2px var(--panel), 0 0 0 4px #C9A85C; }
.pn-av.pro { box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--signal); }
.pn-av .canto { position:absolute; right:-5px; bottom:-5px; width:17px; height:17px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--panel); }
.pn-av .canto svg { width:8px; height:8px; }
.pn-av .canto.black { background:#1B1D23; color:#D9B86C; } .pn-av .canto.pro { background:var(--signal); color:#fff; }

<body>

<main class="pn-main">
  <div class="pn-espera" id="espera">Abrindo…</div>

  <symbol id="i-pro" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1.2l2 4.3 4.7.5-3.5 3.2 1 4.6L8 11.5l-4.2 2.3 1-4.6L1.3 6l4.7-.5L8 1.2Z"/></symbol>
</svg>

<script src="layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>

<script>
try { montarLayout(""); } catch (e) { console.warn("layout.js não carregou", e); }

(function () {
"use strict";

// os mesmos do controle-conta.js; a chave é a publicável
const ENDERECO = "https://zrqucjktympnwilbvisw.supabase.co";
const CHAVE_PUBLICA = "sb_publishable_4X7Cyykz9ZDMWOTvauxibA_Tpa4KtAh";

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const plural = (n, um, v) => n + " " + (n === 1 ? um : v);
const ehData = s => /^\d{4}-\d{2}-\d{2}/.test(s || "");
const paraData = s => ehData(s) ? new Date(s.slice(0, 10) + "T12:00:00") : new Date(0);
const HOJE = (() => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; })();
const hojeIso = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const diasDesde = s => ehData(s) ? Math.round((HOJE - paraData(s)) / 86400000) : 999;
const curta = s => ehData(s) ? s.slice(8, 10) + "/" + s.slice(5, 7) : "–";
const br = s => ehData(s) ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "";
const ini = n => { const p = String(n || "?").trim().split(/\s+/); return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };
const CORES = ["#1A4893", "#1F7A6E", "#A85D24", "#5B4B9E", "#4E9AC8", "#8E2233"];

/* etapas, do jeito que o Meu Controle chama: teste de proficiência, prova específica do projeto
   e, por último, a entrevista, que poucas empresas fazem */
const ST = {
  "Currículo enviado":      { cls: "p-env",   grupo: "and",    etapa: 1 },
  "Teste":                  { cls: "p-teste", grupo: "and",    etapa: 2, rot: "Teste de proficiência" },
  "Prova específica":       { cls: "p-prova", grupo: "and",    etapa: 3 },
  "Entrevista":             { cls: "p-entr",  grupo: "and",    etapa: 4 },
  "Banco de talentos":      { cls: "p-banco", grupo: "and",    etapa: 1 },
  "Aprovado":               { cls: "p-aprov", grupo: "aprov",  etapa: 5 },
  "Recusado":               { cls: "p-rec",   grupo: "rec",    etapa: 1 },
  "Recusado no teste":      { cls: "p-rec",   grupo: "rec",    etapa: 2 },
  "Recusado na prova":      { cls: "p-rec",   grupo: "rec",    etapa: 3 },
  "Recusado na entrevista": { cls: "p-rec",   grupo: "rec",    etapa: 4 },
  "Sem resposta":           { cls: "p-sem",   grupo: "sem",    etapa: 1 },
  "Desistiu":               { cls: "p-des",   grupo: "des",    etapa: 1 },
};
const ONDE = { "Recusado": "antes do teste", "Recusado no teste": "no teste de proficiência", "Recusado na prova": "na prova específica", "Recusado na entrevista": "na entrevista" };
const ENTREVISTAM = ["micro1", "mercor"];
const TIPOS_CONTATO = ["Mensagem", "Chamada", "Revisão de currículo"];
const DICAS = { "Diretrizes": "o material de estudo das diretrizes antes dos testes", "Inglês": "as vagas que pedem menos inglês e o material de inglês", "Tempo do teste": "simulados com tempo marcado", "Comunicação na entrevista": "simulações de entrevista" };
/* Só para a equipe: candidatura parada em "Currículo enviado" há 14 dias ou mais conta como Sem resposta.
   O Meu Controle do aluno continua do jeito que ele deixou. */
const DIAS_SEM_RESPOSTA = 14;
const MEIO = ["teste", "prova", "entrevista"];
const NOME_PASSO = { aplicado: "Currículo enviado", teste: "Teste de proficiência", prova: "Prova específica", entrevista: "Entrevista", aprovado: "Aprovado" };

let cli = null;
let ALUNOS = [], GERADO = "", EU_NOME = "";
let VAGAS_HUB = null;   // vagas.json e vagas-especificas.json, para o pagamento da vaga

/* ── do banco para a tela ── */
function etapaDaRecusa(ap) {
  if (MEIO.includes(ap.recusaEtapa)) return ap.recusaEtapa;
  if (ap.recusaEtapa === "antes") return "";
  const p = ap.passos && typeof ap.passos === "object" ? ap.passos : {};
  return MEIO.slice().reverse().find(k => p[k]) || "";
}
function paraCand(ap) {
  const data = ehData(ap.data) ? ap.data.slice(0, 10) : String(ap.atualizado_em || "").slice(0, 10);
  const x = { ap, empresa: (ap.empresa || "").trim() || "(sem empresa)", vaga: (ap.titulo || "").trim() || "(sem título)", data,
    motivo: ap.recusaMotivo || "", motivoOutro: ap.recusaMotivoOutro || "", relato: ap.relato || "", obs: ap.observacoes || "",
    cv: ap.curriculoPdf && ap.curriculoPdf.caminho ? ap.curriculoPdf : null, apelido: ap.curriculo || "", email: ap.email || "",
    prox: ap.proximo || "", proxEm: ap.proximoEm || "", auto: false };
  const e = ap.estado || "aplicado";
  if (e === "recusado") {
    const k = etapaDaRecusa(ap);
    x.status = k === "teste" ? "Recusado no teste" : k === "prova" ? "Recusado na prova" : k === "entrevista" ? "Recusado na entrevista" : "Recusado";
  } else x.status = { teste: "Teste", prova: "Prova específica", entrevista: "Entrevista", aprovado: "Aprovado", banco: "Banco de talentos",
    semresposta: "Sem resposta", desisti: "Desistiu" }[e] || "Currículo enviado";
  if (x.status === "Currículo enviado" && diasDesde(data) >= DIAS_SEM_RESPOSTA && diasDesde(data) < 999) { x.status = "Sem resposta"; x.auto = true; }
  return x;
}
function montar(d) {
  GERADO = d.gerado_em || "";
  ESPERA = Array.isArray(d.espera) ? d.espera : [];
  ALUNOS = (d.alunos || []).map((p, i) => {
    const pf = p.perfil || {};
    const a = { id: p.id, nome: (p.nome || "").trim() || String(p.email || "").split("@")[0] || "Sem nome", email: p.email || "",
      cidade: pf.cidade || "", ingles: pf.ingles || "", foco: pf.foco || "", horas: pf.horas || "", telefone: pf.telefone || "", obs: pf.obs || "",
      plano: PLANOS[p.plano] ? p.plano : "", planoPor: p.plano_por || "", planoEm: String(p.plano_em || "").slice(0, 10),
      temFoto: !!p.tem_foto, foto: (ALUNOS.find(x => x.id === p.id) || {}).foto || "",
      contatos: (p.contatos || []).map(c => ({ data: String(c.criado_em || "").slice(0, 10), tipo: c.tipo, texto: c.texto, por: c.por })),
      cand: (p.candidaturas || []).map(paraCand),
      proj: (p.trabalhos || []).filter(t => t.estado === "ativo").map(t => ({ empresa: t.empresa, nome: t.projeto || t.empresa, desde: t.inicio, ultimo: t.ultimo_dia })) };
    a.cor = CORES[i % CORES.length]; a.ini = ini(a.nome);
    calcular(a);
    return a;
  });
}

function calcular(a) {
  const al = [];
  const grupo = x => ST[x.status].grupo;
  const recs = a.cand.filter(x => grupo(x) === "rec");
  const sem = a.cand.filter(x => x.status === "Sem resposta" && diasDesde(x.data) >= DIAS_SEM_RESPOSTA && diasDesde(x.data) < 999).length;
  const andando = a.cand.some(x => grupo(x) === "and");
  const ult = a.cand.length ? Math.min(...a.cand.map(x => diasDesde(x.data))) : 999;
  const nomeMot = x => x.motivo === "Outros" ? "outro motivo" : x.motivo.toLowerCase();
  const motivos = recs.filter(x => x.motivo && x.motivo !== "Não sei").map(nomeMot);
  if (recs.length >= 2) al.push({ texto: `${recs.length} recusas${motivos.length ? ", por " + [...new Set(motivos)].join(" e ") : ""}`, passo: "rever o material antes do próximo teste" });
  else if (recs.length === 1) { const r1 = recs[0]; al.push({ texto: `Recusado ${ONDE[r1.status]} da ${r1.empresa}${r1.motivo && r1.motivo !== "Não sei" ? ", por " + nomeMot(r1) : ""}`, passo: DICAS[r1.motivo] ? "olhar " + DICAS[r1.motivo] : "conversar sobre o que aconteceu" }); }
  if (sem >= 2) al.push({ texto: `${sem} candidaturas sem resposta há ${DIAS_SEM_RESPOSTA} dias ou mais`, passo: "revisar o currículo" });
  if (!andando && !a.proj.length) al.push({ texto: a.cand.length ? "Nada em andamento e nenhum trabalho" : "Ainda não registrou candidatura", passo: "mandar as vagas da semana" });
  else if (ult > 21 && ult < 999) al.push({ texto: `Nenhuma candidatura nova há ${Math.round(ult / 7)} semanas`, passo: "mandar as vagas da semana" });
  a.alertas = al.slice(0, 2);
  const dc = a.contatos.length ? Math.min(...a.contatos.map(t => diasDesde(t.data))) : null;
  a.dContato = dc;
  a.jaFalamos = dc !== null && dc <= 7;
  a.emProcesso = a.cand.some(x => ["Teste", "Prova específica", "Entrevista"].includes(x.status));
  a.cand.sort((x, y) => paraData(y.data) - paraData(x.data));
}

const FILTROS = () => ({ busca: "", etapa: "", motivo: "", vaga: "", ordem: "recente", mostrar: 20 });
const S = { aba: "geral", sel: null, filtro: "atencao", planoF: "todos", mudandoPlano: false, busca: "", ordem: "atencao", mostrar: 20, abaAl: "cand", editando: false, novoContato: false, selEmp: null, selVaga: null, top: 5,
  f: FILTROS(), trabMostrar: 6, empBusca: "", empOrdem: "cand", vagaBusca: "" };
const todas = () => ALUNOS.flatMap(a => a.cand.map(x => Object.assign({ aluno: a }, x)));
const contato = d => d === null ? "nenhum" : d <= 0 ? "hoje" : d === 1 ? "ontem" : `há ${d} dias`;
const situacao = a => a.jaFalamos ? `<span class="pill p-ja">Contato feito</span>` : `<span class="pill p-falta">Contato pendente</span>`;
const quem = a => `<span class="pn-quem">${av(a)}<span class="nm" title="${esc(a.nome)}">${esc(a.nome)}</span></span>`;
const pill = st => `<span class="pill ${ST[st].cls}">${esc(ST[st].rot || st)}</span>`;
const pdfVer = x => x.cv ? `<button class="pdf" data-pdf="${esc(x.cv.caminho)}" data-nome="${esc(x.cv.nome || "curriculo.pdf")}" title="${esc(x.cv.nome || "")}"><i>PDF</i>Ver</button>` : "";
const av = (a, t) => `<span class="pn-av${a.foto ? " foto" : ""}${a.plano ? " " + a.plano : ""}" style="background:${a.cor};${t ? `width:${t}px;height:${t}px;font-size:${Math.round(t / 2.7)}px` : ""}">${a.foto
  ? `<img src="${esc(a.foto)}" alt="" style="border-radius:50%">` : esc(a.ini)}${a.plano ? `<span class="canto ${a.plano}">${icone(a.plano)}</span>` : ""}</span>`;

/* ── planos: só a equipe coloca, e só pela aba Perfil do aluno ── */
const PLANOS = { black: "Plano Black", pro: "Plano Pro" };
const icone = p => `<svg aria-hidden="true"><use href="#i-${p}"/></svg>`;
const selo = (p, mini) => PLANOS[p] ? `<span class="selo ${p}${mini ? " mini" : ""}">${icone(p)}${PLANOS[p]}</span>` : "";
const plCurto = p => PLANOS[p] ? `<span class="pl ${p}">${icone(p)}${p === "black" ? "Black" : "Pro"}</span>` : "";
const nomePlano = p => PLANOS[p] || "Sem plano";
let ESPERA = [];   // e-mails cadastrados com plano, à espera de a pessoa criar a conta

/* a empresa que o aluno escreveu, achada no empresas.json do site: "Appen" é a CrowdGen, "Telus" é a TELUS Digital */
let EMPRESAS_HUB = [];
const compacto = s => norm(s).replace(/[^a-z0-9]/g, "");
function empresaHub(nome) {
  const s = compacto(nome);
  if (s.length < 3) return null;
  return EMPRESAS_HUB.find(e => s === e.id || s.includes(e.id) || compacto(e.nome).includes(s) || s.includes(compacto(e.nome.split(" ")[0]))) || null;
}
function marca(nome, t) {
  const e = empresaHub(nome);
  const tam = `width:${t}px;height:${t}px;font-size:${Math.round(t / 2.6)}px;border-radius:${Math.round(t / 3.6)}px`;
  if (e && typeof logoHtml === "function") return `<span class="pn-logo" style="${tam};background:${esc(e.bg || "#1A4893")};color:${esc(e.cor || "#fff")}">${logoHtml(e, t)}</span>`;
  return `<span class="pn-logo" style="${tam};background:#1A4893;color:#fff">${esc((String(nome || "?").trim()[0] || "?").toUpperCase())}</span>`;
}
/* telefone com DDD vira link do WhatsApp; sem o código do país, entende que é do Brasil */
function zap(tel) {
  let d = String(tel || "").replace(/\D/g, "");
  if (d.length < 10) return "";
  if (d.length <= 11) d = "55" + d;
  return `https://wa.me/${d}`;
}

function empresas() {
  const m = {}, chave = n => norm(n);
  const pega = n => m[chave(n)] = m[chave(n)] || { nome: n, cands: [], trab: [] };
  todas().forEach(x => pega(x.empresa).cands.push(x));
  ALUNOS.forEach(a => a.proj.forEach(p => pega(p.empresa).trab.push(Object.assign({ aluno: a }, p))));
  return Object.values(m).map(e => Object.assign(e, {
    rec: e.cands.filter(x => ST[x.status].grupo === "rec").length,
  })).sort((a, b) => b.cands.length - a.cands.length || b.trab.length - a.trab.length);
}
function vagas() {
  const m = {};
  todas().forEach(x => { const id = norm(x.empresa) + "|" + norm(x.vaga); (m[id] = m[id] || { id, empresa: x.empresa, titulo: x.vaga, cands: [] }).cands.push(x); });
  return Object.values(m).sort((a, b) => b.cands.length - a.cands.length);
}
function motivos(lista) {
  const m = {};
  lista.filter(x => ST[x.status].grupo === "rec").forEach(x => { const k2 = x.motivo && x.motivo !== "Não sei" ? x.motivo : "Não sabe"; m[k2] = (m[k2] || 0) + 1; });
  return Object.entries(m).map(([rot, n]) => ({ rot, n })).sort((a, b) => b.n - a.n);
}
/* os quatro números do topo; nas abas Empresas e Vagas eles também filtram a tabela */
function tiles(lista, filtra) {
  const n = g => lista.filter(x => ST[x.status].grupo === g).length;
  const tl = (chave, rot, v, cor) => filtra
    ? `<button class="pn-tl" data-tile="${chave}" aria-pressed="${S.f.etapa === chave}"><div class="r">${rot}</div><div class="v"${cor ? ` style="color:${cor}"` : ""}>${v}</div></button>`
    : `<div class="pn-tl"><div class="r">${rot}</div><div class="v"${cor ? ` style="color:${cor}"` : ""}>${v}</div></div>`;
  return `<div class="pn-tiles">${tl("and", "Em andamento", n("and"))}${tl("Aprovado", "Aprovados", lista.filter(x => x.status === "Aprovado").length, "#1F7A6E")}
    ${tl("rec", "Recusados", n("rec"), "#8E2233")}${tl("Sem resposta", "Sem resposta", n("sem"))}</div>
    ${filtra ? `<p class="pn-sub" style="margin-top:-6px">Clique num número para ver só aquelas candidaturas na tabela.</p>` : ""}`;
}
const taxa = x => { const a = x.cands.filter(c2 => c2.status === "Aprovado").length, r2 = x.cands.filter(c2 => ST[c2.status].grupo === "rec").length; return a + r2 ? Math.round(100 * a / (a + r2)) + "%" : "–"; };
/* barrinha com a proporção de cada situação, para comparar empresas e vagas de olho */
const GRUPOS = [["and", "Em andamento", "#4E9AC8"], ["aprov", "Aprovadas", "#1F7A6E"], ["rec", "Recusadas", "#A85D24"], ["sem", "Sem resposta", "#C9B9A6"], ["des", "Desistiu", "#8E77A6"]];
const mix = L => `<span class="pn-mix" title="${GRUPOS.map(([g, n]) => `${n}: ${L.filter(x => ST[x.status].grupo === g).length}`).join(" · ")}">${GRUPOS.map(([g, , cor]) => { const n = L.filter(x => ST[x.status].grupo === g).length; return n ? `<i style="width:${100 * n / L.length}%;background:${cor}"></i>` : ""; }).join("")}</span>`;
const legenda = () => `<div class="pn-leg">${GRUPOS.map(([, n, cor]) => `<span style="--c:${cor}">${n}</span>`).join("")}</div>`;
const ORDEM_ST = ["Entrevista", "Prova específica", "Teste", "Currículo enviado", "Banco de talentos", "Aprovado", "Recusado na entrevista", "Recusado na prova", "Recusado no teste", "Recusado", "Sem resposta", "Desistiu"];
const motivoDe = x => (x.motivo && x.motivo !== "Não sei") ? x.motivo : "Não sabe";
// na etiqueta, "Outros" mostra o que o aluno escreveu
const motivoTxt = x => x.motivo === "Outros" && x.motivoOutro ? "Outros: " + x.motivoOutro : motivoDe(x);
// a etapa com os dias sem resposta, contados desde o envio do currículo
const pillCand = x => x.status !== "Sem resposta" ? pill(x.status)
  : `<span class="pill p-sem"${x.auto ? ' title="O aluno mandou o currículo e não mexeu mais"' : ""}>Sem resposta${(d => d >= 1 && d < 999 ? ` · ${d} ${d === 1 ? "dia" : "dias"}` : "")(diasDesde(x.data))}</span>`;

/* filtros das tabelas de candidaturas: etapa, motivo, vaga, busca e ordem */
function filtrar(lista) {
  const f = S.f, q = norm(f.busca.trim());
  const L = lista.filter(x => (!q || norm(x.aluno.nome + " " + x.vaga).includes(q))
    && (!f.etapa || (f.etapa === "rec" ? ST[x.status].grupo === "rec" : f.etapa === "and" ? ST[x.status].grupo === "and" : x.status === f.etapa))
    && (!f.motivo || (ST[x.status].grupo === "rec" && motivoDe(x) === f.motivo))
    && (!f.vaga || x.vaga === f.vaga));
  const ordens = {
    recente: (a, b) => paraData(b.data) - paraData(a.data),
    antiga: (a, b) => paraData(a.data) - paraData(b.data),
    aluno: (a, b) => a.aluno.nome.localeCompare(b.aluno.nome, "pt-BR"),
    etapa: (a, b) => (ORDEM_ST.indexOf(a.status) - ORDEM_ST.indexOf(b.status)) || (paraData(b.data) - paraData(a.data)),
  };
  return L.sort(ordens[f.ordem]);
}
function barraFiltros(lista, comVaga) {
  const f = S.f, sel = (v, atual) => v === atual ? " selected" : "";
  const motivosLista = [...new Set(lista.filter(x => ST[x.status].grupo === "rec").map(motivoDe))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const vagasLista = [...new Set(lista.map(x => x.vaga))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  return `<div class="pn-filtros">
    <label>Buscar<input class="pn-in pn-f-busca" data-f="busca" placeholder="${comVaga ? "Aluno ou vaga" : "Nome do aluno"}" value="${esc(f.busca)}"></label>
    <label>Etapa<select data-f="etapa"><option value="">Todas</option><option value="and"${sel("and", f.etapa)}>Em andamento</option>
      ${Object.keys(ST).map(s => `<option value="${s}"${sel(s, f.etapa)}>${ST[s].rot || s}</option>`).join("")}<option value="rec"${sel("rec", f.etapa)}>Recusados</option></select></label>
    <label>Motivo da recusa<select data-f="motivo"><option value="">Todos</option>${motivosLista.map(m => `<option value="${esc(m)}"${sel(m, f.motivo)}>${esc(m)}</option>`).join("")}</select></label>
    ${comVaga ? `<label>Vaga<select data-f="vaga"><option value="">Todas</option>${vagasLista.map(v => `<option value="${esc(v)}"${sel(v, f.vaga)}>${esc(v)}</option>`).join("")}</select></label>` : ""}
    <label>Ordenar<select data-f="ordem">${[["recente", "Mais recente"], ["antiga", "Mais antiga"], ["aluno", "Aluno, de A a Z"], ["etapa", "Por etapa"]].map(([v, n]) => `<option value="${v}"${sel(v, f.ordem)}>${n}</option>`).join("")}</select></label>
  </div>`;
}
function tabelaCands(lista, colunas) {
  const L = filtrar(lista), vis = L.slice(0, S.f.mostrar);
  const idx = x => `${x.aluno.id}|${x.aluno.cand.findIndex(q2 => q2.ap === x.ap)}`;
  const cel = {
    aluno: x => `<td class="forte">${quem(x.aluno)}</td>`, vaga: x => `<td class="vg">${esc(x.vaga)}</td>`, etapa: x => `<td>${pillCand(x)}</td>`,
    motivo: x => `<td>${ST[x.status].grupo === "rec" ? `<span class="tag" title="${esc(motivoTxt(x))}">${esc(motivoTxt(x))}</span>` : ""}</td>`, cv: x => `<td>${pdfVer(x)}</td>`, data: x => `<td>${curta(x.data)}</td>`,
  };
  const nome = { aluno: "Aluno", vaga: "Vaga", etapa: "Etapa", motivo: "Motivo", cv: "Currículo", data: "Data" };
  const filtrado = S.f.busca || S.f.etapa || S.f.motivo || S.f.vaga;
  return `<p class="pn-sub pn-conta">${filtrado ? `${L.length} de ${plural(lista.length, "candidatura", "candidaturas")}` : plural(lista.length, "candidatura", "candidaturas")}${L.length > vis.length ? ` · mostrando ${vis.length}` : ""}
    ${filtrado ? `<button class="pn-lnk" data-limpar>Limpar filtros</button>` : ""}</p>
    ${L.length ? `<div class="pn-rolagem"><table class="pn-t"><tr>${colunas.map(c2 => `<th>${nome[c2]}</th>`).join("")}</tr>
      ${vis.map(x => `<tr class="clica" data-cand="${idx(x)}">${colunas.map(c2 => cel[c2](x)).join("")}</tr>`).join("")}</table></div>` : `<p class="pn-vazio">Nenhuma candidatura com esses filtros.</p>`}
    ${L.length > vis.length ? `<button class="pn-bt" data-mais-f style="width:100%;justify-content:center;margin-top:10px">Mostrar mais ${Math.min(20, L.length - vis.length)}</button>` : ""}`;
}
function tabelaTrab(trab) {
  const L = trab.slice().sort((a, b) => paraData(b.desde) - paraData(a.desde)), vis = L.slice(0, S.trabMostrar);
  if (!L.length) return `<p class="pn-vazio">Nenhum aluno trabalhando aqui.</p>`;
  return `<div class="pn-rolagem"><table class="pn-t"><tr><th>Aluno</th><th>Projeto</th><th>Desde</th><th>Último dia lançado</th></tr>
    ${vis.map(t => `<tr class="clica" data-aluno="${t.aluno.id}"><td class="forte">${quem(t.aluno)}</td><td>${esc(t.nome)}</td><td>${curta(t.desde)}</td><td>${t.ultimo ? curta(t.ultimo) : "nenhum"}</td></tr>`).join("")}</table></div>
    ${L.length > vis.length ? `<button class="pn-bt" data-trab-mais style="width:100%;justify-content:center;margin-top:10px">Ver todos os ${L.length}</button>` : ""}`;
}

/* ── abas ── */
const ABAS = [["geral", "Visão geral"], ["alunos", "Alunos"], ["empresas", "Empresas"], ["vagas", "Vagas"], ["equipe", "Equipe"]];
function abas() {
  const falta = ALUNOS.filter(a => a.alertas.length && !a.jaFalamos).length;
  document.getElementById("abas").innerHTML = ABAS.map(([k2, n]) =>
    `<button type="button" role="tab" data-aba="${k2}" aria-selected="${S.aba === k2}">${n}${k2 === "alunos" && falta ? `<span class="pn-cnt">${falta}</span>` : ""}</button>`).join("");
  document.querySelectorAll("#abas [data-aba]").forEach(b => b.onclick = () => irAba(b.dataset.aba));
}
function irAba(nome) {
  S.aba = ABAS.some(x => x[0] === nome) ? nome : "geral";
  S.f = FILTROS(); S.trabMostrar = 6;
  try { history.replaceState(null, "", "#" + S.aba); } catch (e) {}
  render();
}

function geral() {
  const T = todas(), comAlerta = ALUNOS.filter(a => a.alertas.length);
  const falta = comAlerta.filter(a => !a.jaFalamos);
  const fila = comAlerta.slice().sort((x, y) => (x.jaFalamos - y.jaFalamos) || ((y.dContato ?? 999) - (x.dContato ?? 999)));
  const aprov = T.filter(x => x.status === "Aprovado").length, rec = T.filter(x => ST[x.status].grupo === "rec").length;
  // entrevista só conta para quem teve: fora da micro1 e da Mercor, quem é aprovado quase nunca passa por ela
  const chegou = (x, e) => { const s = ST[x.status];
    if (s.grupo === "sem" || s.grupo === "des" || s.etapa < e) return false;
    return e !== 4 || s.grupo !== "aprov" || ENTREVISTAM.includes(norm(x.empresa)); };
  const alc = e => T.filter(x => chegou(x, e)).length;
  const pct = n => Math.round(100 * n / Math.max(1, T.length));
  const funil = [["Enviadas", T.length, "#66717F"], ["Chegaram ao teste de proficiência", alc(2), "#4E9AC8"], ["Chegaram à prova específica", alc(3), "#3D4A9C"], ["Chegaram à entrevista", alc(4), "#5B4B9E"], ["Aprovadas", aprov, "#1F7A6E"]];
  const mot = motivos(T), maxM = Math.max(1, ...mot.map(m => m.n));
  const E = empresas(), V = vagas().slice(0, 5);
  return `
    <div class="pn-nums">
      <div class="pn-num"><div class="r">Alunos</div><div class="v">${ALUNOS.length}</div><div class="d">${ALUNOS.filter(a => a.plano === "black").length} no Black, ${ALUNOS.filter(a => a.plano === "pro").length} no Pro · ${ALUNOS.filter(a => a.proj.length).length} trabalhando agora</div></div>
      <div class="pn-num"><div class="r">Precisam de contato</div><div class="v" style="color:#A85D24">${falta.length}</div><div class="d">têm alerta e ninguém da equipe falou com eles nos últimos 7 dias</div></div>
      <div class="pn-num"><div class="r">Empresas</div><div class="v">${E.length}</div><div class="d">com candidaturas ou trabalhos de alunos</div></div>
      <div class="pn-num"><div class="r">Candidaturas</div><div class="v">${T.length}</div><div class="d">${plural(ALUNOS.filter(a => a.emProcesso).length, "aluno", "alunos")} em teste, prova ou entrevista</div></div>
      <div class="pn-num"><div class="r">Aprovação</div><div class="v" style="color:#1F7A6E">${aprov + rec ? Math.round(100 * aprov / (aprov + rec)) : 0}%</div><div class="d">${aprov} aprovadas, ${rec} recusadas</div></div>
    </div>
    <div class="pn-cx" style="margin-top:14px">
      <div class="pn-cab"><div><h2>Fila de atenção <span class="pn-sub">(${fila.length})</span></h2><p class="sub">alunos com algum alerta: recusas, candidaturas sem resposta, nada andando ou três semanas parado. Quem ainda não recebeu contato aparece primeiro.</p></div>
        <button class="pn-lnk" data-ir-alunos>Ver todos na aba Alunos →</button></div>
      ${fila.length ? `<div class="pn-rolagem"><table class="pn-t"><tr><th>Aluno</th><th>Plano</th><th>O que aconteceu</th><th>Próximo passo</th><th>Último contato</th><th>Situação</th></tr>
      ${fila.slice(0, 6).map(a => `<tr class="clica" data-aluno="${a.id}"><td class="forte">${quem(a)}</td><td>${plCurto(a.plano) || '<span class="pn-sub">Sem plano</span>'}</td><td>${esc(a.alertas[0].texto)}</td>
        <td>${esc(a.alertas[0].passo.replace(/^./, x => x.toUpperCase()))}</td><td>${contato(a.dContato)}</td><td>${situacao(a)}</td></tr>`).join("")}</table></div>`
        : `<p class="pn-vazio">Nenhum aluno com alerta agora.</p>`}
    </div>
    <div class="pn-g2">
      <div class="pn-cx"><div class="pn-cab"><div><h2>Como os alunos vão em cada empresa</h2><p class="sub">as ${Math.min(6, E.length)} com mais candidaturas, de ${E.length}</p></div><button class="pn-lnk" data-ir="empresas">Ver todas →</button></div>
        ${E.length ? `<div class="pn-rolagem"><table class="pn-t"><tr><th>Empresa</th><th class="n">Candid.</th><th>Situação</th><th class="n">Aprovação</th><th class="n">Trabalhando</th></tr>
        ${E.slice(0, 6).map(e => `<tr class="clica" data-emp="${esc(e.nome)}"><td class="forte"><span class="pn-quem">${marca(e.nome, 30)}<span>${esc(e.nome)}</span></span></td>
          <td class="n">${e.cands.length}</td><td>${e.cands.length ? mix(e.cands) : ""}</td><td class="n">${taxa(e)}</td><td class="n">${e.trab.length}</td></tr>`).join("")}</table></div>
        ${legenda()}` : `<p class="pn-vazio">Ainda sem candidaturas.</p>`}</div>
      <div class="pn-cx"><div class="pn-cab"><div><h2>Vagas mais procuradas</h2><p class="sub">quantos alunos se candidataram a cada vaga</p></div><button class="pn-lnk" data-ir="vagas">Ver o ranking →</button></div>
        ${V.length ? `<div class="pn-rolagem"><table class="pn-t"><tr><th></th><th>Vaga</th><th class="n">Alunos</th><th>Situação</th><th class="n">Aprovação</th></tr>
        ${V.map((v, i) => `<tr class="clica" data-vaga="${esc(v.id)}"><td class="rk${i > 2 ? " cinza" : ""}">${i + 1}</td><td class="forte">${esc(v.titulo)}<small>${esc(v.empresa)}</small></td>
          <td class="n">${v.cands.length}</td><td>${mix(v.cands)}</td><td class="n">${taxa(v)}</td></tr>`).join("")}</table></div>
        ${legenda()}` : `<p class="pn-vazio">Ainda sem candidaturas.</p>`}</div>
    </div>
    <div class="pn-g2">
      <div class="pn-cx"><h2>Até onde as candidaturas chegam</h2><p class="sub" style="margin-bottom:14px">das ${T.length} candidaturas registradas</p>
        <div class="pn-barras">${funil.map(([r, n, cor]) => `<div class="pn-barra"><span>${r}</span><span class="tr"><i style="width:${pct(n)}%;background:${cor}"></i></span><span class="q">${n} · ${pct(n)}%</span></div>`).join("")}</div></div>
      <div class="pn-cx"><h2>Por que os alunos são recusados</h2><p class="sub" style="margin-bottom:14px">motivo que o próprio aluno marcou no Meu Controle</p>
        ${mot.length ? `<div class="pn-barras">${mot.map(m => `<div class="pn-barra"><span>${esc(m.rot)}</span><span class="tr"><i style="width:${Math.round(100 * m.n / maxM)}%;background:${m.rot === "Não sabe" ? "#C9B9A6" : "#A85D24"}"></i></span><span class="q">${m.n}</span></div>`).join("")}</div>
        <p class="pn-insight">O motivo mais comum é <b>${esc(mot[0].rot.toLowerCase())}</b>.${DICAS[mot[0].rot] ? ` Vale reforçar ${esc(DICAS[mot[0].rot])}.` : ""}</p>` : `<p class="pn-vazio">Nenhuma recusa registrada.</p>`}</div>
    </div>
    <details class="pn-mais" id="maisNumeros"><summary>Mais números do site</summary><div id="numerosSite"><p class="pn-sub">Buscando…</p></div></details>`;
}

/* ── números do site somados (banco/painel.sql): contas, origem, mês, uso ── */
let TOT = null;
function barras(linhas, cor) {
  if (!linhas.length) return `<p class="pn-vazio">Ainda sem dados.</p>`;
  const maior = Math.max(1, ...linhas.map(l => l[1]));
  return `<div class="pn-barras">${linhas.map(l => `<div class="pn-barra"><span>${esc(l[0])}</span><span class="tr"><i style="width:${Math.max(2, Math.round(100 * l[1] / maior))}%;background:${cor || "#1A4893"}"></i></span><span class="q">${l[1]}</span></div>`).join("")}</div>`;
}
async function numerosSite() {
  if (!TOT) {
    const r = await cli.rpc("painel_totais");
    const alvo = document.getElementById("numerosSite");
    if (r.error) { if (alvo) alvo.innerHTML = `<p class="pn-vazio">Não deu para buscar os números agora.</p>`; return; }
    TOT = r.data || {};
  }
  const t = TOT, c = t.contas || {}, u = t.uso || {}, tr = t.trabalhos || {};
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const el = document.getElementById("numerosSite"); if (!el) return;
  el.innerHTML = `
    <div class="pn-nums" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
      <div class="pn-num"><div class="r">Contas</div><div class="v">${c.total || 0}</div><div class="d">${c.novas_7d || 0} nos últimos 7 dias · ${c.novas_30d || 0} em 30 dias</div></div>
      <div class="pn-num"><div class="r">Entraram em 30 dias</div><div class="v">${c.ativas_30d || 0}</div><div class="d">${c.ativas_7d || 0} nos últimos 7 dias · ${c.confirmadas || 0} com e-mail confirmado</div></div>
      <div class="pn-num"><div class="r">Trabalhos</div><div class="v">${tr.total || 0}</div><div class="d">${tr.ativos || 0} em andamento</div></div>
    </div>
    <div class="pn-g2">
      <div class="pn-cx"><h2>Onde os alunos viram a vaga</h2><p class="sub" style="margin-bottom:14px">o campo "Onde você viu" da candidatura</p>${barras((t.por_origem || []).map(o => [o.origem, o.n]))}</div>
      <div class="pn-cx"><h2>Candidaturas por mês</h2><p class="sub" style="margin-bottom:14px">pela data de envio que o aluno informou</p>${barras((t.por_mes || []).map(m => { const p = String(m.mes).split("-"); return [(MESES[+p[1] - 1] || p[1]) + " de " + p[0], m.n]; }))}</div>
      <div class="pn-cx"><h2>Contas novas por semana</h2><p class="sub" style="margin-bottom:14px">últimas 12 semanas</p>${barras((t.contas_por_semana || []).map(s => { const p = String(s.semana).split("-"); return ["semana de " + p[2] + "/" + p[1], s.n]; }))}</div>
      <div class="pn-cx"><h2>Uso do Meu Controle</h2><p class="sub" style="margin-bottom:14px">quantas contas usam cada parte da ferramenta</p>${barras([["Registram candidaturas", u.com_candidaturas || 0], ["Têm trabalho cadastrado", u.com_trabalhos || 0], ["Lançam horas ou tarefas", u.com_registros || 0]])}</div>
    </div>`;
}

function listaAlunos() {
  const q = norm(S.busca.trim());
  let L = ALUNOS.filter(a => !q || norm(a.nome + " " + a.email).includes(q))
    .filter(a => S.filtro === "todos" || (S.filtro === "atencao" && a.alertas.length) || (S.filtro === "processo" && a.emProcesso) || (S.filtro === "trabalhando" && a.proj.length))
    .filter(a => S.planoF === "todos" || (S.planoF === "sem" ? !a.plano : a.plano === S.planoF));
  if (S.ordem === "nome") L.sort((x, y) => x.nome.localeCompare(y.nome, "pt-BR"));
  else if (S.ordem === "recente") L.sort((x, y) => (x.cand[0] ? diasDesde(x.cand[0].data) : 999) - (y.cand[0] ? diasDesde(y.cand[0].data) : 999));
  else L.sort((x, y) => ((y.alertas.length && !y.jaFalamos) - (x.alertas.length && !x.jaFalamos)) || (y.alertas.length - x.alertas.length) || x.nome.localeCompare(y.nome, "pt-BR"));
  return L;
}

function alunos() {
  if (!ALUNOS.length) return `<p class="pn-vazio">Nenhum aluno com conta ainda.</p>`;
  const L = listaAlunos(), vis = L.slice(0, S.mostrar);
  const a = ALUNOS.find(x => x.id === S.sel) || L[0] || ALUNOS[0];
  S.sel = a.id;
  return `<div class="pn-duas">
    <div class="pn-lista">
      <input class="pn-busca" id="busca" placeholder="Buscar por nome ou e-mail" value="${esc(S.busca)}" autocomplete="off">
      <div class="pn-grupo"><span>Situação</span><div class="pn-chips">${[["todos", "Todos"], ["atencao", "Precisa de atenção"], ["processo", "Em processo"], ["trabalhando", "Trabalhando"]].map(([k2, n]) =>
        `<button class="pn-chip" data-filtro="${k2}" aria-pressed="${S.filtro === k2}">${n}</button>`).join("")}</div></div>
      <div class="pn-grupo"><span>Plano</span><div class="pn-chips">${[["todos", "Todos"], ["black", "Black"], ["pro", "Pro"], ["sem", "Sem plano"]].map(([k2, n]) =>
        `<button class="pn-chip" data-filtro-plano="${k2}" aria-pressed="${S.planoF === k2}">${n}</button>`).join("")}</div></div>

}

function fichaAluno(a) {

      <button class="pn-bt ambar" data-novo-contato>Registrar contato</button></div>

/* O plano fica salvo e só muda em dois passos (Mudar plano, escolher, Salvar plano):
   um clique sem querer não troca o plano de ninguém. */
function quadroPlano(a) {
  if (S.mudandoPlano) return `<form class="pn-cx" id="formPlano" style="border-color:var(--signal)">
    <h2 style="margin-bottom:4px">Mudar o plano de ${esc(a.nome.split(" ")[0])}</h2>
    <p class="pn-sub" style="margin-bottom:12px">Agora: ${esc(nomePlano(a.plano))}. O aluno vê o selo novo na próxima vez que abrir o site.</p>
    <div class="pn-opc">${["black", "pro", ""].map(p => `<label><input type="radio" name="plano" value="${p}"${a.plano === p ? " checked" : ""}>${p ? selo(p, true) : "Sem plano"}</label>`).join("")}</div>
    <div class="pn-acoes"><button type="button" class="pn-bt" data-cancelar-plano>Cancelar</button><button class="pn-bt forte" disabled>Salvar plano</button></div></form>`;
  return `<div class="pn-cx"><div class="pn-plano">${a.plano ? selo(a.plano) : `<span class="pn-sub" style="font-size:14px">Sem plano</span>`}
    <span class="txt">${a.plano ? `Colocado por <b>${esc(a.planoPor || "equipe")}</b>${ehData(a.planoEm) ? " em " + br(a.planoEm) : ""}.` : "Este aluno ainda não está no plano Black nem no Pro."}</span>
    <button class="pn-bt" data-mudar-plano>${a.plano ? "Mudar plano" : "Colocar plano"}</button></div></div>`;
}
function contaLista(n) {
  const pl = S.planoF === "black" ? " do plano Black" : S.planoF === "pro" ? " do plano Pro" : S.planoF === "sem" ? " sem plano" : "";
  if (S.filtro === "atencao") return `${n} ${n === 1 ? "aluno" : "alunos"}${pl} ${n === 1 ? "precisa" : "precisam"} de atenção`;
  return `${n} de ${ALUNOS.length} ${ALUNOS.length === 1 ? "aluno" : "alunos"}${pl ? " ·" + pl : ""}`;
}

/* e-mails à espera: a pessoa ainda não tem conta; quando criar com este e-mail, já entra no plano */
function abrirEspera(msg) {
  if (fecharGaveta) document.removeEventListener("keydown", fecharGaveta);
  const g = document.getElementById("gaveta");
  g.innerHTML = `<div class="pn-veu" data-fechar></div><aside class="pn-gaveta" role="dialog" aria-modal="true" aria-label="E-mails à espera da conta">
    <button class="pn-bt pn-fecha" data-fechar>Fechar ✕</button>
    <div class="rot">Planos</div><h2>E-mails à espera da conta</h2>
    <p class="pn-sub">Para quem já é aluno Black ou Pro mas ainda não criou conta no site. Quando a pessoa criar a conta com este mesmo e-mail, ela já entra com o selo, sem ninguém precisar lembrar de marcar depois.</p>
    <form class="pn-form-espera" id="formEspera" novalidate><input class="pn-in" name="email" type="email" maxlength="200" placeholder="E-mail da pessoa" autocomplete="off">
      <select class="pn-in" name="plano"><option value="black">Plano Black</option><option value="pro">Plano Pro</option></select>
      <button class="pn-bt forte">Cadastrar</button></form>
    ${msg ? `<div class="pn-auto">${esc(msg)}</div>` : ""}
    ${ESPERA.length ? `<div class="pn-rolagem"><table class="pn-t"><tr><th>E-mail</th><th>Plano</th><th>Cadastrado</th><th></th></tr>
      ${ESPERA.map(x => `<tr><td class="forte" style="word-break:break-all">${esc(x.email)}</td><td>${selo(x.plano, true)}</td><td>${br(String(x.criado_em || "").slice(0, 10))}<small>por ${esc(x.por || "equipe")}</small></td>
        <td style="text-align:right"><button class="pn-lnk" data-tirar-espera="${esc(x.email)}">tirar</button></td></tr>`).join("")}</table></div>`
      : `<p class="pn-vazio">Nenhum e-mail à espera.</p>`}
  </aside>`;
  const fechar = () => { g.innerHTML = ""; document.removeEventListener("keydown", fecharGaveta); fecharGaveta = null; };
  fecharGaveta = ev => { if (ev.key === "Escape") fechar(); };
  document.addEventListener("keydown", fecharGaveta);
  g.querySelectorAll("[data-fechar]").forEach(b => b.onclick = fechar);
  const f = g.querySelector("#formEspera");
  f.onsubmit = async ev => {
    ev.preventDefault();
    const email = f.elements.email.value.trim().toLowerCase(), plano = f.elements.plano.value;
    if (!/^\S+@\S+\.\S+$/.test(email)) { f.elements.email.focus(); avisar("Escreva o e-mail da pessoa.", true); return; }
    const bt = f.querySelector(".forte"); bt.disabled = true;
    const r = await cli.rpc("admin_espera_cadastrar", { p_email: email, p_plano: plano });
    if (r.error) { console.warn(r.error); bt.disabled = false; avisar("Não deu para cadastrar agora. Confira a internet e tente de novo.", true); return; }
    await carregar();
    render();
    abrirEspera(r.data && r.data.ja_tem_conta
      ? `Essa pessoa já tem conta: ${r.data.nome || email} recebeu o ${nomePlano(plano)} direto e já aparece na lista de alunos.`
      : `${email} ficou à espera. O ${nomePlano(plano)} entra quando a pessoa criar a conta.`);
  };
  g.querySelectorAll("[data-tirar-espera]").forEach(b => b.onclick = async () => {
    if (!confirm(`Tirar ${b.dataset.tirarEspera} da espera? Se a pessoa criar a conta depois, ela entra sem plano.`)) return;
    const r = await cli.rpc("admin_espera_tirar", { p_email: b.dataset.tirarEspera });
    if (r.error) { console.warn(r.error); avisar("Não deu para tirar agora.", true); return; }
    ESPERA = ESPERA.filter(x => x.email !== b.dataset.tirarEspera); render(); abrirEspera();
  });
}

function empresasTela() {
  const E = empresas();
  if (!E.length) return `<p class="pn-vazio">Ainda não há candidaturas nem trabalhos registrados.</p>`;

  const mot = motivos(e.cands).filter(m => m.rot !== "Não sabe");
  const q = norm(S.empBusca.trim()), num = x => parseInt(taxa(x)) || -1;
  const ordens = { cand: (a, b) => b.cands.length - a.cands.length, trab: (a, b) => b.trab.length - a.trab.length || b.cands.length - a.cands.length,
