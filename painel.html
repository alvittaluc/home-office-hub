<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da equipe — Home Office Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
/* ══════════════════════════════════════════════════════════════
   PAINEL DE TOTAIS — página da administração.
   Mostra só contagens. Quem decide quem pode ver é o banco
   (banco/painel.sql); esta página só desenha o que ele entrega.
   ══════════════════════════════════════════════════════════════ */
.p-main { max-width:var(--wrap,1180px); margin:0 auto; padding:44px 20px 90px; min-height:60vh; }
.p-topo { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:26px; }
.p-topo h1 { font-family:var(--display,'Hedvig Letters Serif',Georgia,serif); font-weight:400;
  font-size:clamp(28px,3.6vw,40px); line-height:1.1; letter-spacing:-0.015em; color:var(--ink,#10203A); margin:0 0 6px; }
.p-topo p { font-size:14.5px; color:var(--ink-2,#54606F); margin:0; max-width:620px; line-height:1.55; }
.p-atualizar { font:inherit; font-size:13.5px; font-weight:600; color:var(--ink,#10203A); background:var(--panel,#fff);
  border:1px solid var(--line,#DED7CA); border-radius:999px; padding:9px 16px; cursor:pointer; white-space:nowrap; }
.p-atualizar:hover { border-color:var(--ink-3,#66717F); }
.p-quando { font-size:12.5px; color:var(--ink-3,#66717F); margin-top:6px; text-align:right; }

.p-espera { text-align:center; padding:80px 20px; color:var(--ink-3,#66717F); font-size:14px; }

.p-nums { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
.p-num { background:var(--panel,#fff); border:1px solid var(--line-soft,#EAE4D9); border-radius:18px; padding:18px 20px 16px; }
.p-num .rot { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3,#66717F); }
.p-num .val { font-family:var(--display,'Hedvig Letters Serif',Georgia,serif); font-size:38px; line-height:1.1; color:var(--ink,#10203A); margin:6px 0 4px; }
.p-num .det { font-size:13px; color:var(--ink-2,#54606F); line-height:1.45; }

.p-grade { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
.p-cx { background:var(--panel,#fff); border:1px solid var(--line-soft,#EAE4D9); border-radius:18px; padding:20px 22px 18px; min-width:0; }
.p-cx.larga { grid-column:1 / -1; }
.p-cx h2 { font-size:16px; font-weight:600; letter-spacing:-0.01em; color:var(--ink,#10203A); margin:0 0 3px; }
.p-cx .sub { font-size:13px; color:var(--ink-3,#66717F); margin:0 0 14px; line-height:1.5; }
.p-vazio { font-size:13.5px; color:var(--ink-3,#66717F); padding:6px 0 4px; }

.p-rolagem { overflow-x:auto; }
table.p-tab { width:100%; border-collapse:collapse; font-size:13.5px; }
.p-tab th { text-align:left; font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-3,#66717F); padding:0 10px 8px 0; border-bottom:1px solid var(--line-soft,#EAE4D9); white-space:nowrap; }
.p-tab td { padding:9px 10px 9px 0; border-bottom:1px solid var(--line-soft,#EAE4D9); color:var(--ink-2,#54606F); vertical-align:top; }
.p-tab tr:last-child td { border-bottom:0; }
.p-tab .n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink,#10203A); }
.p-tab th.n { text-align:right; }
.p-tab .tit { color:var(--ink,#10203A); font-weight:500; }
.p-tab .tit a { color:inherit; text-decoration:underline; text-decoration-color:var(--line,#DED7CA); text-underline-offset:3px; }
.p-tab .emp { display:block; font-size:12.5px; color:var(--ink-3,#66717F); font-weight:400; }
.p-fora { font-size:11px; color:var(--ink-3,#66717F); border:1px solid var(--line,#DED7CA); border-radius:99px; padding:1px 7px; margin-left:6px; white-space:nowrap; }

.p-barras { display:grid; gap:9px; }
.p-barra { display:grid; grid-template-columns:minmax(90px,150px) 1fr 34px; align-items:center; gap:10px; font-size:13.5px; color:var(--ink-2,#54606F); }
.p-barra .trilho { height:9px; border-radius:99px; background:var(--bg-soft,#F1ECE3); overflow:hidden; }
.p-barra .trilho i { display:block; height:100%; border-radius:99px; background:var(--signal,#1A4893); }
.p-barra .q { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink,#10203A); }

.p-nota { font-size:12px; line-height:1.55; color:var(--ink-3,#66717F); margin:22px 4px 0; max-width:760px; }

/* cabeça do painel e abas */
.p-h1 { font-family:var(--display,'Hedvig Letters Serif',Georgia,serif); font-weight:400;
  font-size:clamp(28px,3.6vw,40px); line-height:1.1; letter-spacing:-0.015em; color:var(--ink,#10203A); margin:0 0 18px; }
.p-abas { display:flex; gap:4px; box-shadow:inset 0 -1px 0 var(--line,#DED7CA); margin-bottom:24px; overflow-x:auto; overflow-y:hidden; }
.p-abas button { font:inherit; font-size:14.5px; font-weight:500; color:var(--ink-2,#54606F); background:none; border:0;
  border-bottom:2px solid transparent; padding:11px 14px; cursor:pointer; white-space:nowrap; }
.p-abas button:hover { color:var(--ink,#10203A); }
.p-abas button[aria-selected="true"] { color:var(--ink,#10203A); font-weight:600; border-bottom-color:var(--signal,#1A4893); }
.p-conta { display:inline-block; min-width:20px; padding:1px 6px; margin-left:4px; border-radius:99px; font-size:12px; font-weight:600;
  text-align:center; color:#fff; background:#A85D24; }
.p-conta[hidden] { display:none; }
.p-sec > .p-grade:first-child { margin-top:0; }
.p-subtopo { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.p-subtopo p { font-size:14.5px; color:var(--ink-2,#54606F); margin:0; max-width:620px; line-height:1.55; }
.p-den { margin-bottom:14px; }
.p-den .md-campo textarea { min-height:70px; background:var(--bg,#F7F4EF); }
.p-den .p-citado { margin-top:12px; padding:10px 14px; border-left:3px solid var(--line,#DED7CA); font-size:14px; line-height:1.55; color:var(--ink,#10203A); white-space:pre-wrap; overflow-wrap:anywhere; }
.p-den .p-citado small { display:block; font-size:12px; color:var(--ink-3,#66717F); margin-bottom:2px; white-space:normal; }
.p-nota-at { margin-top:14px; padding-top:12px; border-top:1px solid var(--line-soft,#EAE4D9); font-size:14px; color:var(--ink,#10203A); }
.p-nota-at b { font-weight:600; }
.p-nota-at span { color:var(--ink-3,#66717F); font-size:13.5px; }
.p-nota-at p { margin:6px 0 0; line-height:1.55; overflow-wrap:anywhere; white-space:pre-wrap; }
.p-media { font-size:14px; color:var(--ink,#10203A); text-align:right; }
.p-media b { font-family:var(--display,'Hedvig Letters Serif',Georgia,serif); font-weight:400; font-size:26px; margin-right:4px; }
.p-media span { display:block; font-size:12.5px; color:var(--ink-3,#66717F); }
details.p-resolvidas { margin-top:22px; }
details.p-resolvidas > summary { cursor:pointer; font-size:14px; font-weight:600; color:var(--ink-2,#54606F); padding:6px 0 14px; }

/* mentorias: pedidos para aprovar e denúncias */
.p-pedido { border-top:1px solid var(--line-soft,#EAE4D9); padding:16px 0; }
.p-pedido:first-of-type { border-top:0; padding-top:4px; }
.p-pedido h3 { font-size:15.5px; font-weight:600; color:var(--ink,#10203A); margin:0 0 3px; }
.p-pedido .quem { font-size:13px; color:var(--ink-3,#66717F); margin-bottom:10px; overflow-wrap:anywhere; }
.p-pedido dl { margin:0; display:grid; gap:8px; }
.p-pedido dt { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3,#66717F); }
.p-pedido dd { margin:2px 0 0; font-size:14px; line-height:1.55; color:var(--ink,#10203A); white-space:pre-wrap; overflow-wrap:anywhere; }
.p-pedido dd a { color:var(--signal,#1A4893); }
.p-bts { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
.p-bts input { flex:1; min-width:200px; font:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line,#DED7CA); border-radius:10px; background:var(--bg,#F7F4EF); }
.p-dica { font-size:12.5px; color:var(--ink-3,#66717F); margin-top:8px; white-space:normal; }
.p-pessoa { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--line-soft,#EAE4D9); font-size:14.5px; color:var(--ink,#10203A); }
.p-pessoa:first-of-type { border-top:0; }
.p-pessoa span { display:block; font-size:12.5px; color:var(--ink-3,#66717F); overflow-wrap:anywhere; }
#equipe .p-bts { margin-top:14px; padding-top:14px; border-top:1px solid var(--line-soft,#EAE4D9); }
/* candidaturas de cada pessoa (em teste, banco/painel-candidaturas.sql) */
.p-busca { margin:14px 0 4px; }
.p-busca input { width:100%; font:inherit; font-size:14.5px; padding:11px 14px; border:1px solid var(--line,#DED7CA); border-radius:12px; background:var(--panel,#fff); color:var(--ink,#10203A); }
.p-cand { margin-top:10px; padding:0; }
.p-cand > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:14px; padding:15px 20px; }
.p-cand > summary::-webkit-details-marker { display:none; }
.p-cand .quem b { font-size:15px; font-weight:600; color:var(--ink,#10203A); }
.p-cand .quem span { display:block; font-size:12.5px; color:var(--ink-3,#66717F); overflow-wrap:anywhere; margin-top:2px; }
.p-cand .etapas { display:flex; flex-wrap:wrap; align-items:center; gap:6px; justify-content:flex-end; }
.p-cand .etapas .e { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; margin-right:6px; }
.p-cand .etapas i { font-style:normal; font-size:12.5px; color:var(--ink-2,#54606F); font-variant-numeric:tabular-nums; }
.p-cand .tot { font-size:13px; color:var(--ink-2,#54606F); white-space:nowrap; }
.p-cand .tot::after { content:"›"; display:inline-block; margin-left:10px; color:var(--ink-3,#66717F); transition:transform .15s; }
.p-cand[open] .tot::after { transform:rotate(90deg); }
.p-cand .p-rolagem { padding:0 20px 12px; border-top:1px solid var(--line-soft,#EAE4D9); }
.p-cand .p-tab { margin-top:8px; }
.p-cand tr.achou td { background:#FBF6EC; }
.p-etapa { display:inline-block; font-size:11.5px; font-weight:600; line-height:1.5; padding:1px 9px; border-radius:99px; border:1px solid; white-space:nowrap; }
@media (max-width:700px){ .p-cand > summary { grid-template-columns:1fr auto; } .p-cand .etapas { grid-column:1 / -1; grid-row:2; justify-content:flex-start; } }
@media (max-width:900px){ .p-nums { grid-template-columns:repeat(2,1fr); } .p-grade { grid-template-columns:1fr; } }
@media (max-width:520px){ .p-num .val { font-size:32px; } .p-main { padding-top:30px; } }
</style>
</head>
<body>

<main class="p-main">
  <div class="p-espera" id="espera">Abrindo…</div>

  <!-- Só aparece para quem é da equipe. Cada aba mostra uma parte do painel. -->
  <div id="cabeca" hidden>
    <div class="eyebrow">Administração</div>
    <h1 class="p-h1">Painel da equipe</h1>
    <nav class="p-abas" id="abas" role="tablist" aria-label="Partes do painel">
      <button type="button" role="tab" data-aba="mentorias">Mentorias <span class="p-conta" id="nPedidos" hidden></span></button>
      <button type="button" role="tab" data-aba="denuncias">Denúncias <span class="p-conta" id="nDenuncias" hidden></span></button>
      <button type="button" role="tab" data-aba="numeros">Números</button>
      <button type="button" role="tab" data-aba="candidaturas">Candidaturas</button>
      <button type="button" role="tab" data-aba="equipe">Equipe</button>
    </nav>
  </div>

  <div class="p-sec" data-sec="mentorias" id="secMentorias" hidden></div>
  <div class="p-sec" data-sec="denuncias" id="secDenuncias" hidden></div>
  <div class="p-sec" data-sec="numeros" hidden>
    <div class="p-espera" id="esperaNum" hidden></div>
    <div id="painel" hidden></div>
  </div>
  <div class="p-sec" data-sec="candidaturas" id="secCand" hidden></div>
  <div class="p-sec" data-sec="equipe" id="equipe" hidden></div>
  <div class="md-msg" id="mentMsg" role="status" hidden></div>
</main>

<script src="layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<script src="mentorias-dados.js?v=9"></script>
<script>
try { montarLayout(""); } catch (e) { console.warn("layout.js não carregou", e); }

(function () {
  "use strict";

  // os mesmos do controle-conta.js; a chave é a publicável
  const ENDERECO = "https://zrqucjktympnwilbvisw.supabase.co";
  const CHAVE_PUBLICA = "sb_publishable_4X7Cyykz9ZDMWOTvauxibA_Tpa4KtAh";

  const espera = document.getElementById("espera");
  const painel = document.getElementById("painel");

  const ESTADOS = [
    ["aplicado", "Currículo enviado"], ["teste", "Teste"], ["entrevista", "Entrevista"],
    ["aprovado", "Aprovado"], ["recusado", "Recusado"], ["banco", "Banco de talentos"],
    ["semresposta", "Sem resposta"], ["desisti", "Desisti"],
  ];
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

  const num = n => (Number(n) || 0).toLocaleString("pt-BR");
  const pct = (parte, todo) => todo ? Math.round(100 * parte / todo) + "%" : "–";

  const esperaNum = document.getElementById("esperaNum");
  function dizer(texto) { painel.hidden = true; esperaNum.hidden = false; esperaNum.textContent = texto; }

  function cartao(rotulo, valor, detalhe) {
    return `<div class="p-num"><div class="rot">${esc(rotulo)}</div><div class="val">${valor}</div><div class="det">${detalhe}</div></div>`;
  }

  function barras(linhas) {
    if (!linhas.length) return `<div class="p-vazio">Ainda sem dados.</div>`;
    const maior = Math.max.apply(null, linhas.map(l => l[1])) || 1;
    return `<div class="p-barras">${linhas.map(l => `
      <div class="p-barra"><span>${esc(l[0])}</span>
        <span class="trilho"><i style="width:${Math.max(2, Math.round(100 * l[1] / maior))}%"></i></span>
        <span class="q">${num(l[1])}</span></div>`).join("")}</div>`;
  }

  function desenhar(t) {
    const c = t.contas || {}, u = t.uso || {}, ca = t.candidaturas || {}, tr = t.trabalhos || {};

    const nums = `<div class="p-nums">
      ${cartao("Contas", num(c.total), `${num(c.novas_7d)} nos últimos 7 dias · ${num(c.novas_30d)} em 30 dias`)}
      ${cartao("Entraram em 30 dias", num(c.ativas_30d), `${num(c.ativas_7d)} nos últimos 7 dias · ${num(c.confirmadas)} com e-mail confirmado`)}
      ${cartao("Candidaturas", num(ca.total), `${num(ca.do_hub)} em vagas do Hub · ${num(u.com_candidaturas)} ${u.com_candidaturas === 1 ? "pessoa registra" : "pessoas registram"}`)}
      ${cartao("Avançaram", pct(ca.positivas, ca.total), `${num(ca.positivas)} chegaram a teste, entrevista ou aprovação · ${num(ca.aprovadas)} aprovadas`)}
    </div>`;

    const vagas = (t.vagas || []);
    const tabVagas = vagas.length ? `<div class="p-rolagem"><table class="p-tab">
        <thead><tr><th>Vaga</th><th class="n">Pessoas</th><th class="n">Avançaram</th><th class="n">Aprovadas</th></tr></thead>
        <tbody>${vagas.map(v => `<tr>
          <td class="tit">${v.vaga_id
              ? `<a href="vaga.html?id=${encodeURIComponent(v.vaga_id)}">${esc(v.titulo)}</a>`
              : `${esc(v.titulo)}<span class="p-fora" title="A pessoa cadastrou à mão; não veio da lista do Hub">de fora</span>`}
            <span class="emp">${esc(v.empresa)}</span></td>
          <td class="n">${num(v.pessoas)}</td>
          <td class="n">${num(v.positivas)} <span style="color:var(--ink-3,#66717F)">(${pct(v.positivas, v.candidaturas)})</span></td>
          <td class="n">${num(v.aprovadas)}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="p-vazio">Ninguém registrou candidatura ainda.</div>`;

    const empresas = (t.empresas || []);
    const tabEmpresas = empresas.length ? `<div class="p-rolagem"><table class="p-tab">
        <thead><tr><th>Empresa</th><th class="n">Candidaturas</th><th class="n">Avançaram</th><th class="n">Recusadas</th></tr></thead>
        <tbody>${empresas.map(e => `<tr>
          <td class="tit">${esc(e.empresa)}</td>
          <td class="n">${num(e.candidaturas)}</td>
          <td class="n">${num(e.positivas)} <span style="color:var(--ink-3,#66717F)">(${pct(e.positivas, e.candidaturas)})</span></td>
          <td class="n">${num(e.recusadas)}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="p-vazio">Ainda sem dados.</div>`;

    const porEstado = t.por_estado || {};
    const conhecidos = ESTADOS.map(e => e[0]);
    const linhasEstado = ESTADOS.filter(e => porEstado[e[0]]).map(e => [e[1], porEstado[e[0]]])
      .concat(Object.keys(porEstado).filter(k => conhecidos.indexOf(k) < 0).map(k => [k, porEstado[k]]));

    const linhasOrigem = (t.por_origem || []).map(o => [o.origem, o.n]);
    const linhasMes = (t.por_mes || []).map(m => {
      const p = String(m.mes).split("-");
      return [(MESES[+p[1] - 1] || p[1]) + " de " + p[0], m.n];
    });
    const linhasSemana = (t.contas_por_semana || []).map(s => {
      const p = String(s.semana).split("-");
      return ["semana de " + p[2] + "/" + p[1], s.n];
    });
    const linhasTrab = (t.trabalhos_por_empresa || []).map(x => [x.empresa, x.pessoas]);

    const quando = t.gerado_em ? new Date(t.gerado_em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";

    painel.innerHTML = `
      <div class="p-subtopo">
        <p>Os números do Hub somados. Aqui não aparece nome, e-mail nem ganho de ninguém.</p>
        <div>
          <button class="p-atualizar" type="button" id="atualizar">Atualizar números</button>
          <div class="p-quando">${quando ? "Lido em " + esc(quando) : ""}</div>
        </div>
      </div>

      ${nums}

      <div class="p-grade">
        <section class="p-cx larga">
          <h2>Vagas com mais candidaturas</h2>
          <p class="sub">Quantas pessoas registraram candidatura em cada vaga e quantas passaram da primeira etapa.</p>
          ${tabVagas}
        </section>

        <section class="p-cx larga">
          <h2>Empresas</h2>
          <p class="sub">Somando todas as vagas de cada empresa. "Avançaram" conta teste, entrevista e aprovação.</p>
          ${tabEmpresas}
        </section>

        <section class="p-cx">
          <h2>Em que etapa estão as candidaturas</h2>
          <p class="sub">A situação que cada pessoa marcou por último.</p>
          ${barras(linhasEstado)}
        </section>

        <section class="p-cx">
          <h2>Onde as pessoas viram a vaga</h2>
          <p class="sub">O campo "Onde você viu" da candidatura.</p>
          ${barras(linhasOrigem)}
        </section>

        <section class="p-cx">
          <h2>Candidaturas por mês</h2>
          <p class="sub">Pela data de envio que a pessoa informou.</p>
          ${barras(linhasMes)}
        </section>

        <section class="p-cx">
          <h2>Contas novas por semana</h2>
          <p class="sub">Últimas 12 semanas.</p>
          ${barras(linhasSemana)}
        </section>

        <section class="p-cx">
          <h2>Uso do Meu Controle</h2>
          <p class="sub">Quantas contas usam cada parte da ferramenta.</p>
          ${barras([
            ["Registram candidaturas", u.com_candidaturas || 0],
            ["Têm trabalho cadastrado", u.com_trabalhos || 0],
            ["Lançam horas ou tarefas", u.com_registros || 0],
          ])}
          <p class="sub" style="margin:14px 0 0">${num(tr.total)} ${tr.total === 1 ? "trabalho cadastrado" : "trabalhos cadastrados"}, ${num(tr.ativos)} em andamento.</p>
        </section>

        <section class="p-cx">
          <h2>Onde as pessoas estão trabalhando</h2>
          <p class="sub">Quantas pessoas têm trabalho cadastrado em cada empresa.</p>
          ${barras(linhasTrab)}
        </section>
      </div>

      <p class="p-nota">Com poucas contas, um total pode ser de uma pessoa só: trate estes números como retrato geral, não como informação sobre alguém.
        As vagas marcadas "de fora" foram cadastradas à mão por alguém e não vieram da lista do Hub.</p>`;

    esperaNum.hidden = true;
    painel.hidden = false;
    document.getElementById("atualizar").addEventListener("click", carregar);
  }

  let cli = null;

  async function carregar() {
    if (!cli) { dizer("Os números não aparecem no modo de demonstração."); return; }
    dizer("Buscando os números…");
    const r = await cli.rpc("painel_totais");
    if (r.error) {
      console.warn(r.error);
      dizer("Não deu para buscar os números agora. Confira a internet e clique na aba de novo.");
      return;
    }
    desenhar(r.data || {});
  }

  /* ══════════════════════════════════════════════════════════
     CANDIDATURAS: o que cada pessoa registrou no Meu Controle.
     Em teste (banco/painel-candidaturas.sql): só a equipe vê, e o
     banco não manda as observações pessoais de cada candidatura.
     ══════════════════════════════════════════════════════════ */
  const secCand = document.getElementById("secCand");
  const COR_ETAPA = {   // as mesmas cores das etapas no Meu Controle
    aplicado: ["#F1ECE3", "#54606F", "#DED7CA"], teste: ["#EAF1F8", "#1A4893", "#D3E2F1"],
    entrevista: ["#FBF0E4", "#A85D24", "#F0DCC6"], aprovado: ["#E4F3F0", "#1F7A6E", "#C6E5DE"],
    recusado: ["#FBE9EB", "#8E2233", "#F1CDD2"], semresposta: ["#F7F4EF", "#66717F", "#EAE4D9"],
    banco: ["#F1EEF7", "#5B4B9E", "#DFD8EE"],
  };
  const nomeEtapa = id => (ESTADOS.find(e => e[0] === id) || [id, id])[1];
  const selo = id => {
    const c = COR_ETAPA[id] || COR_ETAPA.semresposta;
    return `<span class="p-etapa" style="background:${c[0]};color:${c[1]};border-color:${c[2]}">${esc(nomeEtapa(id))}</span>`;
  };
  const diaBR = d => /^\d{4}-\d{2}-\d{2}/.test(d || "") ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "";
  function haQuanto(iso) {
    const t = Date.parse(iso || "");
    if (isNaN(t)) return "";
    const dias = Math.floor((Date.now() - t) / 86400000);
    return dias <= 0 ? "hoje" : dias === 1 ? "ontem" : dias <= 30 ? `há ${dias} dias` : "em " + diaBR(new Date(t).toISOString());
  }
  let CAND = null, buscaCand = "", candLidas = false;

  async function carregarCand() {
    if (!cli) { secCand.innerHTML = `<div class="p-espera">As candidaturas não aparecem no modo de demonstração.</div>`; return; }
    secCand.innerHTML = `<div class="p-espera">Buscando as candidaturas…</div>`;
    const r = await cli.rpc("admin_candidaturas");
    if (r.error) {
      console.warn(r.error);
      candLidas = false;
      secCand.innerHTML = `<div class="p-espera">Não deu para buscar as candidaturas agora. Confira a internet e clique na aba de novo.</div>`;
      return;
    }
    CAND = r.data || {};
    desenharCand();
  }

  function desenharCand() {
    const pessoas = CAND.pessoas || [];
    const todas = pessoas.reduce((s, p) => s.concat(p.candidaturas || []), []);
    const avancaram = todas.filter(c => ["teste", "entrevista", "aprovado"].indexOf(c.estado) >= 0).length;
    const ativas = pessoas.filter(p => Date.now() - Date.parse(p.ultima) < 7 * 86400000).length;
    const media = pessoas.length ? (todas.length / pessoas.length).toFixed(1).replace(".", ",") : "";
    const quando = CAND.gerado_em ? new Date(CAND.gerado_em).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : "";

    secCand.innerHTML = `
      <div class="p-subtopo">
        <p>O que cada pessoa registrou no Meu Controle: em que vaga se candidatou e em que etapa está.
          Em teste: só a equipe vê esta aba, e as observações pessoais de cada candidatura não aparecem.</p>
        <div>
          <button class="p-atualizar" type="button" id="atualizarCand">Atualizar</button>
          <div class="p-quando">${quando ? "Lido em " + esc(quando) : ""}</div>
        </div>
      </div>
      <div class="p-nums">
        ${cartao("Pessoas", num(pessoas.length), `registram candidaturas, de ${num(CAND.contas)} ${CAND.contas === 1 ? "conta" : "contas"} no Hub`)}
        ${cartao("Candidaturas", num(todas.length), media ? media + " por pessoa, em média" : "–")}
        ${cartao("Avançaram", pct(avancaram, todas.length), `${num(avancaram)} chegaram a teste, entrevista ou aprovação`)}
        ${cartao("Ativas na semana", num(ativas), `${ativas === 1 ? "pessoa mexeu" : "pessoas mexeram"} nas candidaturas nos últimos 7 dias`)}
      </div>
      <div class="p-busca"><input type="search" id="buscaCand" placeholder="Buscar por nome, e-mail, vaga ou empresa" value="${esc(buscaCand)}" autocomplete="off"></div>
      <div id="listaCand"></div>`;

    document.getElementById("atualizarCand").addEventListener("click", carregarCand);
    document.getElementById("buscaCand").addEventListener("input", ev => { buscaCand = ev.target.value; listarCand(); });
    listarCand();
  }

  /* A busca acha a pessoa pelo nome ou e-mail, ou pela vaga e empresa de
     alguma candidatura; nesse caso a pessoa já aparece aberta e a linha
     que casou fica marcada. */
  function listarCand() {
    const alvo = document.getElementById("listaCand");
    if (!alvo) return;
    const pessoas = CAND.pessoas || [];
    const q = buscaCand.trim().toLowerCase();
    const casa = t => String(t || "").toLowerCase().indexOf(q) >= 0;
    const lista = !q ? pessoas.map(p => [p, false]) : pessoas.map(p => {
      if (casa(p.nome) || casa(p.email)) return [p, false];
      return (p.candidaturas || []).some(c => casa(c.titulo) || casa(c.empresa)) ? [p, true] : null;
    }).filter(Boolean);
    if (!pessoas.length) { alvo.innerHTML = `<section class="p-cx"><div class="p-vazio">Ninguém registrou candidatura ainda.</div></section>`; return; }
    if (!lista.length) { alvo.innerHTML = `<section class="p-cx"><div class="p-vazio">Nada encontrado para "${esc(buscaCand.trim())}".</div></section>`; return; }
    alvo.innerHTML = lista.map(([p, abrir]) => pessoaCand(p, abrir, q)).join("");
  }

  function pessoaCand(p, abrir, q) {
    const cs = p.candidaturas || [];
    const porEtapa = {};
    cs.forEach(c => { porEtapa[c.estado] = (porEtapa[c.estado] || 0) + 1; });
    const etapas = ESTADOS.map(e => e[0]).filter(id => porEtapa[id])
      .concat(Object.keys(porEtapa).filter(id => !ESTADOS.some(e => e[0] === id)));
    const linhas = cs.map(c => {
      const achou = q && (String(c.titulo).toLowerCase().indexOf(q) >= 0 || String(c.empresa).toLowerCase().indexOf(q) >= 0);
      return `<tr${achou ? ' class="achou"' : ""}>
        <td class="tit">${c.vaga_id
            ? `<a href="vaga.html?id=${encodeURIComponent(c.vaga_id)}">${esc(c.titulo)}</a>`
            : `${esc(c.titulo)}<span class="p-fora" title="A pessoa cadastrou à mão; não veio da lista do Hub">de fora</span>`}
          <span class="emp">${esc(c.empresa)}</span></td>
        <td>${selo(c.estado)}</td>
        <td>${esc(diaBR(c.data)) || "–"}</td>
        <td>${esc(c.origem) || "–"}</td>
        <td>${c.proximo ? esc(c.proximo) + (c.proximo_em ? `<span class="emp">${esc(diaBR(c.proximo_em) || c.proximo_em)}</span>` : "") : "–"}</td>
      </tr>`;
    }).join("");
    return `<details class="p-cx p-cand"${abrir ? " open" : ""}>
      <summary>
        <span class="quem"><b>${esc(p.nome || p.email || "Sem nome")}</b>
          <span>${p.nome ? esc(p.email) + " · " : ""}última mudança ${esc(haQuanto(p.ultima))}</span></span>
        <span class="etapas">${etapas.map(id => `<span class="e">${selo(id)}<i>${num(porEtapa[id])}</i></span>`).join("")}</span>
        <span class="tot">${num(cs.length)} ${cs.length === 1 ? "candidatura" : "candidaturas"}</span>
      </summary>
      <div class="p-rolagem"><table class="p-tab">
        <thead><tr><th>Vaga</th><th>Etapa</th><th>Enviada em</th><th>Onde viu</th><th>Próximo passo</th></tr></thead>
        <tbody>${linhas}</tbody></table></div>
    </details>`;
  }

  /* ══════════════════════════════════════════════════════════
     ABAS: uma parte do painel de cada vez. A aba aberta fica no
     endereço (#denuncias), para o link e o F5 voltarem nela.
     ══════════════════════════════════════════════════════════ */
  const ABAS = ["mentorias", "denuncias", "numeros", "candidaturas", "equipe"];
  let numerosLidos = false;
  function abrirAba(nome, semMexerNoEndereco) {
    if (ABAS.indexOf(nome) < 0) nome = "mentorias";
    document.querySelectorAll("#abas [data-aba]").forEach(b => b.setAttribute("aria-selected", b.dataset.aba === nome ? "true" : "false"));
    document.querySelectorAll(".p-sec").forEach(s => { s.hidden = s.dataset.sec !== nome; });
    document.getElementById("mentMsg").hidden = true;
    if (!semMexerNoEndereco) { try { history.replaceState(null, "", "#" + nome); } catch (e) {} }
    // os números só são buscados quando alguém abre a aba deles
    if (nome === "numeros" && !numerosLidos) { numerosLidos = true; carregar(); }
    if (nome === "candidaturas" && !candLidas) { candLidas = true; carregarCand(); }
  }
  document.getElementById("abas").addEventListener("click", ev => {
    const b = ev.target.closest("[data-aba]"); if (b) abrirAba(b.dataset.aba);
  });
  function contar(id, n) { const c = document.getElementById(id); c.textContent = n; c.hidden = !n; }

  /* ══════════════════════════════════════════════════════════
     MENTORIAS e DENÚNCIAS
     Usa as mesmas funções do banco das páginas de mentoria. Uma
     leitura só alimenta as duas abas e os contadores delas.
     Devolve false se o banco disser que a pessoa não é da equipe.
     ══════════════════════════════════════════════════════════ */
  const secMent = document.getElementById("secMentorias");
  const secDen = document.getElementById("secDenuncias");
  const rascunhos = {};   // resposta que a equipe estava escrevendo, por denúncia

  async function mentoriasAdmin() {
    if (typeof MD === "undefined") return false;
    let d;
    try { d = await MD.adminTudo(); } catch (e) { console.warn(e); return false; }
    const U = MD.ui;
    U.porCss();
    const pend = d.mentorias.filter(m => m.status === "pendente");
    const outras = d.mentorias.filter(m => m.status !== "pendente");
    const den = d.denuncias.filter(x => !x.resolvida);
    const resolvidas = d.denuncias.filter(x => x.resolvida);
    const NOME = { aprovada: "no ar", recusada: "recusada", encerrada: "encerrada", pendente: "em análise" };
    contar("nPedidos", pend.length);
    contar("nDenuncias", den.length);

    const pedido = m => `<div class="p-pedido">
      <h3>${esc(m.vaga_titulo)} · ${esc(m.empresa)}</h3>
      <div class="quem">${esc(m.mentor.nome)} · ${esc(m.mentor_email || "")} · pedido ${esc(U.haQuanto(m.criado_em))}</div>
      <dl>
        <div><dt>Link de indicação</dt><dd><a href="${esc(urlSegura(m.link) || "#")}" target="_blank" rel="noopener nofollow">${esc(m.link)}</a></dd></div>
        <div><dt>Comprovação (só a equipe lê)</dt><dd>${U.texto(m.comprovacao)}</dd>
          ${m.provas ? `<div class="md-provas" data-provas-de="${esc(m.id)}"><span class="p-vazio">Abrindo ${m.provas === 1 ? "a imagem" : "as " + m.provas + " imagens"}…</span></div>
            <div class="p-dica">Clique numa imagem para ver em tamanho grande.</div>` : `<div class="p-dica">Nenhuma imagem anexada.</div>`}</div>
        <div><dt>Apresentação</dt><dd>${esc(m.apresentacao)}</dd></div>
        <div><dt>Como vai ajudar</dt><dd>${esc(m.como_ajuda)}</dd></div>
      </dl>
      <div class="p-bts">
        <button class="md-bt pequeno" data-decidir="aprovada" data-id="${esc(m.id)}">Aprovar</button>
        <input type="text" maxlength="300" placeholder="Motivo, se for recusar (o mentor lê)" data-motivo="${esc(m.id)}">
        <button class="md-bt claro pequeno" data-decidir="recusada" data-id="${esc(m.id)}">Recusar</button>
      </div></div>`;

    secMent.innerHTML = `<div class="p-grade">
        <section class="p-cx larga"><h2>Pedidos para ser mentor</h2>
          <p class="sub">${pend.length ? "Confira a comprovação antes de aprovar. Se precisar de mais prova, escreva para o e-mail da pessoa." : ""}</p>
          ${pend.length ? pend.map(pedido).join("") : `<div class="p-vazio">Nenhum pedido esperando análise.</div>`}
        </section>
        <section class="p-cx larga"><h2>Todas as mentorias</h2><p class="sub">Para encerrar uma mentoria no ar ou reabrir a análise de uma recusada.</p>
          ${outras.length ? `<div class="p-rolagem"><table class="p-tab"><thead><tr><th>Mentoria</th><th>Situação</th><th class="n">Participantes</th><th class="n">Nota</th><th></th></tr></thead><tbody>
            ${outras.map(m => `<tr><td class="tit"><a href="mentoria.html?id=${encodeURIComponent(m.id)}">${esc(m.vaga_titulo)}</a><span class="emp">${esc(m.mentor.nome)} · ${esc(m.empresa)}</span></td>
              <td>${esc(NOME[m.status] || m.status)}</td><td class="n">${num(m.membros)}</td><td class="n">${m.nota ? String(m.nota).replace(".", ",") : "–"}</td>
              <td class="n">${m.status === "aprovada" ? `<button class="md-link" data-decidir="encerrada" data-id="${esc(m.id)}">encerrar</button>`
                : `<button class="md-link" data-decidir="pendente" data-id="${esc(m.id)}">voltar para análise</button>`}</td></tr>`).join("")}
            </tbody></table></div>` : `<div class="p-vazio">Ainda não há mentoria aprovada.</div>`}
        </section>
      </div>`;

    /* Uma denúncia: do que se trata, a conversa com quem denunciou e, se
       ainda estiver aberta, o campo para a equipe responder. */
    const denuncia = x => `<section class="p-cx p-den">
        <h2>${x.tipo === "post" ? "Mensagem no mural" : "Mentoria inteira"}${x.mentoria_titulo ? " · " + esc(x.mentoria_titulo) : ""}</h2>
        <p class="sub">denunciado por ${esc(x.quem.nome)} ${esc(U.haQuanto(x.criado_em))}${x.resolvida ? " · resolvida" : ""}</p>
        ${x.post ? `<div class="p-citado"><small>A mensagem denunciada, de ${esc(x.post.autor.nome)}${x.post.removido ? " (já apagada)" : ""}</small>${esc(x.post.texto)}</div>` : ""}
        ${U.conversa(x, x.quem.nome)}
        ${x.resolvida ? `<div class="p-nota-at">${x.nota
            ? `<b>Nota do atendimento:</b> ${U.estrelas(x.nota)} ${x.nota_comentario ? `<p>${esc(x.nota_comentario)}</p>` : `<span>sem comentário</span>`}`
            : `<span>${esc(x.quem.nome)} ainda não avaliou o atendimento.</span>`}</div>` : ""}
        ${x.resolvida ? "" : `<label class="md-campo"><span>Responder a ${esc(x.quem.nome)}</span>
            <small>Só ${esc(x.quem.nome)} lê. A resposta aparece para a pessoa na página Mentorias, como "Equipe do Hub".</small>
            <textarea maxlength="2000" data-resposta="${esc(x.id)}" placeholder="Peça mais detalhes ou conte o que foi feito">${esc(rascunhos[x.id] || "")}</textarea></label>`}
        <div class="p-bts">
          ${x.resolvida ? "" : `<button class="md-bt pequeno" data-responder="${esc(x.id)}">Enviar resposta</button>`}
          ${x.mentoria_id ? `<a class="md-bt claro pequeno" href="mentoria.html?id=${encodeURIComponent(x.mentoria_id)}">Abrir a mentoria</a>` : ""}
          ${!x.resolvida && x.post && !x.post.removido ? `<button class="md-bt claro pequeno" data-apagar-post="${esc(x.alvo_id)}" data-den="${esc(x.id)}">Apagar a mensagem</button>` : ""}
          ${x.resolvida ? "" : `<button class="md-bt claro pequeno" data-resolver="${esc(x.id)}">Marcar como resolvida</button>`}
        </div></section>`;

    const comNota = resolvidas.filter(x => x.nota);
    const media = comNota.length ? (comNota.reduce((s, x) => s + x.nota, 0) / comNota.length).toFixed(1).replace(".", ",") : "";
    const estavaAberto = !!(secDen.querySelector("details.p-resolvidas") || {}).open;
    secDen.innerHTML = `
      <div class="p-subtopo"><p>O que os participantes denunciaram. Você pode conversar com quem denunciou antes de decidir;
        depois de marcar como resolvida, a conversa fecha e a pessoa pode dar uma nota ao atendimento.</p>
        ${media ? `<div class="p-media"><b>${media}</b> ${U.estrelas(Math.round(comNota.reduce((s, x) => s + x.nota, 0) / comNota.length))}
          <span>nota média do atendimento, em ${comNota.length} ${comNota.length === 1 ? "avaliação" : "avaliações"}</span></div>` : ""}</div>
      ${den.length ? den.map(denuncia).join("") : `<section class="p-cx"><div class="p-vazio">Nenhuma denúncia em aberto.</div></section>`}
      ${resolvidas.length ? `<details class="p-resolvidas"${estavaAberto ? " open" : ""}><summary>Resolvidas (${resolvidas.length})</summary>${resolvidas.map(denuncia).join("")}</details>` : ""}`;

    // os prints vêm depois, um pedido de cada vez, para a página não demorar a abrir
    secMent.querySelectorAll("[data-provas-de]").forEach(async cx => {
      try {
        const imgs = ((await MD.provas(cx.dataset.provasDe)) || []).filter(U.ehImagem);
        cx.innerHTML = imgs.map((p, i) => `<div class="md-prova"><img data-ampliar src="${p}" alt="Comprovante ${i + 1}"></div>`).join("");
      } catch (e) { cx.innerHTML = `<span class="p-vazio">Não deu para abrir as imagens: ${esc(e.message)}</span>`; }
    });
    return true;
  }

  secDen.addEventListener("input", ev => {
    const c = ev.target.closest("[data-resposta]"); if (c) rascunhos[c.dataset.resposta] = c.value;
  });

  async function cliqueMentorias(ev) {
    const alvo = ev.currentTarget;
    const b = ev.target.closest("button"); if (!b) return;
    const d2 = b.dataset, U = MD.ui;
    const msg = document.getElementById("mentMsg");
    msg.hidden = true;
    try {
      if (d2.decidir) {
        const campo = alvo.querySelector('[data-motivo="' + d2.id + '"]');
        const motivo = campo ? campo.value.trim() : "";
        if (d2.decidir === "recusada" && motivo.length < 3) { campo.focus(); campo.placeholder = "Escreva o motivo da recusa"; return; }
        if (d2.decidir === "encerrada" && !(await U.confirmar({ titulo: "Encerrar esta mentoria?",
          texto: "Ela sai da lista, não entram novos participantes e o mural fica só para leitura. O mentor é avisado na página dela.", botao: "Encerrar a mentoria" }))) return;
        b.disabled = true;
        await MD.adminDecidir(d2.id, d2.decidir, d2.decidir === "recusada" ? motivo : "");
      } else if (d2.responder) {
        const campo = alvo.querySelector('[data-resposta="' + d2.responder + '"]');
        const texto = campo.value.trim();
        if (!texto) { campo.focus(); return; }
        b.disabled = true;
        await MD.responderDenuncia(d2.responder, texto, true);
        delete rascunhos[d2.responder];
      } else if (d2.apagarPost) {
        if (!(await U.confirmar({ titulo: "Apagar esta mensagem?",
          texto: "Ela some do mural para todo mundo e não dá para trazer de volta. A denúncia continua aberta até você marcar como resolvida.", botao: "Apagar a mensagem" }))) return;
        b.disabled = true;
        await MD.apagarPost(d2.apagarPost);
      } else if (d2.resolver) {
        if (!(await U.confirmar({ titulo: "Marcar como resolvida?", perigo: false,
          texto: "A denúncia sai da lista de abertas e a conversa fecha: a pessoa lê o que foi escrito, não consegue mais responder e é convidada a dar uma nota ao atendimento.", botao: "Marcar como resolvida" }))) return;
        b.disabled = true;
        await MD.adminResolver(d2.resolver);
      } else return;
      await mentoriasAdmin();
    } catch (e) { msg.textContent = e.message; msg.className = "md-msg erro"; msg.hidden = false; b.disabled = false; }
  }
  secMent.addEventListener("click", cliqueMentorias);
  secDen.addEventListener("click", cliqueMentorias);

  /* ══════════════════════════════════════════════════════════
     EQUIPE: quem entra neste painel
     Todos da equipe veem a lista; só o dono do site inclui ou tira
     alguém. A regra está no banco (banco/mentorias-2.sql).
     ══════════════════════════════════════════════════════════ */
  async function equipe(aviso) {
    const alvo = document.getElementById("equipe");
    if (typeof MD === "undefined") return;
    let d;
    try { d = await MD.equipe(); } catch (e) { alvo.innerHTML = ""; return; }
    MD.ui.porCss();
    const pessoas = d.pessoas || [];
    alvo.innerHTML = `<div class="p-grade"><section class="p-cx larga"><h2>Equipe</h2>
      <p class="sub">Quem está nesta lista abre este painel, aprova mentores e cuida das denúncias. Ninguém mais consegue: o servidor recusa.
        ${d.sou_dono ? "" : "Só o dono do site inclui ou tira pessoas."}</p>
      ${pessoas.map(p => `<div class="p-pessoa"><div><b>${esc(p.nome || p.email)}</b>${p.eu ? " (você)" : ""}
          <span>${p.nome ? esc(p.email) + " · " : ""}${p.dono ? "dono do site" : "equipe"}</span></div>
        ${d.sou_dono && !p.dono && !p.eu ? `<button class="md-link" type="button" data-tirar="${esc(p.id)}">tirar da equipe</button>` : ""}</div>`).join("")}
      ${d.sou_dono ? `<form class="p-bts" id="eqForm" novalidate>
          <input type="email" id="eqEmail" maxlength="200" placeholder="E-mail da conta da pessoa no Hub" autocomplete="off">
          <button class="md-bt pequeno" type="submit">Incluir na equipe</button></form>
        <div class="p-dica">A pessoa precisa já ter criado a conta no site, com este mesmo e-mail.</div>` : ""}
      <div class="md-msg${aviso ? " " + aviso[1] : ""}" id="eqMsg" role="status"${aviso ? "" : " hidden"}>${aviso ? esc(aviso[0]) : ""}</div>
    </section></div>`;

    const dizerEq = (t, tipo) => { const m = alvo.querySelector("#eqMsg"); m.textContent = t; m.className = "md-msg " + tipo; m.hidden = false; };
    const form = alvo.querySelector("#eqForm");
    if (form) form.addEventListener("submit", async ev => {
      ev.preventDefault();
      const campo = alvo.querySelector("#eqEmail"), em = campo.value.trim();
      if (!/^\S+@\S+\.\S+$/.test(em)) { campo.focus(); dizerEq("Escreva o e-mail da conta da pessoa.", "erro"); return; }
      const bt = form.querySelector("button"); bt.disabled = true;
      try { await MD.equipeAdicionar(em); equipe([em + " agora faz parte da equipe.", "ok"]); }
      catch (e) { dizerEq(e.message, "erro"); bt.disabled = false; }
    });
    alvo.onclick = async ev => {
      const b = ev.target.closest("[data-tirar]"); if (!b) return;
      if (!(await MD.ui.confirmar({ titulo: "Tirar esta pessoa da equipe?",
        texto: "Ela deixa de abrir o painel, de aprovar mentores e de ver as denúncias. A conta dela no Hub continua normal.", botao: "Tirar da equipe" }))) return;
      b.disabled = true;
      try { await MD.equipeRemover(b.dataset.tirar); equipe(["Pessoa tirada da equipe.", "ok"]); }
      catch (e) { dizerEq(e.message, "erro"); b.disabled = false; }
    };
  }

  (async function () {
    const demo = typeof MD !== "undefined" && MD.demo;   // só no localhost, com dados de exemplo
    if (!demo) {
      if (typeof supabase === "undefined" || !supabase.createClient) {
        espera.textContent = "Não deu para falar com o servidor de contas. Confira a internet e recarregue a página.";
        return;
      }
      cli = supabase.createClient(ENDERECO, CHAVE_PUBLICA, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
      });
      let sessao = null;
      try { sessao = (await cli.auth.getSession()).data.session; } catch (e) { console.warn(e); }
      if (!sessao) {
        espera.outerHTML = Acesso.htmlAviso("O painel é só para a equipe do Hub", "Entre na sua conta para continuar.");
        return;
      }
    }
    // a primeira leitura também serve de porteiro: o banco recusa quem não é da equipe
    if (!(await mentoriasAdmin())) {
      espera.textContent = "Esta página é só para a equipe do Hub.";
      return;
    }
    espera.hidden = true;
    document.getElementById("cabeca").hidden = false;
    abrirAba(location.hash.slice(1), true);
    equipe();
  })();
})();
</script>

</body>
</html>
